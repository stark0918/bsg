<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>劇空間棒球 ～ GEKIKUUKAN BASEBALL</title>
<style>
:root{
  --paper:#f5f0e1; --ink:#20241f; --dark:#123021; --dark2:#0b1f15;
  --accent:#b11414; --gold:#f2c14e; --led:#ffc23f; --ledbg:#0a0f0b;
  --line:#c9bfa4; --muted:#6b6455;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 600px at 50% -10%, #1c4a30 0%, #0d2416 55%, #071009 100%);
  color:var(--ink);
  font-family:"Microsoft JhengHei","PingFang TC","Heiti TC","MingLiU","MS PGothic",sans-serif;
  font-size:15px; line-height:1.6; min-height:100vh;
  padding:14px 10px 60px;
}
.wrap{max-width:880px;margin:0 auto}
a{color:#14508c}
.logo{
  text-align:center; color:#fff; letter-spacing:.12em;
  font-weight:900; font-size:30px; margin:6px 0 2px;
  text-shadow:0 2px 0 #000, 0 0 18px #7fe0a0, 0 0 4px #b11414;
}
.logo small{display:block;font-size:11px;letter-spacing:.35em;color:#9fd7b3;font-weight:400;margin-top:4px}
.panel{
  background:var(--paper); border:3px solid #0a1a10; border-radius:4px;
  box-shadow:0 8px 0 rgba(0,0,0,.35), inset 0 0 0 1px #fff8;
  padding:14px 16px; margin-top:12px;
}
.panel h2{
  margin:0 0 10px; font-size:17px; color:#fff; background:var(--dark);
  padding:6px 10px; border-left:6px solid var(--accent); letter-spacing:.06em;
}
.panel h3{margin:16px 0 6px;font-size:15px;color:var(--dark);border-bottom:2px dotted var(--line);padding-bottom:3px}
.muted{color:var(--muted)}
.center{text-align:center}
.hr{height:1px;background:var(--line);margin:10px 0;border:0}

/* buttons: old form-ish */
.btn{
  font-family:inherit;font-size:14px;cursor:pointer;color:#14220f;
  background:linear-gradient(#fffef8,#ddd6c0);
  border:2px outset #efe9d8; border-radius:3px; padding:7px 12px; margin:3px 3px;
  box-shadow:0 1px 0 #fff inset; font-weight:700;
}
.btn:hover{background:linear-gradient(#fff,#eae3cd)}
.btn:active{border-style:inset}
.btn:disabled{opacity:.45;cursor:default}
.btn.red{color:#fff;background:linear-gradient(#c7342a,#8e1410);border-color:#e59a92}
.btn.red:hover{background:linear-gradient(#d94a3f,#9d1a15)}
.btn.green{color:#fff;background:linear-gradient(#2e8b52,#1a5a34);border-color:#a7dcb6}
.btn.green:hover{background:linear-gradient(#37a261,#206a3d)}
.btn.gold{color:#3a2b00;background:linear-gradient(#ffe487,#e3b93f);border-color:#fff0bb}
.btn.blue{color:#fff;background:linear-gradient(#2c6bb0,#173f70);border-color:#9dc2e8}
.btn.sm{font-size:12px;padding:4px 8px}
.btn.blk{display:block;width:100%;text-align:center}

/* header strip */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;color:#cfe8d6;font-size:12px}
.topbar b{color:#fff}

/* scoreboard */
.scoreboard{
  background:var(--ledbg); border:3px solid #000; border-radius:4px; padding:8px;
  box-shadow:inset 0 0 26px #000, 0 3px 0 #0008; overflow:auto;
}
.scoreboard table{border-collapse:collapse;width:100%;font-family:"Consolas","Courier New",monospace}
.scoreboard th,.scoreboard td{border:1px solid #23301f;padding:3px 6px;text-align:center;color:var(--led);font-size:14px}
.scoreboard th{color:#7fae7f;font-weight:400;font-size:12px;letter-spacing:.05em}
.scoreboard td.team{text-align:left;white-space:nowrap;color:#e8f0da;font-family:inherit;font-weight:700}
.scoreboard td.rhe{color:#ffd76a;font-weight:700}
.scoreboard tr.player td.team{color:#ffe07a}

/* field */
.fieldwrap{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch}
.field-svg{width:210px;max-width:48vw;border:2px solid #0a1a10;border-radius:4px;background:#0f2b1c}
.cond{flex:1;min-width:200px}
.countbox{background:#0a0f0b;border:2px solid #000;border-radius:4px;padding:8px;margin-bottom:8px}
.countrow{display:flex;gap:14px;align-items:center;font-family:"Consolas",monospace;color:#9fd7b3;font-size:12px}
.countrow .lbl{width:26px;color:#cfe8d6}
.leds{display:flex;gap:5px}
.led{width:15px;height:15px;border-radius:50%;background:#1b2a1b;border:1px solid #000;box-shadow:inset 0 0 4px #000}
.led.on.b{background:#4fd07a;box-shadow:0 0 8px #4fd07a}
.led.on.s{background:#ffd23f;box-shadow:0 0 8px #ffd23f}
.led.on.o{background:#ff5b45;box-shadow:0 0 8px #ff5b45}
.matchup{background:#fffdf5;border:1px solid var(--line);border-radius:4px;padding:8px 10px}
.matchup .who{font-weight:700;color:var(--dark);font-size:15px}
.matchup .pos{display:inline-block;background:var(--dark);color:#fff;font-size:11px;padding:1px 6px;border-radius:3px;margin-left:6px}
.rrow{display:flex;align-items:center;gap:6px;margin:2px 0;font-size:12px}
.rrow .rlab{width:44px;color:var(--muted)}
.rbar{flex:1;height:9px;background:#e6dfc9;border:1px solid #cabf9f;border-radius:3px;overflow:hidden;min-width:60px}
.rbar i{display:block;height:100%}
.rrow b{width:26px;text-align:right;font-family:Consolas,monospace}

/* log */
.log{
  background:#101a12;color:#cfe8d6;border:2px solid #000;border-radius:3px;
  padding:10px 12px;height:230px;overflow:auto;font-size:13.5px;line-height:1.65;
  font-family:"Microsoft JhengHei","MingLiU",sans-serif;
}
.log p{margin:2px 0;padding:2px 4px;border-radius:2px}
.log p.inn{color:#ffe07a;font-weight:700;border-top:1px solid #2b3a2b;margin-top:6px}
.log p.run{color:#ff9c7a;font-weight:700}
.log p.hit{color:#8fe0a8}
.log p.out{color:#a9b8a9}
.log p.sys{color:#7fae7f;font-style:italic}
.log p.big{color:#fff;background:#8e1410;font-weight:700}

/* actions */
.actions{margin-top:10px}
.actgroup{margin:6px 0}
.actgroup .gtitle{display:inline-block;font-size:12px;color:#fff;background:var(--dark);padding:2px 8px;border-radius:3px;margin-bottom:3px}
.turn{font-weight:700;color:var(--accent)}

/* tables */
table.grid{border-collapse:collapse;width:100%;font-size:13px;background:#fffdf5}
table.grid th,table.grid td{border:1px solid var(--line);padding:4px 6px;text-align:center}
table.grid th{background:#e7e0ca;color:#3a3527}
table.grid tr.me td{background:#fff3c9;font-weight:700}
table.grid td.name{text-align:left;white-space:nowrap}
table.grid td.num{font-family:Consolas,monospace}
.rank1{color:#b8860b;font-weight:900}

.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;color:#fff;background:#5a6552;margin-left:4px}
.pill.on{background:#1f8f4a}
.pill.off{background:#8e2f26}

.teamcard{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  border:2px solid #0a1a10;border-radius:4px;padding:8px 10px;margin:6px 0;background:#fffdf5;
}
.teamcard .nm{font-weight:900;font-size:16px}
.teamcard .meta{font-size:11px;color:var(--muted)}
.swatch{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid #0007;vertical-align:-2px;margin-right:6px}
.plink{cursor:pointer;color:#14508c;text-decoration:underline;text-underline-offset:2px}
.plink:hover{color:var(--accent)}
.abilnote{font-size:12px;color:var(--muted);background:#fffdf5;border:1px dashed var(--line);border-radius:3px;padding:6px 8px;margin:8px 0}
.news{background:#101a12;color:#cfe8d6;border:2px solid #000;border-radius:3px;padding:6px 10px;font-size:12px}
.news p{margin:2px 0}
.news p:before{content:"▸ ";color:#ffc23f}
.daysep td{background:#101a12;color:#ffc23f;font-weight:700;letter-spacing:.1em;font-size:12px}
.daysep td:before{content:"▸ "}
.grade{display:inline-block;font-weight:900;font-family:Consolas,monospace;font-size:12px;padding:1px 7px;border-radius:3px;color:#fff}
.g-S{background:#b11414}.g-A{background:#c9701a}.g-B{background:#1f8f4a}.g-C{background:#5a6552}.g-D{background:#8a8171}

.overlay{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:50}
.overlay.on{display:flex}
.overlay div{background:var(--dark);color:#d9f0e0;border:3px solid #000;padding:16px 28px;font-weight:700;letter-spacing:.15em;border-radius:4px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#123021;color:#d9f0e0;border:2px solid #000;padding:8px 20px;border-radius:20px;font-weight:700;opacity:0;transition:.25s;z-index:60;pointer-events:none;box-shadow:0 4px 0 #0006}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.footer{color:#7f9c88;font-size:11px;text-align:center;margin-top:14px;font-family:Consolas,monospace;word-break:break-all}
.help dt{font-weight:700;color:var(--dark);margin-top:8px}
.help dd{margin:2px 0 0 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.two{grid-template-columns:1fr}.logo{font-size:22px}}
.bignum{font-family:"Consolas",monospace;font-weight:900;font-size:20px;color:var(--led)}

/* 熱血演出 */
.playball{
  position:relative;text-align:center;font-size:26px;font-weight:900;color:#ffe07a;letter-spacing:.3em;
  background:#101a12;border:2px solid #000;border-radius:4px;padding:8px;margin:10px 0;
  animation:pb 1.3s ease-out;
  text-shadow:0 2px 0 #8e1410, 0 0 14px #ffd23f;
}
@keyframes pb{0%{transform:scale(2.2);opacity:0}35%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:0}}
.splash{pointer-events:none;text-align:center;position:relative;font-size:24px;font-weight:900;margin:6px 0 0;animation:sp .95s ease-out;letter-spacing:.15em}
.splash.hr{color:#fff;background:#8e1410;text-shadow:0 2px 0 #000}
.splash.k{color:#8fd0ff;background:#12334f}
.splash.hit{color:#1f8f4a;background:#e6f2dc}
.splash.bb{color:#8a8171;background:#e6e0d0}
.splash.out{color:#6b6455}
@keyframes sp{0%{transform:scale(1.7);opacity:0}30%{transform:scale(1.05);opacity:1}75%{opacity:1}100%{opacity:.15}}
.speed{color:#ffd76a;font-family:Consolas,monospace;font-weight:700}
.confetti{position:relative;height:0;overflow:visible}
.confetti i{position:absolute;top:-14px;width:9px;height:15px;opacity:.95;border-radius:2px;animation:cf 2.6s linear infinite}
@keyframes cf{from{transform:translateY(-8px) rotate(0deg);opacity:.95}to{transform:translateY(80px) rotate(340deg);opacity:0}}

/* 選秀 */
.cand{background:#fffdf5}
.cand-top{display:flex;align-items:center;gap:9px}
.cand .bars{margin:6px 0}
.cand .btn{margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">劇空間棒球<small>GEKIKUUKAN BASEBALL</small></div>
  <div id="app"></div>
  <div class="footer" id="cgi"></div>
</div>
<div class="overlay" id="ov"><div>送信中…</div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================
   GEKIKUUKAN BASEBALL - bundled output. DO NOT EDIT THIS FILE.
   Edit src/js/*.js then run build.ps1 (or double-click build.cmd).
   ============================================================ */
(function(){
/* ===================== 00-tools.js ===================== */
/* ---------- 基本工具 ---------- */
const $=(s,el=document)=>el.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const rf=(a,b)=>a+Math.random()*(b-a);
const chance=p=>Math.random()<p;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const rpick=(rnd,a)=>a[Math.floor(rnd()*a.length)];
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function nrm(rnd,mean,sd){return mean+((rnd()+rnd()+rnd()+rnd()-2)/2)*sd;}
function weightedPick(pairs){let t=0;for(const p of pairs)t+=p[1];let r=Math.random()*t;for(const p of pairs){r-=p[1];if(r<=0)return p[0];}return pairs[pairs.length-1][0];}
function poisson(l){let L=Math.exp(-l),k=0,p=1;do{k++;p*=Math.random();}while(p>L);return k-1;}
function fmtAvg(v){if(!v||isNaN(v))return ".000";return (v>=1?"1.000":v.toFixed(3).replace(/^0/,""));}
function fmtIP(outs){return Math.floor(outs/3)+"."+(outs%3);}
function fmtERA(er,outs){if(!outs)return"-.--";return (er*27/outs).toFixed(2);}
/* ===================== 05-sound.js ===================== */
/* ---------- 熱血音效（WebAudio 合成，不需外部檔） ---------- */
let _snd={ctx:null,master:null};
function sndInit(){
  if(_snd.ctx)return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    _snd.ctx=new AC();
    if(_snd.ctx.state==="suspended")_snd.ctx.resume();
    _snd.master=_snd.ctx.createGain();
    _snd.master.gain.value=0.32;
    _snd.master.connect(_snd.ctx.destination);
  }catch(e){}
}
function _tone(freq,dur,type,vol,slideTo,delay){
  if(!_snd.ctx)return;
  const t=_snd.ctx.currentTime+(delay||0);
  const o=_snd.ctx.createOscillator(),g=_snd.ctx.createGain();
  o.type=type||"square";o.frequency.setValueAtTime(freq,t);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(vol||0.2,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(_snd.master);
  o.start(t);o.stop(t+dur+0.02);
}
function _noise(dur,vol,delay,freq,type){
  if(!_snd.ctx)return;
  const t=_snd.ctx.currentTime+(delay||0);
  const len=Math.max(1,Math.floor(_snd.ctx.sampleRate*dur));
  const buf=_snd.ctx.createBuffer(1,len,_snd.ctx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1);
  const src=_snd.ctx.createBufferSource();src.buffer=buf;
  const f=_snd.ctx.createBiquadFilter();
  f.type=type||"lowpass";f.frequency.value=freq||800;
  const g=_snd.ctx.createGain();
  g.gain.setValueAtTime(vol||0.3,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  src.connect(f);f.connect(g);g.connect(_snd.master);
  src.start(t);src.stop(t+dur+0.02);
}
const SFX={
  crack(){sndInit();_noise(0.12,0.5,0,2600,"highpass");_tone(900,0.06,"square",0.25);},
  hit(){sndInit();_noise(0.07,0.4,0,3000,"highpass");_tone(1800,0.05,"triangle",0.2,700);},
  hr(){sndInit();_noise(0.1,0.55,0,2800,"highpass");_tone(300,0.7,"sawtooth",0.25,60);_noise(1.6,0.35,0.1,1200,"bandpass");_tone(660,0.9,"triangle",0.18,990,0.1);},
  k(){sndInit();_noise(0.16,0.5,0,500,"lowpass");_tone(160,0.35,"sawtooth",0.22,60);},
  out(){sndInit();_tone(220,0.12,"square",0.12,180);},
  wink(){sndInit();_tone(880,0.08,"square",0.12,null,0);_tone(1320,0.1,"square",0.12,null,0.07);},
  cheer(){sndInit();_noise(1.4,0.3,0,900,"bandpass");_tone(392,0.5,"triangle",0.12,523,0.05);},
  charge(){sndInit();[392,523,659,784].forEach((f,i)=>_tone(f,0.22,"square",0.16,null,i*0.12));_noise(1.8,0.3,0.5,1000,"bandpass");},
  champ(){sndInit();[523,659,784,1046].forEach((f,i)=>_tone(f,0.3,"square",0.2,null,i*0.14));_tone(1318,0.7,"triangle",0.2,1046,0.56);_noise(2.2,0.4,0.7,1400,"bandpass");}
};
/* 依上一打席結果播放音效（僅互動回合） */
function playSnd(m){
  if(!m||!m.lastKind)return;
  const k=m.lastKind;
  if(k==="HR")SFX.hr();
  else if(k==="3B"||k==="2B")SFX.hit();
  else if(k==="1B"||k==="BUNTHIT")SFX.crack();
  else if(k==="K")SFX.k();
  else if(k==="BB"||k==="HBP")SFX.wink();
  else if(k==="OUT"||k==="SAC"||k==="BUNTOUT")SFX.out();
  if(m.walkoff)setTimeout(()=>SFX.cheer(),220);
}
document.addEventListener("click",sndInit);
/* ===================== 10-data.js ===================== */
/* ---------- 名稱池 ---------- */
const SU=["王","李","林","陳","張","黃","劉","蔡","楊","吳","許","鄭","謝","郭","洪","曾","廖","賴","徐","周","葉","蘇","莊","江","呂","何","羅","高","蕭","潘","彭","沈","柯","游","溫","盧","侯","石","詹","連","宋","曹","方","田","杜","韓","傅","鍾","涂","范"];
const GI=["柏融","威晨","智勝","育成","子偉","岱鋼","國輝","泓志","家豪","俊秀","政閔","勝偉","振昌","凱文","均聲","致遠","金鋒","泰山","建民","宸緯","宇翔","冠廷","承翰","翊豪","哲瑄","皓然","凱翔","宥均","秉澄","冠宇","柏霖","宥辰","書豪","睿宸","柏睿","宥嘉","彥廷","子豪","冠緯","家緯","宇宸"];
const POS_ZH={C:"捕手","1B":"一壘手","2B":"二壘手","3B":"三壘手",SS:"游擊手",LF:"左外野",CF:"中外野",RF:"右外野",DH:"指定打擊"};

/* ---------- 球隊定義 ---------- */
const TEAM_DEFS=[
  {id:"azure",  name:"蒼海鯊", short:"鯊", c1:"#17a08a", c2:"#08493f", stadium:"蒼海灣球場", str:5},
  {id:"blaze",  name:"烈焰龍", short:"龍", c1:"#e23b2a", c2:"#7a1408", stadium:"烈焰球場",   str:3},
  {id:"gale",   name:"疾風鷹", short:"鷹", c1:"#9b59b6", c2:"#4a1f63", stadium:"疾風丘球場", str:0},
  {id:"aurora", name:"極光熊", short:"熊", c1:"#2a7de1", c2:"#0b3d78", stadium:"極光巨蛋",   str:-1},
  {id:"thunder",name:"雷神虎", short:"虎", c1:"#e5a11a", c2:"#7a5406", stadium:"雷神山球場", str:-3},
  {id:"phantom",name:"幻影獅", short:"獅", c1:"#4a5b6b", c2:"#1c2530", stadium:"幻影圓頂",   str:-5},
  {id:"emerald",name:"翡翠鹿", short:"鹿", c1:"#2ecc71", c2:"#145a32", stadium:"翡翠森球場", str:2},
  {id:"tangerine",name:"橙狐", short:"狐", c1:"#e67e22", c2:"#7a3b00", stadium:"橙田球場",   str:-2},
];

/* ---------- 生涯（年齡與成長，跨球季保存在瀏覽器） ---------- */
const CAREERKEY="gekikuukan_career_v1";
let CAREER={seasons:0,pending:false,ov:{},records:{}};
function loadCareer(){try{const r=localStorage.getItem(CAREERKEY);if(r){const d=JSON.parse(r);CAREER=Object.assign({seasons:0,pending:false,ov:{},records:{}},d);CAREER.ov=CAREER.ov||{};CAREER.records=CAREER.records||{};CAREER.history=CAREER.history||[];CAREER.career=CAREER.career||{bat:{},pit:{}};}}catch(e){}}
function saveCareer(){try{localStorage.setItem(CAREERKEY,JSON.stringify(CAREER));}catch(e){}}
function baseAge(id){return 19+(hashStr("age-"+id)%20);}      // 19~38
function applyOv(p){
  p.age=baseAge(p.id);
  const o=CAREER.ov[p.id];if(!o)return;
  if(o.age!=null)p.age=o.age;
  if(o.name)p.name=o.name;
  ["meet","power","eye","speed","defense","velocity","control","breaking","stamina"].forEach(k=>{if(o[k]!=null)p[k]=o[k];});
}
function ageDelta(a){
  if(a<=21)return ri(0,4);
  if(a<=24)return ri(-1,3);
  if(a<=28)return ri(-1,2);
  if(a<=31)return ri(-2,1);
  if(a<=34)return ri(-3,1);
  if(a<=37)return ri(-3,0);
  return ri(-5,-1);
}
function randName(){return pick(SU)+pick(GI);}
function advanceCareer(){
  TEAM_DEFS.forEach(def=>{
    const t=teamCache[def.id]||getTeam(def.id);
    t.batters.concat(t.pitchers).forEach(p=>{
      const isPit=p.role!==undefined;
      const o=CAREER.ov[p.id]||(CAREER.ov[p.id]={});
      o.age=(p.age||26)+1;
      const keys=isPit?["velocity","control","breaking","stamina"]:["meet","power","eye","speed","defense"];
      let trend=0;
      if(o.age>=39){                      // 退休 → 新人
        o.age=ri(19,22);o.name=randName();
        if(CAREER.career){delete CAREER.career.bat[p.id];delete CAREER.career.pit[p.id];}
        keys.forEach(k=>{const v=Math.round(clamp(50+rf(-9,9)+(def.str||0),30,76));trend+=v-(p[k]||50);o[k]=v;});
      }else{
        keys.forEach(k=>{const v=Math.round(clamp((p[k]||50)+ageDelta(o.age),20,99));trend+=v-(p[k]||50);o[k]=v;});
      }
      o.trend=trend;
    });
  });
  CAREER.seasons++;CAREER.pending=false;
  saveCareer();
  for(const k in teamCache)delete teamCache[k];
}

/* ---------- 球員產生（依隊 deterministic） ---------- */
function mkName(rnd,used){  for(let i=0;i<40;i++){
    const n=rpick(rnd,SU)+rpick(rnd,GI);
    if(!used.has(n)){used.add(n);return n;}
  }
  return rpick(rnd,SU)+rpick(rnd,GI);
}
function genRoster(team){
  const rnd=mulberry32(hashStr("gk-roster-v3-"+team.id));
  const nrnd=mulberry32(hashStr("gk-name-v1-"+team.id));
  const arnd=mulberry32(hashStr("gk-arch-v1-"+team.id));
  const used=new Set();
  const pos=["C","1B","2B","3B","SS","LF","CF","RF","DH"];
  const arch=["contact","power","speed","eye","balanced"];
  const batters=[];
  for(let i=0;i<13;i++){
    const p=i<9?pos[i]:null;
    const a=rpick(arnd,arch);
    let meet=nrm(rnd,52,10),power=nrm(rnd,50,13),eye=nrm(rnd,50,11),speed=nrm(rnd,52,12),def=nrm(rnd,52,11);
    if(a==="contact"){meet+=9;eye+=3;power-=4;}
    if(a==="power"){power+=14;meet-=5;speed-=6;}
    if(a==="speed"){speed+=16;def+=4;power-=7;meet+=1;}
    if(a==="eye"){eye+=14;meet+=2;power+=2;speed-=6;}
    if(p==="C"){def+=12;speed-=8;meet+=2;}
    if(p==="1B"){power+=8;def-=3;speed-=4;}
    if(p==="2B"){def+=8;speed+=4;power-=6;}
    if(p==="3B"){power+=6;def+=3;}
    if(p==="SS"){def+=12;speed+=6;power-=4;}
    if(p==="CF"){def+=8;speed+=8;power-=2;}
    if(p==="LF"||p==="RF"){power+=3;def-=2;}
    const s=team.str;
    batters.push({
      id:team.id+"b"+i, name:mkName(nrnd,used),
      pos:p||("B"+i), posLabel:p?POS_ZH[p]:"替補", bench:i>=9,
      meet:Math.round(clamp(meet+s,25,96)), power:Math.round(clamp(power+s,20,96)),
      eye:Math.round(clamp(eye+s,25,96)), speed:Math.round(clamp(speed+s,20,96)),
      defense:Math.round(clamp(def+s,20,96))
    });
  }
  const pitchers=[];
  for(let i=0;i<6;i++){
    const sp=i<3;
    let velocity=nrm(rnd,sp?62:71,8),control=nrm(rnd,sp?64:60,9),breaking=nrm(rnd,sp?62:68,9),stamina=nrm(rnd,sp?74:42,sp?7:8);
    pitchers.push({
      id:team.id+"p"+i, name:mkName(nrnd,used), role:sp?"先發":"後援", starter:sp,
      velocity:Math.round(clamp(velocity+team.str,25,97)),
      control:Math.round(clamp(control+team.str,25,97)),
      breaking:Math.round(clamp(breaking+team.str,25,97)),
      stamina:Math.round(clamp(stamina,25,95))
    });
  }
  return {batters,pitchers};
}
const teamCache={};
function getTeam(id){
  if(!teamCache[id]){
    const def=TEAM_DEFS.find(t=>t.id===id);
    const team=Object.assign({},def,genRoster(def));
    team.batters.concat(team.pitchers).forEach(applyOv);
    teamCache[id]=team;
  }
  return teamCache[id];
}
/* ===================== 30-engine.js ===================== */
/* ---------- 投打數據模型 ---------- */
const OFF_MODS={
  normal:{k:1,hr:1,xbh:1,hit:1,bb:1},
  power:{k:1.35,hr:1.85,xbh:1.35,hit:0.90,bb:0.90},
  take:{k:1.22,hr:0.80,xbh:0.85,hit:0.88,bb:1.55},
  hitrun:{k:1.15,hr:1.05,xbh:1.05,hit:1.06,bb:0.85}
};
const DEF_MODS={
  power:{k:1.24,hr:1.25,hit:0.90,bb:1.28,hbp:1.15,fat:1.7},
  control:{k:0.85,hr:1.05,hit:1.10,bb:0.55,hbp:0.9,fat:1.0},
  corner:{k:1.05,hr:0.90,hit:0.90,bb:1.12,hbp:1.0,fat:1.2,ground:1.3},
  chase:{k:1.18,hr:0.82,hit:1.00,bb:1.30,hbp:1.0,fat:1.15}
};
const OFF_NAME={normal:"正常揮擊",power:"強力揮擊",take:"耐心等球",bunt:"犧牲短打",hitrun:"打帶跑"};
const DEF_NAME={power:"全力投球",control:"控球至上",corner:"邊邊角角",chase:"引誘球",ibb:"故意四壞"};

function pitcherEffective(p,pitches){
  const thr=42+p.stamina*0.62;
  let f=1;
  if(pitches>thr) f=clamp(1-(pitches-thr)*0.0032,0.70,1);
  return {velocity:p.velocity*f,control:p.control*(0.86+0.14*f),breaking:p.breaking*f,fatigue:f};
}
const m_=(v,ref,k)=>Math.exp((v-ref)*k);
const inv=(v,ref,k)=>1/m_(v,ref,k);
function paOutcome(batter,eff,offT,defT){
  const om=OFF_MODS[offT]||OFF_MODS.normal, dm=DEF_MODS[defT]||DEF_MODS.control;
  const kAb=eff.velocity*0.45+eff.breaking*0.55;
  const supp=eff.breaking*0.6+eff.velocity*0.4;
  const ctl=eff.control;
  let pK =0.178*m_(kAb,60,1/60)*inv(batter.meet,60,1/55)*om.k*dm.k;
  let pBB=0.090*m_(batter.eye,60,1/70)*inv(ctl,60,1/60)*om.bb*dm.bb;
  let pHBP=0.010*(dm.hbp||1);
  let pHR=0.032*m_(batter.power,60,1/55)*inv(supp,60,1/55)*om.hr*dm.hr;
  let p3B=0.007*m_(batter.speed,60,1/80)*om.xbh*dm.hit;
  let p2B=0.058*m_(batter.power,58,1/70)*inv(supp,60,1/64)*om.xbh*dm.hit;
  let p1B=0.172*m_(batter.meet,60,1/70)*inv(supp,60,1/60)*om.hit*dm.hit;
  let sum=pK+pBB+pHBP+pHR+p3B+p2B+p1B;
  if(sum>0.985){const s=0.985/sum;pK*=s;pBB*=s;pHBP*=s;pHR*=s;p3B*=s;p2B*=s;p1B*=s;sum=0.985;}
  const pOut=1-sum;
  return weightedPick([["K",pK],["BB",pBB],["HBP",pHBP],["HR",pHR],["3B",p3B],["2B",p2B],["1B",p1B],["OUT",pOut]]);
}

/* ---------- 壘上推進 ---------- */
function hitAdvance(bases,batter,kind,hitrun){
  let runs=0;const nb=[null,null,null];const scored=[];
  const r1=bases[0],r2=bases[1],r3=bases[2];
  const sp=x=>x?x.speed:0;
  if(kind==="HR"){
    if(r1){runs++;scored.push(r1);}if(r2){runs++;scored.push(r2);}if(r3){runs++;scored.push(r3);}
    runs++;scored.push(batter);
    return{runs,bases:nb,scored};
  }
  if(kind==="3B"){
    if(r1){runs++;scored.push(r1);}if(r2){runs++;scored.push(r2);}if(r3){runs++;scored.push(r3);}
    nb[2]=batter;return{runs,bases:nb,scored};
  }
  if(kind==="2B"){
    if(r3){runs++;scored.push(r3);}
    if(r2){runs++;scored.push(r2);}
    if(r1){if(hitrun||sp(r1)>=62||chance(0.42)){runs++;scored.push(r1);}else nb[2]=r1;}
    nb[1]=batter;return{runs,bases:nb,scored};
  }
  // 一壘安打
  if(r3){runs++;scored.push(r3);}
  if(r2){if(hitrun||sp(r2)>=58||chance(0.62)){runs++;scored.push(r2);}else nb[2]=r2;}
  if(r1){if(hitrun){if(!nb[2])nb[2]=r1;}else nb[1]=r1;}
  nb[0]=batter;return{runs,bases:nb,scored};
}
function advanceOnWalk(bases,batter){
  const nb=[bases[0],bases[1],bases[2]];let runs=0;const scored=[];
  if(bases[0]&&bases[1]&&bases[2]){runs++;scored.push(bases[2]);nb[2]=bases[1];nb[1]=bases[0];nb[0]=batter;}
  else if(bases[0]&&bases[1]){nb[2]=bases[1];nb[1]=bases[0];nb[0]=batter;}
  else if(bases[0]){nb[1]=bases[0];nb[0]=batter;}
  else{nb[0]=batter;}
  return {runs,bases:nb,scored};
}
function resolveOut(bases,batter,outs,groundBias){
  const r1=bases[0],r2=bases[1],r3=bases[2];
  const w=[["ground",0.42*(groundBias||1)],["fly",0.36],["line",0.12],["pop",0.10*(groundBias?0.8:1)]];
  let subtype=weightedPick(w);
  let nb=[r1,r2,r3],runs=0,outsAdded=1,reached=false,error=false,desc="";
  if(subtype==="ground"&&r1&&outs<2){
    const roll=Math.random();
    if(roll<0.32*(groundBias||1)){ // 雙殺
      outsAdded=2;nb[0]=null;desc="精湛的雙殺守備";
    }else if(roll<0.32*(groundBias||1)+0.30){ // 野手選擇
      nb[0]=batter;reached=true;
      if(r3&&chance(0.35)){runs++;nb[2]=null;}
      desc="野手選擇，跑者被封殺在二壘";
    }else{ nb[0]=null; desc="滾地球遭到刺殺"; }
  }else if(subtype==="fly"&&r3&&outs<2&&chance(0.5)){
    runs++;nb[2]=null;desc="高飛犧牲打，三壘跑者奔回本壘";
  }else if(subtype==="line"&&r1&&outs<2&&chance(0.12)){
    outsAdded=2;nb[0]=null;desc="平飛球被接殺，跑者回壘不及造成雙殺";
  }else{
    desc=({ground:"滾地球遭到刺殺",fly:"高飛球被接殺",line:"平飛球被沒收",pop:"內野小飛球被接殺"})[subtype];
  }
  return {bases:nb,runs,outsAdded,reached,error:false,subtype,desc};
}

/* ---------- 比賽狀態 ---------- */
function sideName(m,side){return getTeam(side==="home"?m.homeId:m.awayId).name;}
function currentBatter(m){const lu=m.lineups[offenseSide(m)];return lu[m.batterIdx[offenseSide(m)]%lu.length];}
function defenseSide(m){return m.half==="top"?"away":"home";}
function offenseSide(m){return m.half==="top"?"away":"home";}
function playerIsOffense(m){const s=S.season.playerTeam;return m.half==="top"?m.awayId===s:m.homeId===s;}
function getBat(m,pid){if(!m.stats[pid])m.stats[pid]={ab:0,h:0,hr:0,rbi:0,bb:0,k:0,r:0,sb:0};return m.stats[pid];}
function batAdd(m,pid,d){const s=getBat(m,pid);for(const k in d)s[k]=(s[k]||0)+d[k];}
function getPit(m,pid){if(!m.pstats[pid])m.pstats[pid]={outs:0,h:0,r:0,er:0,bb:0,k:0,pp:0,w:0,l:0,sv:0};return m.pstats[pid];}
function pitAdd(m,pid,d){const s=getPit(m,pid);for(const k in d)s[k]=(s[k]||0)+d[k];}
/* 球季累計（含其他球團） */
function mergeBatLine(pid,s){const ps=S.season.playerStats;const d=ps.bat[pid]||(ps.bat[pid]={g:0,ab:0,h:0,hr:0,rbi:0,bb:0,k:0,r:0,sb:0});d.g++;for(const k in s)d[k]=(d[k]||0)+s[k];}
function mergePitLine(pid,s){const ps=S.season.playerStats;const d=ps.pit[pid]||(ps.pit[pid]={g:0,outs:0,h:0,r:0,er:0,bb:0,k:0,pp:0,w:0,l:0,sv:0});d.g++;for(const k in s)d[k]=(d[k]||0)+s[k];}
function playerById(pid){const mm=/^([a-z]+)([bp])(\d+)$/.exec(pid);if(!mm)return null;const t=getTeam(mm[1]);return mm[2]==="b"?t.batters[+mm[3]]:t.pitchers[+mm[3]];}
function splitInt(total,weights){
  const n=weights.length,sum=weights.reduce((a,b)=>a+b,0)||1;
  const raw=weights.map(w=>Math.max(0,total)*w/sum);
  const out=raw.map(x=>Math.floor(x));
  let rem=total-out.reduce((a,b)=>a+b,0);
  const frac=raw.map((x,i)=>[x-Math.floor(x),i]).sort((a,b)=>b[0]-a[0]);
  let k=0;while(rem>0&&k<500){out[frac[k%n][1]]++;rem--;k++;}
  return out;
}
function weightedIndex(weights){
  let t=0;for(const w of weights)t+=Math.max(0,w);let r=Math.random()*t;
  for(let i=0;i<weights.length;i++){r-=Math.max(0,weights[i]);if(r<=0)return i;}
  return weights.length-1;
}
function addRuns(m,side,n){if(n<=0)return;m.score[side]+=n;if(m.line[side].length<m.inning)m.line[side].length=m.inning;m.line[side][m.inning-1]=(m.line[side][m.inning-1]||0)+n;}

function buildLineup(team){return team.batters.filter(b=>!b.bench).slice(0,9);}
function starterOf(team,day){const sp=team.pitchers.filter(p=>p.starter);return sp[(day+hashStr(team.id))%sp.length];}

function newMatch(homeId,awayId,dayIndex,homeStarter,awayStarter){
  const home=getTeam(homeId),away=getTeam(awayId);
  const m={
    homeId,awayId,dayIndex,
    inning:1,half:"top",outs:0,balls:0,strikes:0,
    bases:[null,null,null],
    score:{away:0,home:0},hits:{away:0,home:0},errs:{away:0,home:0},
    line:{away:new Array(12).fill(0),home:new Array(12).fill(0)},
    lineups:{away:buildLineup(away),home:buildLineup(home)},
    bench:{away:away.batters.filter(b=>b.bench),home:home.batters.filter(b=>b.bench)},
    bullpen:{away:away.pitchers.filter(p=>!p.starter),home:home.pitchers.filter(p=>!p.starter)},
    usedPitchers:{away:[],home:[]},
    batterIdx:{away:0,home:0},
    pitchers:{away:{obj:awayStarter,pitches:0},home:{obj:homeStarter,pitches:0}},
    starters:{away:awayStarter,home:homeStarter},
    stats:{},pstats:{},log:[],over:false,winner:null,walkoff:false,
    lastOff:null,lastDef:null,usedSubs:new Set()
  };
  m.log.push(`◆ 比賽開始　${away.name} ＠ ${home.name}（${home.stadium}）`);
  m.log.push(`　先發投手　${away.name}：${awayStarter.name}　／　${home.name}：${homeStarter.name}`);
  m.log.push(`◆ 1局上　${away.name}的進攻`);
  return m;
}

/* ---------- 打席處理 ---------- */
function playPA(m,offT,defT){
  const offSide=offenseSide(m),defSide=defenseSide(m);
  const batter=currentBatter(m);
  const P=m.pitchers[defSide];
  const eff=pitcherEffective(P.obj,P.pitches);
  const L=[];
  const push=(s,cls)=>{L.push(s);m.log.push(cls?{t:s,c:cls}:s);};

  const runnerOn1=!!m.bases[0],runnerOn2=!!m.bases[1],runnerOn3=!!m.bases[2];
  const anyRunner=runnerOn1||runnerOn2||runnerOn3;
  if(offT==="bunt"&&!anyRunner)offT="normal";
  if(offT==="hitrun"&&!anyRunner)offT="normal";

  const thrown=ri(1,4)+ri(0,2);
  P.pitches+=thrown;
  m.pitchSpeed=Math.round(138+P.obj.velocity*0.35+ri(-3,3));   // 球速（熱血演出）
  pitAdd(m,P.obj.id,{pp:thrown});

  let ev;
  if(offT==="bunt"){
    const succ=clamp(0.62+(batter.speed-60)/300-(eff.velocity-60)/500,0.30,0.86);
    if(chance(succ)) ev=chance(0.10)?"BUNTHIT":"SAC";
    else ev="BUNTOUT";
  }else{
    ev=paOutcome(batter,eff,offT,defT);
  }

  push(`　投手「${DEF_NAME[defT]||"配球"}」對決打者「${OFF_NAME[offT]||"揮擊"}」。`,null);

  let runs=0,desc="",cls="out";
  if(ev==="K"){m.outs++;
    batAdd(m,batter.id,{ab:1,k:1});pitAdd(m,P.obj.id,{k:1,outs:1});
    desc=`三振！${batter.name}揮棒落空，黯然退回休息區。`;cls="out";
    if(offT==="hitrun"&&runnerOn1&&m.outs<2&&chance(0.42)){
      m.bases[0]=null;m.outs++;desc+=`（打帶跑走壘失敗，一壘跑者被封殺！）`;
    }
  }
  else if(ev==="OUT"){const r=resolveOut(m.bases,batter,m.outs,DEF_MODS[defT]&&DEF_MODS[defT].ground);
    runs=r.runs;m.outs+=r.outsAdded;m.bases=r.bases;
    batAdd(m,batter.id,{ab:1});pitAdd(m,P.obj.id,{outs:r.outsAdded});
    desc=r.desc+"。";cls="out";
  }
  else if(ev==="SAC"){const nb=[m.bases[0],m.bases[1],m.bases[2]];let rr=0;
    if(m.bases[2]){rr++;nb[2]=null;}
    if(m.bases[1]){nb[2]=m.bases[1];nb[1]=null;}
    if(m.bases[0]){nb[1]=m.bases[0];nb[0]=null;}
    runs=rr;m.bases=nb;m.outs++;
    batAdd(m,batter.id,{ab:0});pitAdd(m,P.obj.id,{outs:1});
    desc=`漂亮的犧牲短打！${batter.name} 成功護送跑者${rr?"並送回一分":""}。`;cls="out";
  }
  else if(ev==="BUNTOUT"){m.outs++;batAdd(m,batter.id,{ab:1});pitAdd(m,P.obj.id,{outs:1});desc=`短打失敗，${batter.name} 點成小飛球被接殺。`;cls="out";}
  else if(ev==="BUNTHIT"){const nb=[batter,m.bases[0],m.bases[1]];let rr=0;
    if(m.bases[2]){rr++;nb[2]=m.bases[1];nb[1]=m.bases[0];nb[0]=batter;}
    else if(m.bases[1]){nb[2]=m.bases[1];nb[1]=m.bases[0];nb[0]=batter;}
    runs=rr;m.bases=nb;m.hits[offSide]++;
    batAdd(m,batter.id,{ab:1,h:1});pitAdd(m,P.obj.id,{h:1});
    desc=`出其不意！${batter.name} 偷點形成內野安打！`;cls="hit";
  }
  else if(ev==="BB"){const r=advanceOnWalk(m.bases,batter);runs=r.runs;m.bases=r.bases;
    batAdd(m,batter.id,{ab:0,bb:1});pitAdd(m,P.obj.id,{bb:1});
    r.scored.forEach(x=>{if(x)batAdd(m,x.id,{r:1});});
    desc=`四壞球保送，${batter.name}選球上壘。`;cls="hit";
  }
  else if(ev==="HBP"){const r=advanceOnWalk(m.bases,batter);runs=r.runs;m.bases=r.bases;
    batAdd(m,batter.id,{ab:0,bb:1});
    r.scored.forEach(x=>{if(x)batAdd(m,x.id,{r:1});});
    desc=`觸身球！${batter.name}挨了一記，保送上壘。`;cls="hit";
  }
  else{ // 安打：一壘／二壘／三壘／全壘打
    const h=hitAdvance(m.bases,batter,ev,offT==="hitrun");
    runs=h.runs;m.bases=h.bases;m.hits[offSide]++;
    pitAdd(m,P.obj.id,{h:1});
    batAdd(m,batter.id,{ab:1,h:1});
    if(ev==="HR")batAdd(m,batter.id,{hr:1});
    h.scored.forEach(x=>{if(x)batAdd(m,x.id,{r:1});});
    const word={"HR":"全壘打","3B":"三壘安打","2B":"二壘安打","1B":"一壘安打"}[ev];
    if(ev==="HR"){desc=`全壘打～～！！ ${batter.name} 的${runs>1?runs+"分":"陽春"}彈！`;cls="big";}
    else{desc=`${word}！${batter.name} 擊出穿越防線的安打${runs?"，跑者回壘得分":""}。`;cls="hit";}
  }

  // 得分
  if(runs>0){
    addRuns(m,offSide,runs);
    batAdd(m,batter.id,{rbi:runs});
    pitAdd(m,P.obj.id,{r:runs,er:runs});
    push(`　★ ${sideName(m,offSide)} 拿下 ${runs} 分！`, "run");
  }

  // 產出文字
  const cnt=makeCount(ev);
  const pitchWords=makePitchSeq(ev,cnt);
  pitchWords.forEach(w=>push("　　› "+w,null));
  push(`　${desc}（球數 ${cnt.b}-${cnt.s}）`,cls);

  // 下一棒
  m.batterIdx[offSide]++;
  m.balls=0;m.strikes=0;

  // 熱血演出：記錄上一打席結果與大字形
  m.lastKind=ev;
  m.lastRuns=runs;
  if(ev==="HR")m.splash={t:"全壘打！！",c:"hr"};
  else if(ev==="K")m.splash={t:"三振！",c:"k"};
  else if(ev==="3B")m.splash={t:"三壘安打！",c:"hit"};
  else if(ev==="2B")m.splash={t:"二壘安打！",c:"hit"};
  else if(ev==="1B"||ev==="BUNTHIT")m.splash={t:"安打！",c:"hit"};
  else if(ev==="BB")m.splash={t:"保送",c:"bb"};
  else if(ev==="HBP")m.splash={t:"觸身球",c:"bb"};
  else if(ev==="SAC")m.splash={t:"犧牲觸擊",c:"out"};

  // 再見安打判定
  if(m.half==="bottom"&&m.inning>=9&&m.score.home>m.score.away){
    m.over=true;m.winner="home";m.walkoff=true;m.splash={t:"再見！",c:"hr"};
  }
}
/* 單場英雄（Player of the Game）
   候選僅取「勝利方」球員（和局時兩隊皆可），並讓打者與投手份量相當，
   避免以往投手（含敗投）幾乎必當 MVP 的問題。 */
function gameHero(m){
  const wSide=m.winner;                    // "home" / "away" / null(和局)
  const winTeam=wSide==null?null:(wSide==="home"?m.homeId:m.awayId);
  const winStarter=(wSide!=null&&m.starters)?m.starters[wSide].id:null;
  const teamOf=pid=>String(pid).replace(/[bp]\d+$/,"");
  const cand=[];
  for(const pid in m.stats){
    if(winTeam&&teamOf(pid)!==winTeam)continue;
    const s=m.stats[pid];
    const v=s.h*1.5+s.hr*2.5+s.rbi*1.4+(s.r||0)*1.0+(s.sb||0)*0.5+(s.bb||0)*0.2;
    const p=playerById(pid);
    cand.push({pid,name:p?p.name:pid,isPit:false,s,v});
  }
  for(const pid in m.pstats){
    if(winTeam&&teamOf(pid)!==winTeam)continue;
    const s=m.pstats[pid];
    let v=s.k*2+(s.outs||0)*0.45-(s.er||0)*3+(s.sv||0)*3;
    if(pid===winStarter)v+=3;              // 勝隊先發勝投加成（m.pstats 未記勝投）
    const p=playerById(pid);
    cand.push({pid,name:p?p.name:pid,isPit:true,s,v});
  }
  if(!cand.length)return null;
  cand.sort((a,b)=>b.v-a.v);
  return cand[0];
}

function makeCount(ev){
  if(ev==="K")return{b:ri(0,3),s:3};
  if(ev==="BB")return{b:4,s:ri(0,2)};
  if(ev==="HBP")return{b:0,s:0};
  return{b:ri(0,3),s:ri(0,2)};
}
function makePitchSeq(ev,cnt){
  const arr=[];
  for(let i=0;i<cnt.b;i++)arr.push("壞球，球數落後");
  for(let i=0;i<cnt.s;i++)arr.push(chance(0.5)?"好球沒揮，記好球":"精彩的界外球");
  if(arr.length===0)arr.push("第一球就出手");
  const fin={"K":"再見三振，棒子揮了個空","BB":"明顯壞球，打者獲得保送","HBP":"身體附近的球，打者閃避不及",
    "HR":"清脆的擊球聲！球飛向中外野深處","3B":"強勁的平飛球滾向右外野縫隙","2B":"深遠的飛球落地，打者衝上二壘",
    "1B":"穿越內野的強襲安打","OUT":"擊球進場，被防守方處理",
    "SAC":"輕輕一點，球滾向三壘方向","BUNTHIT":"突如其來的一點，防守方反應不及","BUNTOUT":"點成小飛球，被捕手接殺"}[ev]||"擊球進場";
  arr.push(fin);
  return arr;
}

/* ---------- 半局 / 比賽結束 ---------- */
function endHalf(m){
  m.outs=0;m.bases=[null,null,null];m.balls=0;m.strikes=0;
  const finished=m.half;
  if(finished==="top"){
    if(m.inning>=9&&m.score.home>m.score.away){m.over=true;m.winner="home";return;}  // 主隊領先才不用打九局下
    m.half="bottom";
    m.log.push({t:`◆ ${m.inning}局下　${sideName(m,"home")}的進攻`,c:"inn"});
  }else{
    if(m.inning>=9&&m.score.home!==m.score.away){m.over=true;m.winner=m.score.home>m.score.away?"home":"away";return;}
    if(m.inning>=18){m.over=true;m.winner=m.score.home>m.score.away?"home":(m.score.home<m.score.away?"away":null);return;}
    if(m.inning>=12&&!m.noTie){m.over=true;m.winner=null;return;}
    m.inning++;m.half="top";
    m.log.push({t:`◆ ${m.inning}局上　${sideName(m,"away")}的進攻`,c:"inn"});
  }
}

/* ---------- CPU AI 戰術 ---------- */
function aiOffense(m){
  const batter=currentBatter(m);
  const defSide=defenseSide(m);
  const eff=pitcherEffective(m.pitchers[defSide].obj,m.pitchers[defSide].pitches);
  const r1=!!m.bases[0],r2=!!m.bases[1],r3=!!m.bases[2];
  if(m.outs<2&&!r3&&(r1||r2)&&batter.power<58&&chance(0.32))return "bunt";
  if(r1&&batter.speed>72&&m.outs<2&&chance(0.14))return "hitrun";
  if(batter.power>72&&(r1||r2)&&m.outs<2&&chance(0.26))return "power";
  if(eff.control<58&&chance(0.30))return "take";
  return "normal";
}
function aiDefense(m){
  const batter=currentBatter(m);
  const defSide=defenseSide(m);
  const P=m.pitchers[defSide];
  const openFirst=!m.bases[0];
  if(m.outs<2&&openFirst&&(m.bases[1]||m.bases[2])&&batter.power>78&&chance(0.55))return "ibb";
  if(P.pitches>75&&chance(0.4))return "control";
  if(batter.power>75)return chance(0.5)?"corner":"chase";
  return weightedPick([["corner",0.40],["control",0.28],["power",0.20],["chase",0.12]]);
}

/* ---------- 玩家特殊動作 ---------- */
function doIBB(m){
  const offSide=offenseSide(m),batter=currentBatter(m),P=m.pitchers[defenseSide(m)];
  const r=advanceOnWalk(m.bases,batter);
  m.bases=r.bases;
  if(r.runs>0){addRuns(m,offSide,r.runs);batAdd(m,batter.id,{rbi:r.runs});}
  batAdd(m,batter.id,{ab:0,bb:1});
  m.log.push({t:`　投手選擇故意四壞，保送 ${batter.name} 上一壘。`,c:"sys"});
  m.batterIdx[offSide]++;P.pitches+=4;pitAdd(m,P.obj.id,{pp:4,bb:1});
}
function doSteal(m){
  const offSide=offenseSide(m);
  let from=-1,to=-1,runner=null;
  if(m.bases[0]){from=0;to=1;runner=m.bases[0];}
  else if(m.bases[1]){from=1;to=2;runner=m.bases[1];}
  if(!runner){m.log.push({t:"　沒有可盜壘的跑者。",c:"sys"});return;}
  const defSide=defenseSide(m),eff=pitcherEffective(m.pitchers[defSide].obj,m.pitchers[defSide].pitches);
  const p=clamp(0.60+(runner.speed-60)/160-(eff.velocity-60)/400,0.35,0.88);
  if(chance(p)){
    m.bases[from]=null;m.bases[to]=runner;
    batAdd(m,runner.id,{sb:1});
    m.log.push({t:`　★ 盜壘成功！${runner.name} 用速度搶下${to===2?"三壘":"二壘"}！`,c:"hit"});
  }else{
    m.bases[from]=null;m.outs++;
    m.log.push({t:`　盜壘失敗！${runner.name} 遭到阻殺，${m.outs}人出局。`,c:"out"});
    if(m.outs>=3)endHalf(m);
  }
}
function doPinchHit(m){
  const offSide=offenseSide(m);
  const bench=m.bench[offSide];
  if(!bench.length){m.log.push({t:"　已無可用之兵。",c:"sys"});return;}
  const lu=m.lineups[offSide],idx=m.batterIdx[offSide]%lu.length;
  const before=lu[idx];
  const sub=bench.shift();
  lu[idx]=sub;
  m.log.push({t:`　代打！${before.name} 退場，${sub.name} 拎著球棒走上打擊區。`,c:"sys"});
}
function doChangePitcher(m,pid){
  const defSide=defenseSide(m);
  const bp=m.bullpen[defSide];
  const i=bp.findIndex(p=>p.id===pid);
  if(i<0)return;
  const np=bp.splice(i,1)[0];
  m.usedPitchers[defSide].push(m.pitchers[defSide].obj.id);
  m.pitchers[defSide]={obj:np,pitches:0};
  m.log.push({t:`　★ 換投！${sideName(m,defSide)} 換上 ${np.name}（${np.role}）接替投球。`,c:"run"});
}

function autoHalf(m){

/* ===================== 40-season.js ===================== */
/* ---------- 球季 ---------- */
function roundRobin(ids){
  const n=ids.length,rounds=[];
  let arr=ids.slice();
  for(let r=0;r<n-1;r++){
    const pairs=[];
    for(let i=0;i<n/2;i++)pairs.push([arr[i],arr[n-1-i]]);
    rounds.push(pairs);
    const fixed=arr[0],rest=arr.slice(1);rest.unshift(rest.pop());arr=[fixed].concat(rest);
  }
  return rounds;
}
function makeSchedule(){
  const ids=TEAM_DEFS.map(t=>t.id);
  const first=roundRobin(ids);
  const days=[];
  first.forEach((round,r)=>{
    days.push(round.map((p,i)=>r%2===0?{away:p[0],home:p[1],played:false,score:null}:{away:p[1],home:p[0],played:false,score:null}));
  });
  first.forEach((round,r)=>{
    days.push(round.map((p,i)=>r%2===0?{away:p[1],home:p[0],played:false,score:null}:{away:p[0],home:p[1],played:false,score:null}));
  });
  return days;
}
function teamStrength(id){
  const t=getTeam(id);
  const off=avg(t.batters.slice(0,9).map(b=>b.meet*0.6+b.power*0.4));
  const def=avg(t.pitchers.map(p=>p.control*0.4+p.breaking*0.3+p.velocity*0.3));
  return {off,def};
}
function quickSim(aId,bId){
  const a=teamStrength(aId),b=teamStrength(bId);
  const lamA=clamp(4.3*Math.pow(a.off/b.def,0.6)*rf(0.8,1.2),0.6,12);
  const lamB=clamp(4.3*Math.pow(b.off/a.def,0.6)*rf(0.8,1.2),0.6,12);
  let sa=poisson(lamA),sb=poisson(lamB),x=0;
  while(sa===sb&&x<6){if(chance(0.5))sa++;else sb++;x++;}
  return {a:sa,b:sb};
}
function gameScore(g){const s=g&&g.score;if(!s)return {a:0,h:0};return {a:s.a||0,h:(s.h!=null?s.h:(s.b!=null?s.b:0))};}
function applyRecord(awayId,homeId,ra,rh){
  const r=S.season.records;
  [awayId,homeId].forEach(id=>{if(!r[id])r[id]={w:0,l:0,t:0,rs:0,ra:0};});
  r[awayId].rs+=ra;r[awayId].ra+=rh;r[homeId].rs+=rh;r[homeId].ra+=ra;
  if(ra>rh){r[awayId].w++;r[homeId].l++;}
  else if(rh>ra){r[homeId].w++;r[awayId].l++;}
  else{r[awayId].t++;r[homeId].t++;}
}
function synthBatting(teamId,runs){
  const b=getTeam(teamId).batters.slice(0,9);
  const ps=b.map(p=>({pid:p.id,ab:0,h:0,hr:0,rbi:0,bb:0,k:0,r:0,sb:0}));
  ps.forEach(x=>x.ab=ri(3,5));
  const totalAB=ps.reduce((a,x)=>a+x.ab,0);
  const H=clamp(Math.round(runs*1.15+4.6+rf(-1.5,1.5)),runs,Math.min(15,totalAB));
  const powW=b.map(p=>Math.pow(Math.max(1,p.power-30),2));
  let hr=clamp(Math.round(runs*rf(0.12,0.45)),0,runs);
  hr=Math.min(hr,H);
  for(let i=0;i<hr;i++){let idx=weightedIndex(powW),tries=0;while(ps[idx].h>=ps[idx].ab&&tries<9){idx=weightedIndex(powW);tries++;}ps[idx].hr++;ps[idx].h++;}
  const w=b.map(p=>0.8+Math.max(0,p.meet-40)*0.008+Math.max(0,p.power-40)*0.003);
  const add=splitInt(H-hr,w);
  let extra=0;
  ps.forEach((x,i)=>{const room=Math.max(0,x.ab-x.h);const give=Math.min(add[i],room);x.h+=give;extra+=add[i]-give;});
  while(extra>0){const i=weightedIndex(w);if(ps[i].h<ps[i].ab){ps[i].h++;extra--;}else break;}
  const rw=b.map(p=>0.8+Math.max(0,p.meet-40)*0.006+Math.max(0,p.speed-40)*0.004);
  const rs=splitInt(runs,rw);ps.forEach((x,i)=>x.r+=rs[i]);
  const wr=b.map(p=>0.8+Math.max(0,p.power-40)*0.01+Math.max(0,p.meet-40)*0.004);
  const rbi=splitInt(runs,wr);ps.forEach((x,i)=>x.rbi+=rbi[i]);
  const bbT=ri(1,5);for(let i=0;i<bbT;i++)ps[weightedIndex(b.map(p=>p.eye))].bb++;
  const kT=ri(4,11);for(let i=0;i<kT;i++)ps[weightedIndex(b.map(p=>Math.max(1,110-p.meet)))].k++;
  const sbT=ri(0,3);for(let i=0;i<sbT;i++)ps[weightedIndex(b.map(p=>Math.max(1,p.speed-48)))].sb++;
  return ps;
}
function synthPitching(teamId,runsAllowed,oppHits,won,close){
  const t=getTeam(teamId);
  const sp=t.pitchers.filter(p=>p.starter),rp=t.pitchers.filter(p=>!p.starter);
  const starter=sp[ri(0,sp.length-1)];
  const outs=Math.min(27,ri(15,25));
  const rest=27-outs;
  const starterLine={pid:starter.id,outs:outs,h:Math.round(oppHits*0.68),r:Math.round(runsAllowed*0.72),er:Math.round(runsAllowed*0.68),bb:ri(0,4),k:ri(3,9),pp:outs*ri(3,4),w:0,l:0,sv:0};
  const list=[starterLine];
  let relLine=null;
  if(rest>0){
    const rel=rp.length?rp[ri(0,rp.length-1)]:starter;
    relLine={pid:rel.id,outs:rest,h:Math.max(0,oppHits-starterLine.h),r:Math.max(0,runsAllowed-starterLine.r),er:Math.max(0,runsAllowed-starterLine.er),bb:ri(0,2),k:ri(1,4),pp:rest*ri(3,4),w:0,l:0,sv:0};
    list.push(relLine);
  }
  const last=list[list.length-1];
  if(won){ last.w=1; if(close&&list.length>1&&last.outs>=3&&last.outs<9)last.sv=1; }
  else starterLine.l=1;
  return list;
}
function synthGameStats(awayId,homeId,ra,rh){
  const margin=Math.abs(ra-rh);
  const awayBat=synthBatting(awayId,ra), homeBat=synthBatting(homeId,rh);
  const awayPit=synthPitching(awayId,rh,homeBat.reduce((a,x)=>a+x.h,0),rh<ra,margin<=3);
  const homePit=synthPitching(homeId,ra,awayBat.reduce((a,x)=>a+x.h,0),ra<rh,margin<=3);
  awayBat.forEach(s=>mergeBatLine(s.pid,s));
  homeBat.forEach(s=>mergeBatLine(s.pid,s));
  awayPit.forEach(s=>mergePitLine(s.pid,s));
  homePit.forEach(s=>mergePitLine(s.pid,s));
  return {away:{bat:awayBat,pit:awayPit},home:{bat:homeBat,pit:homePit}};
}
function mergePlayerStats(m){
  for(const pid in m.stats)mergeBatLine(pid,m.stats[pid]);
  for(const pid in m.pstats)mergePitLine(pid,m.pstats[pid]);
  // 勝敗投手：獲勝方先發勝投、落敗方先發敗投（寫入球季累計）
  if(m.winner){
    const wSide=m.winner,lSide=wSide==="home"?"away":"home";
    const ps=S.season.playerStats.pit;
    const wId=m.starters[wSide].id,lId=m.starters[lSide].id;
    if(ps[wId])ps[wId].w=(ps[wId].w||0)+1;
    if(ps[lId])ps[lId].l=(ps[lId].l||0)+1;
  }
}
function processGameEnd(m){
  if(m._processed)return;m._processed=true;
  if(m.po){recordPlayoffResult(m);return;}   // 季後賽：只更新籤表，不動例行賽排名
  m.hero=gameHero(m);
  const day=S.season.schedule[m.dayIndex];
  const g=day.find(x=>x.away===m.awayId&&x.home===m.homeId);
  if(g){g.played=true;g.score={a:m.score.away,h:m.score.home};}
  applyRecord(m.awayId,m.homeId,m.score.away,m.score.home);
  mergePlayerStats(m);
  const when="第"+(m.dayIndex+1)+"日";
  checkMatchRecords(m,when);
  logGame(m.dayIndex+1,"",m.awayId,m.homeId,m.score.away,m.score.home);
  day.forEach(x=>{
    if(x.played)return;
    const r=quickSim(x.away,x.home);
    x.played=true;x.score={a:r.a,h:r.b};
    applyRecord(x.away,x.home,r.a,r.b);
    logGame(m.dayIndex+1,"",x.away,x.home,r.a,r.b);
    const L=synthGameStats(x.away,x.home,r.a,r.b);
    checkLineRecords(L.away,x.away,when);
    checkLineRecords(L.home,x.home,when);
    checkSimTeamRecords(x.away,x.home,r.a,r.b,when);
  });
  S.season.day++;
  leagueNews(m.dayIndex);
  if(S.season.day>=S.season.schedule.length)ensurePlayoff();  // 例行賽結束 → 建立季後賽籤表
  saveGame();
}
/* 每日聯盟快報：首位攻防與你的排名變動 */
function leagueNews(dayIdx){
  const se=S.season;
  const st=standingsList();
  const top=st[0],second=st[1];
  const my=se.playerTeam;
  const myRank=st.findIndex(x=>x.id===my)+1;
  const prev=se.prevMyRank;
  let line="";
  if(prev!==undefined&&prev<9){
    if(myRank<prev)line=`◎ 你的${getTeam(my).name}升至第 ${myRank} 名！`;
    else if(myRank>prev)line=`◎ 你的${getTeam(my).name}滑落至第 ${myRank} 名…`;
  }
  if(!line&&myRank===1)line=`◎ 你的${getTeam(my).name}攻佔/續保首位！`;
  if(!line&&second){
    const gap=Number(second.gb);
    if(gap!=null&&gap<=1.0)line=`◎ ${dayIdx+1}日終了：首位 ${getTeam(top.id).name}，第2名 ${getTeam(second.id).name} 僅差 ${gap} 場！`;
    else line=`◎ ${dayIdx+1}日終了：首位 ${getTeam(top.id).name}（${top.w}勝）`;
  }
  if(!line)line=`◎ ${dayIdx+1}日終了：首位 ${getTeam(top.id).name}（${top.w}勝）`;
  se.news=se.news||[];se.news.push({day:dayIdx+1,text:line});
  if(se.news.length>5)se.news.shift();
  se.prevMyRank=myRank;
  if(!S.flash)S.flash=line;
}

/* ---------- 季後賽 ---------- */
/* 例行賽前 4 名晉級：準決賽 3 戰 2 勝（1vs4、2vs3），冠軍戰 5 戰 3 勝。
   較高種子擁有較多主場（偶數戰＝高種子主場）。季後賽不列入例行賽排名。 */
function seriesNeed(best){return Math.ceil(best/2);}
function mkSeries(hi,lo,best){return {hi:hi,lo:lo,best:best,winsHi:0,winsLo:0,games:[],winner:null};}
function homeIsHi(gameNo){return gameNo%2===0;}
function seriesOver(s){return !!s.winner;}

/* 例行賽結束 → 建立季後賽籤表 */
function ensurePlayoff(){
  const se=S.season;
  if(!se||se.playoff)return;
  if((se.day||0)<(se.schedule||[]).length)return;   // 例行賽尚未結束
  const st=standingsList();
  const seeds=st.slice(0,4).map(x=>x.id);
  se.playoff={
    seeds:seeds,
    semi:[mkSeries(seeds[0],seeds[3],3),mkSeries(seeds[1],seeds[2],3)],
    final:null,
    stage:"semi",
    champion:null
  };
}

/* 目前玩家要打的季後賽是哪個系列賽的第幾戰（沒有則 null） */
function playoffNextGame(){
  const po=S.season.playoff;
  if(!po||po.stage==="done")return null;
  const me=S.season.playerTeam;
  const arr=po.stage==="semi"?po.semi:(po.final?[po.final]:[]);
  for(let i=0;i<arr.length;i++){
    const s=arr[i];
    if(s.winner)continue;
    if(s.hi===me||s.lo===me)return {series:s,si:i,gameNo:s.games.length};
  }
  return null;
}
function playoffGameCount(){
  const po=S.season.playoff;if(!po)return 0;
  let n=0;po.semi.forEach(s=>n+=s.games.length);
  if(po.final)n+=po.final.games.length;
  return n;
}

/* 快速模擬一個系列賽的一場 */
function simSeriesGame(s,label){
  const gameNo=s.games.length;
  const hiHost=homeIsHi(gameNo);
  const home=hiHost?s.hi:s.lo, away=hiHost?s.lo:s.hi;
  const r=quickSim(away,home);
  const awayScore=r.a, homeScore=r.b;
  const winnerId=homeScore>awayScore?home:away;
  const hiScore=home===s.hi?homeScore:awayScore;
  const loScore=home===s.hi?awayScore:homeScore;
  s.games.push({home:home,away:away,scoreHi:hiScore,scoreLo:loScore,winner:winnerId});
  logGame(null,label||"季後賽",away,home,awayScore,homeScore);
  if(winnerId===s.hi)s.winsHi++;else s.winsLo++;
  if(s.winsHi>=seriesNeed(s.best)||s.winsLo>=seriesNeed(s.best))s.winner=winnerId;
}
function simSeriesToEnd(s,label){let g=0;while(!s.winner&&g++<20)simSeriesGame(s,label);}

/* 自動推進與玩家無關的系列賽；必要時產生冠軍戰、產生總冠軍 */
function playoffProgress(){
  const po=S.season.playoff;
  if(!po)return;
  const me=S.season.playerTeam;
  let guard=0;
  while(guard++<60){
    if(po.stage==="semi"){
      po.semi.forEach(s=>{if(!s.winner&&s.hi!==me&&s.lo!==me)simSeriesToEnd(s,"準決賽");});
      if(po.semi.every(s=>!!s.winner)){
        po.final=mkSeries(seriesWinnerOf(po.semi[0]),seriesWinnerOf(po.semi[1]),5);
        const rank=id=>po.seeds.indexOf(id);
        if(rank(po.final.lo)<rank(po.final.hi)){const t=po.final.hi;po.final.hi=po.final.lo;po.final.lo=t;}
        po.stage="final";
        continue;
      }
      break;
    }
    if(po.stage==="final"){
      const f=po.final;
      if(f&&!f.winner&&f.hi!==me&&f.lo!==me)simSeriesToEnd(f,"冠軍戰");
      if(f&&f.winner){
        po.champion=f.winner;po.stage="done";
        computeAwards();                      // 季後頒獎
        finalizeSeason();                     // 累計生涯、寫入跨季紀錄
        prepareDraft();                       // 新人選秀（有退休缺口才展開）
        CAREER.pending=true;saveCareer();saveGame();
        if(po.champion===me)setTimeout(()=>SFX.champ(),220);
      }
      break;
    }
    break;
  }
}
function seriesWinnerOf(s){return s.winner;}

/* 玩家打完一場季後賽：寫入系列賽結果 */
function recordPlayoffResult(m){
  const po=S.season.playoff;
  if(!po){saveGame();return;}
  const s=(m.po.stage==="semi")?po.semi[m.po.si]:po.final;
  if(s&&!s.winner){
    const awayScore=m.score.away, homeScore=m.score.home;
    const winnerId=homeScore>awayScore?m.homeId:m.awayId;
    const hiScore=m.homeId===s.hi?homeScore:awayScore;
    const loScore=m.homeId===s.hi?awayScore:homeScore;
    s.games.push({home:m.homeId,away:m.awayId,scoreHi:hiScore,scoreLo:loScore,winner:winnerId});
    if(winnerId===s.hi)s.winsHi++;else s.winsLo++;
    if(s.winsHi>=seriesNeed(s.best)||s.winsLo>=seriesNeed(s.best))s.winner=winnerId;
  }
  mergePlayerStats(m);
  m.hero=gameHero(m);
  const stName=m.po.stage==="semi"?"準決賽":"冠軍戰";
  checkMatchRecords(m,`${stName}·第${m.po.gameNo+1}戰`);
  logGame(null,stName,m.awayId,m.homeId,m.score.away,m.score.home);
  playoffProgress();
  saveGame();
}

/* 全部季後賽快速模擬完畢（用於玩家未參與時） */
function playoffSimAll(){
  const po=S.season.playoff;
  if(!po)return;
  let guard=0;
  while(po.stage!=="done"&&guard++<60){
    const arr=po.stage==="semi"?po.semi:(po.final?[po.final]:[]);
    const label=po.stage==="semi"?"準決賽":"冠軍戰";
    arr.forEach(s=>{if(!s.winner)simSeriesToEnd(s,label);});
    playoffProgress();
  }
  saveGame();
}

/* ---------- 遊戲紀錄 ---------- */
/* 三種紀錄：
   1) 逐場賽果：本季每場比賽（例行賽＋季後賽）的對戰與比數。
   2) 跨季生涯：每完成一季，留下一筆摘要（戰績、名次、總冠軍）。
   3) 生涯里程碑：跨季累計的各項生涯數據排行榜。 */

/* 記錄一場比賽（例行賽帶 day；季後賽帶 stage 標籤、day 為 null） */
function logGame(day,stage,awayId,homeId,sa,sh){
  const se=S.season;if(!se)return;
  se.gl=se.gl||[];
  se.gl.push({d:day||null,st:stage||"",aw:awayId,hm:homeId,a:sa,h:sh});
}

/* 球季（含季後賽）結束：累計生涯數據、寫入跨季生涯摘要 */
function finalizeSeason(){
  const se=S.season;
  if(!se||se.finalized)return;
  se.finalized=true;

  /* 生涯累計（全聯盟球員） */
  CAREER.career=CAREER.career||{bat:{},pit:{}};
  const cb=CAREER.career.bat,cp=CAREER.career.pit;
  const ps=se.playerStats||{bat:{},pit:{}};
  const BAT=["g","ab","h","hr","rbi","bb","k","r","sb"];
  const PIT=["g","outs","h","r","er","bb","k","pp","w","l","sv"];
  for(const pid in ps.bat){const s=ps.bat[pid],d=cb[pid]||(cb[pid]={});BAT.forEach(k=>d[k]=(d[k]||0)+(s[k]||0));}
  for(const pid in ps.pit){const s=ps.pit[pid],d=cp[pid]||(cp[pid]={});PIT.forEach(k=>d[k]=(d[k]||0)+(s[k]||0));}

  /* 跨季生涯摘要 */
  const st=standingsList();
  const me=se.playerTeam;
  const rank=st.findIndex(x=>x.id===me)+1;
  const rec=se.records[me]||{w:0,l:0,t:0};
  CAREER.history=CAREER.history||[];
  CAREER.history.push({
    no:CAREER.seasons+1, team:me, w:rec.w, l:rec.l, t:rec.t, rank,
    champ:(se.playoff&&se.playoff.champion)||null, isChamp:!!(se.playoff&&se.playoff.champion===me)
  });
  saveCareer();
}

/* ---------- 單場紀錄簿（本季＋生涯） ---------- */
function newRecBook(){
  return {bat:{h:null,hr:null,rbi:null,r:null,sb:null,bb:null,k:null},
          pit:{k:null,ip:null},
          team:{r:null,margin:null,innings:null}};
}
function recUp(book,cat,key,val,name,team,when){
  if(!book||!book[cat])return;
  const cur=book[cat][key];
  if(!cur||val>cur.val)book[cat][key]={val:val,name:name,team:team,when:when};
}
function recUpBoth(cat,key,val,name,team,when){
  if(S.season&&!S.season.recs)S.season.recs=newRecBook();
  recUp(S.season.recs,cat,key,val,name,team,when);
  const c=CAREER.records||(CAREER.records={});
  if(!c.bat)c.bat={};if(!c.pit)c.pit={};if(!c.team)c.team={};
  recUp(c,cat,key,val,name,team,when);
}
function recName(pid){const p=playerById(pid);return p?p.name:pid;}
function recTeam(pid){return teamOfPlayer({id:pid});}
/* 玩家（或任何有完整逐人成績的）比賽掃描 */
function checkMatchRecords(m,when){
  if(!S.season.recs)S.season.recs=newRecBook();
  if(!S.season.recs.bat)S.season.recs=newRecBook();
  for(const pid in m.stats){const s=m.stats[pid];
    ["h","hr","rbi","r","sb","bb","k"].forEach(k=>recUpBoth("bat",k,s[k]||0,recName(pid),recTeam(pid),when));
  }
  for(const pid in m.pstats){const s=m.pstats[pid];
    recUpBoth("pit","k",s.k||0,recName(pid),recTeam(pid),when);
    recUpBoth("pit","ip",Math.round((s.outs||0)/3*10)/10,recName(pid),recTeam(pid),when);
  }
  const aName=getTeam(m.awayId).name,hName=getTeam(m.homeId).name;
  recUpBoth("team","r",m.score.away,aName,m.awayId,when);
  recUpBoth("team","r",m.score.home,hName,m.homeId,when);
  const wId=m.score.away>m.score.home?m.awayId:m.homeId;
  recUpBoth("team","margin",Math.abs(m.score.away-m.score.home),m.winner?getTeam(wId).name:"兩隊",m.winner?wId:"",when);
  recUpBoth("team","innings",m.inning,m.winner?getTeam(wId).name:getTeam(m.homeId).name,m.winner?wId:m.homeId,when);
}
/* 快速模擬比賽的逐人成績掃描（synthGameStats 回傳） */
function checkLineRecords(lines,teamId,when){

/* ---------- 新人選秀（球季結束後、開新球季前） ---------- */
/* 規則：例行賽戰績越差越先選（一輪）。你的順位可從 4 名候補中挑人；
   其他球團自動補上最需要的位置。未選到的退休缺口仍由舊機制自動遞補。 */
function prepareDraft(){
  const se=S.season;
  if(se.drafted||se.draft)return;
  const order=standingsList().map(x=>x.id).reverse();   // 戰績差者優先
  const picks=[];
  order.forEach(tid=>{
    const t=getTeam(tid);
    const vac=t.batters.concat(t.pitchers).filter(p=>(p.age||26)>=38);
    if(vac.length){
      const v=vac[0];
      picks.push({teamId:tid,pid:v.id,pos:v.posLabel||v.role||"投手",kind:v.role!==undefined?"pit":"bat"});
    }
  });
  se.draftLog=se.draftLog||[];
  if(!picks.length){se.drafted=true;return;}
  se.draft={picks,idx:0,cands:null,done:false};
}
function draftCurrentPick(){
  const d=S.season.draft;
  return d&&d.picks[d.idx];
}
function draftCandidates(pick){
  const rng=mulberry32(hashStr("gk-draft-"+pick.teamId+"-"+pick.pid));
  const used=new Set();
  const str=getTeam(pick.teamId).str;
  const base=52+str;
  const nf=a=>(rng()-0.5)*2*a;
  const aro=rpick(rng,pick.kind==="pit"?["power","control","ground"]:["slug","contact","speed","balanced"]);
  const cands=[];
  for(let i=0;i<4;i++){
    let name="";
    for(let k=0;k<20;k++){const n=rpick(rng,SU)+rpick(rng,GI);if(!used.has(n)){used.add(n);name=n;break;}}
    if(!name)name=rpick(rng,SU)+rpick(rng,GI);
    const age=Math.round(rng()*3+19);
    if(pick.kind==="pit"){
      let velocity=base+nf(12),control=base+nf(11),breaking=base+nf(11),stamina=60+nf(14);
      if(aro==="power"){velocity+=10;control-=5;breaking+=2;}
      if(aro==="control"){control+=12;velocity-=4;breaking+=2;}
      if(aro==="ground"){breaking+=6;control+=4;velocity-=3;}
      cands.push({id:pick.pid+"-c"+i,teamId:pick.teamId,name,age,role:"先發",posLabel:pick.pos,
        velocity:Math.round(clamp(velocity,30,95)),control:Math.round(clamp(control,30,95)),
        breaking:Math.round(clamp(breaking,30,95)),stamina:Math.round(clamp(stamina,30,92))});
    }else{
      let meet=base+nf(11),power=base+nf(13),eye=base+nf(10),speed=54+nf(14),defense=base+nf(10);
      if(aro==="slug"){power+=13;meet-=6;speed-=5;}
      if(aro==="contact"){meet+=11;eye+=3;power-=5;}
      if(aro==="speed"){speed+=15;defense+=3;power-=6;}
      if(aro==="balanced"){eye+=5;defense+=3;}
      cands.push({id:pick.pid+"-c"+i,teamId:pick.teamId,name,age,posLabel:pick.pos,
        meet:Math.round(clamp(meet,30,95)),power:Math.round(clamp(power,30,95)),
        eye:Math.round(clamp(eye,30,95)),speed:Math.round(clamp(speed,25,95)),
        defense:Math.round(clamp(defense,28,95))});
    }
  }
  return cands;
}
function draftBest(cands){let bi=0,bv=-1;cands.forEach((c,i)=>{const v=playerOverall(c);if(v>bv){bv=v;bi=i;}});return bi;}
function applyDraftRookie(pick,rookie){
  const p=playerById(pick.pid);
  const o=CAREER.ov[pick.pid]||(CAREER.ov[pick.pid]={});
  const keys=rookie.role!==undefined?["velocity","control","breaking","stamina"]:["meet","power","eye","speed","defense"];
  let trend=0;
  keys.forEach(k=>{trend+=rookie[k]-(p?p[k]:52);o[k]=rookie[k];});
  o.name=rookie.name;o.age=rookie.age;o.trend=trend;
  if(CAREER.career){delete CAREER.career.bat[pick.pid];delete CAREER.career.pit[pick.pid];}
  S.season.draftLog.push({teamId:pick.teamId,name:rookie.name,pos:pick.pos,pid:pick.pid});
}
function draftJudge(){
  if(!S.season.draft)return;
  let d=S.season.draft,guard=0;
  while(d&&d.idx<d.picks.length&&d.picks[d.idx].teamId!==S.season.playerTeam&&guard++<50){
    const pick=d.picks[d.idx];const cs=draftCandidates(pick);
    applyDraftRookie(pick,cs[draftBest(cs)]);d.idx++;d.cands=null;
  }
  if(S.season.draft&&S.season.draft.idx>=S.season.draft.picks.length){
    S.season.drafted=true;S.season.draft=null;
    for(const k in teamCache)delete teamCache[k];   // 讓選秀結果反映到名冊
    saveGame();
  }
}

/* ---------- 個人獎項（球季結束後頒獎） ---------- */
const AWARD_KINGS=[["avg","打擊王"],["hr","全壘打王"],["rbi","打點王"],["sb","盜壘王"],["r","得分王"],["era","防禦率王"],["w","勝投王"],["k","三振王"],["sv","救援王"]];
function awardPts(s,isPit){
  if(isPit)return Math.round((s.w||0)*3+(s.sv||0)*2+(s.k||0)*0.15+(s.outs||0)*0.1-(s.er||0)*1.5);
  const ab=s.ab||1;
  return Math.round((s.h||0)*0.8+(s.hr||0)*2.5+(s.rbi||0)*1+(s.sb||0)*0.5+(s.r||0)*0.8+(s.h/ab)*110);
}
function computeAwards(){
  const ps=S.season.playerStats,q=leadersQualify();
  const kings=AWARD_KINGS.map(([kind,title])=>{
    const top=leadersList(kind)[0];
    return {kind,title,val:top?top.val:null,name:top?top.p.name:"",team:top?top.pid.replace(/[bp]\d+$/,""):""};
  });
  const batters=[],pitchers=[],rookies=[];
  for(const pid in ps.bat){
    const s=ps.bat[pid],p=playerById(pid);
    if(!p||(s.g||0)<q.bat)continue;
    batters.push({pid,p,s,pts:awardPts(s,false)});
    if(p.age<=22)rookies.push({pid,p,s,pts:awardPts(s,false)});
  }
  for(const pid in ps.pit){
    const s=ps.pit[pid],p=playerById(pid);
    if(!p||(s.g||0)<q.pit)continue;
    pitchers.push({pid,p,s,pts:awardPts(s,true)});
  }
  const pick3=arr=>arr.sort((a,b)=>b.pts-a.pts).slice(0,3).map((x,i)=>({rank:i+1,name:x.p.name,pid:x.pid,team:x.pid.replace(/[bp]\d+$/,""),pts:x.pts}));
  S.season.awards={kings,mvp:pick3(batters),cy:pick3(pitchers),rookie:pick3(rookies),gp:q.gp};
}
function awardPodium(list,label){
  const row=a=>`<tr><td class="num">${a.rank}</td><td class="name">${esc(a.name)}</td><td class="name">${teamBadge(a.team)}</td><td class="num">${a.pts} 分</td></tr>`;
  return `<h3>${label}</h3><table class="grid"><tr><th>#</th><th>球員</th><th>球隊</th><th>評分</th></tr>${list.map(row).join("")}</table>`;

/* ---------- 遊戲狀態 ---------- */
const S={screen:"title",season:null,match:null,flash:"",leadCat:"avg"};

function newSeason(playerTeam){
  S.season={
    playerTeam,
    day:0,
    schedule:makeSchedule(),
    records:{},
    playerStats:{bat:{},pit:{}},
    statSchema:2,
    started:Date.now()
  };
  TEAM_DEFS.forEach(t=>S.season.records[t.id]={w:0,l:0,t:0,rs:0,ra:0});
  saveGame();
}
/* 讓舊存檔也能顯示全聯盟球員排行：補齊欄位，並為已完成但當時未記錄的比賽補生成個人成績 */
function migrateSeasonStats(){
  const se=S.season;
  if(!se||se.statSchema===2)return;
  const ps=se.playerStats||(se.playerStats={bat:{},pit:{}}); ps.bat=ps.bat||{}; ps.pit=ps.pit||{};
  const hasPlayerBat=Object.keys(ps.bat).some(k=>k.indexOf(se.playerTeam+"b")===0);
  const bf=["g","ab","h","hr","rbi","bb","k","r","sb"];
  const pf=["g","outs","h","r","er","bb","k","pp","w","l","sv"];
  for(const pid in ps.bat){const d=ps.bat[pid];bf.forEach(k=>{if(typeof d[k]!=="number")d[k]=Number(d[k])||0;});}
  for(const pid in ps.pit){const d=ps.pit[pid];pf.forEach(k=>{if(typeof d[k]!=="number")d[k]=Number(d[k])||0;});}
  const playedDays=Math.min(se.day||0,(se.schedule||[]).length);
  for(let i=0;i<playedDays;i++){
    (se.schedule[i]||[]).forEach(g=>{
      if(!g.played||!g.score)return;
      const sc=gameScore(g),ra=sc.a,rh=sc.h;
      const invA=g.away===se.playerTeam,invH=g.home===se.playerTeam;
      if((!invA&&!invH)||!hasPlayerBat){
        synthGameStats(g.away,g.home,ra,rh);
      }else{
        const oppId=invA?g.home:g.away;
        const oppRuns=invA?rh:ra,myRuns=invA?ra:rh;
        const ob=synthBatting(oppId,oppRuns);
        const op=synthPitching(oppId,myRuns,ob.reduce((a,x)=>a+x.h,0),oppRuns>myRuns,Math.abs(myRuns-oppRuns)<=3);
        ob.forEach(s=>mergeBatLine(s.pid,s));
        op.forEach(s=>mergePitLine(s.pid,s));
        const sp=starterOf(getTeam(se.playerTeam),i);
        const line=ps.pit[sp.id]||(ps.pit[sp.id]={g:0,outs:0,h:0,r:0,er:0,bb:0,k:0,pp:0,w:0,l:0,sv:0});
        if(myRuns>oppRuns)line.w=(line.w||0)+1;else if(myRuns<oppRuns)line.l=(line.l||0)+1;
      }
    });
  }
  se.statSchema=2;
  saveGame();
}
function nextPlayerGame(){
  const day=S.season.schedule[S.season.day];
  if(!day)return null;
  const g=day.find(x=>x.away===S.season.playerTeam||x.home===S.season.playerTeam);
  return g||null;
}
function startMatch(){
  const g=nextPlayerGame();
  if(!g){ ensurePlayoff(); startPlayoffMatch(); return; }  // 例行賽結束 → 季後賽
  const dayIdx=S.season.day;
  const away=getTeam(g.away),home=getTeam(g.home);
  S.match=newMatch(g.home,g.away,dayIdx,starterOf(home,dayIdx),starterOf(away,dayIdx));
  S.match.playerSide=playerTeamSide(S.match);
  S.screen="game";
  S.ballFlash=Date.now();
  setTimeout(()=>{if(S.ballFlash)S.ballFlash=0;},1500);
  SFX.charge();
}
function startPlayoffMatch(){
  const po=S.season.playoff;
  if(!po)return false;
  const pg=playoffNextGame();
  if(!pg)return false;
  const s=pg.series, gameNo=pg.gameNo;
  const hiHost=homeIsHi(gameNo);
  const home=hiHost?s.hi:s.lo, away=hiHost?s.lo:s.hi;
  const dayIdx=S.season.schedule.length+1+playoffGameCount();
  const m=newMatch(home,away,dayIdx,starterOf(getTeam(home),dayIdx),starterOf(getTeam(away),dayIdx));
  m.noTie=true;                                  // 季後賽不可和局
  m.po={stage:po.stage,si:pg.si,gameNo:gameNo};
  m.playerSide=playerTeamSide(m);
  S.match=m;S.screen="game";
  S.ballFlash=Date.now();
  setTimeout(()=>{if(S.ballFlash)S.ballFlash=0;},1500);
  SFX.charge();
  return true;
}
function playerTeamSide(m){
  return m.awayId===S.season.playerTeam?"away":"home";
}

/* ---------- 排名 ---------- */
function standingsList(){
  const r=S.season.records;
  const rows=TEAM_DEFS.map(t=>{
    const d=r[t.id]||{w:0,l:0,t:0,rs:0,ra:0};
    const pct=(d.w+d.l)?d.w/(d.w+d.l):0;
    return {id:t.id,name:t.name,w:d.w,l:d.l,t:d.t,pct,gb:0,rs:d.rs,ra:d.ra};
  });
  rows.sort((a,b)=>b.pct-a.pct||b.w-a.w);
  let top=rows[0];
  rows.forEach(x=>{
    if(x===top)x.gb="-";
    else x.gb=(((top.w-x.w)+(x.l-top.l))/2).toFixed(1);
  });
  return rows;
}

  else if(S.screen==="draft")app.innerHTML=viewDraft();
  else if(S.screen==="help")app.innerHTML=viewHelp();
  renderCGI();
  const log=$("#log");if(log)log.scrollTop=log.scrollHeight;
  const toast=$("#toast");
  if(toast&&S.flash){toast.textContent=S.flash;toast.classList.add("on");S.flash="";setTimeout(()=>toast.classList.remove("on"),1800);}
}
function renderCGI(){
  const c=$("#cgi");if(!c)return;
  let q="mode=top";
  if(S.screen==="game"&&S.match){
    const m=S.match;
    q=`game.cgi?mode=bat&inn=${m.inning}&half=${m.half}&o=${m.outs}&b=${m.bases.map(x=>x?1:0).join("")}&sc=${m.score.away}-${m.score.home}`;
  }else if(S.season){
    q=`season.cgi?team=${S.season.playerTeam}&day=${S.season.day}&mode=${S.screen}`;
  }
  c.textContent="http://gekikuukan.local/cgi-bin/"+q;
}

function teamBadge(id,size){

function teamOfPlayer(p){return String(p.id||"").replace(/[bp]\d+$/,"");}
function playerAvatar(p,size){

      band===1?`<path d="M4.8 6.6 H19.2 V9.2 H4.8 Z" fill="${c}"/>`:
      `<path d="M4.8 7 C4.8 3.8 7.4 3 12 3 c4.6 0 7.2 .8 7.2 3.8 v0.4 c-2-1.2-4.6-1.8-7.2-1.8 S7.2 5.4 5.2 6.6 Z" fill="${hair}"/>`}
    <circle cx="9" cy="13" r="1.35" fill="#fff"/><circle cx="15" cy="13" r="1.35" fill="#fff"/>
    <circle cx="9" cy="13" r="0.62" fill="#261f1a"/><circle cx="15" cy="13" r="0.62" fill="#261f1a"/>

function rbar(label,v){
  const col=v>=75?"#2e9e4f":v>=58?"#c9a227":"#b5533a";
  return `<div class="rrow"><span class="rlab">${label}</span><span class="rbar"><i style="width:${v}%;background:${col}"></i></span><b>${v}</b></div>`;
}
function playerOverall(p){
  if(p.role!==undefined)return Math.round(p.velocity*0.30+p.control*0.28+p.breaking*0.27+p.stamina*0.15);
  return Math.round(p.meet*0.34+p.power*0.30+p.eye*0.14+p.speed*0.11+p.defense*0.11);
}
function gradeOf(v){return v>=88?"S":v>=78?"A":v>=66?"B":v>=54?"C":"D";}
function gradeBadge(p){const v=playerOverall(p),g=gradeOf(v);return `<span class="grade g-${g}" title="綜合 ${v}">${g}</span>`;}
function ageNote(a){if(a<=22)return ' <span style="color:#1f8f4a" title="成長期">▲</span>';if(a>=34)return ' <span style="color:#b5533a" title="衰退期">▼</span>';return ' <span style="color:#6b6455" title="巔峰">–</span>';}

/* ----- 球季總部 ----- */
function viewHub(){
  const s=S.season;
  if(!s)return viewTitle();
  const g=nextPlayerGame();
  const team=getTeam(s.playerTeam);
  const st=standingsList();
  const myRank=st.findIndex(x=>x.id===s.playerTeam)+1;
  const myRec=s.records[s.playerTeam];
  let main="";

    ensurePlayoff();
    playoffProgress();
    main=playoffHubMain(S.season.playoff);
    return hubFrame(team,st,myRank,myRec,main);

    <div class="teamcard"><div><div class="nm">${isHome?"🏠 主場":"🚌 客場"}</div>
      <div class="meta">vs ${esc(opp.name)}　·　${isHome?esc(team.stadium):esc(opp.stadium)}</div></div></div>
    <button class="btn green blk" data-act="play">⚾ 進行比賽（即時戰術）</button>
    <button class="btn gold blk" data-act="simPlay">⏩ 快速模擬本場</button>
    <div class="hr"></div>
    <div class="two">
      <button class="btn blk" data-act="roster">👥 陣容與成績</button>
      <button class="btn blk" data-act="abilities">🧮 選手能力</button>
      <button class="btn blk" data-act="schedule">🗓 賽程表</button>
      <button class="btn blk" data-act="standings">📊 聯盟排名</button>
      <button class="btn blk" data-act="leaders">📈 球員排行</button>
      <button class="btn blk" data-act="records">📕 單場紀錄</button>
      <button class="btn blk" data-act="history">📜 遊戲紀錄</button>
    </div>
    ${(s.news&&s.news.length)?`<div class="hr"></div><div class="news">${s.news.map(n=>`<p>${esc(n.text)}</p>`).join("")}</div>`:""}

    <button class="btn sm blk" data-act="help">？ 遊戲說明</button>

    <button class="btn sm blk" data-act="saveNow">💾 手動存檔</button>

  return hubFrame(team,st,myRank,myRec,main);
}
function hubFrame(team,st,myRank,myRec,main){
  const rows=st.map((x,i)=>{
    const cls=x.id===S.season.playerTeam?"me":"";
    return `<tr class="${cls}"><td>${i+1}${i===0?' <span class="rank1">★</span>':""}</td>
      <td class="name">${teamBadge(x.id)}${x.id===S.season.playerTeam?"（你）":""}</td>
      <td class="num">${x.w}</td><td class="num">${x.l}</td><td class="num">${x.t}</td>
      <td class="num">${fmtAvg(x.pct)}</td><td class="num">${x.gb}</td></tr>`;
  }).join("");
  return `<div class="topbar"><div>監督：<b>${esc(team.name)}</b></div>
    <div>戰績 <b>${myRec.w}-${myRec.l}${myRec.t?"-"+myRec.t:""}</b>　排名 <b>${myRank}</b></div></div>
    ${main}
    <div class="panel">
      <h2>聯盟排名</h2>
      <table class="grid"><tr><th>#</th><th>球隊</th><th>勝</th><th>敗</th><th>和</th><th>勝率</th><th>勝差</th></tr>${rows}</table>
    </div>`;
}

/* ----- 比賽畫面 ----- */
function viewGame(){
  const m=S.match;
  if(!m)return viewHub();
  const off=playerIsOffense(m);
  const myTurn=!m.over;
  const innLabel=(m.half==="top"?"上":"下");
  const offSide=offenseSide(m),defSide=defenseSide(m);
  const batter=currentBatter(m);
  const P=m.pitchers[defSide];
  const eff=pitcherEffective(P.obj,P.pitches);
  const team=esc(getTeam(S.season.playerTeam).name);

  // 記分板：只顯示已進行到的局數，未開打的半局留白（避免誤看成 0 分）
  const cols=Math.max(1,m.inning);
  const cellPlayed=(side,i)=>{   // i 為 0 起算的局
    if(i+1>m.inning)return false;
    if(i+1<m.inning)return true;
    return m.half==="top"?side==="away":true;
  };
  let head="<tr><th>球隊</th>";
  for(let i=1;i<=cols;i++)head+=`<th>${i}</th>`;
  head+="<th>R</th><th>H</th><th>E</th></tr>";
  const row=(id,key)=>{
    const isP=id===S.season.playerTeam;
    let r=`<tr class="${isP?"player":""}"><td class="team">${esc(getTeam(id).short)} ${esc(getTeam(id).name)}${isP?"＊":""}</td>`;
    for(let i=0;i<cols;i++)r+=`<td>${cellPlayed(key,i)?(m.line[key][i]||0):""}</td>`;
    r+=`<td class="rhe">${m.score[key]}</td><td class="rhe">${m.hits[key]}</td><td class="rhe">${m.errs[key]}</td></tr>`;
    return r;
  };
  const scoreboard=`<div class="scoreboard"><table>${head}${row(m.awayId,"away")}${row(m.homeId,"home")}</table></div>`;

  // 壘包圖
  const field=fieldSVG(m.bases);
  const count=`<div class="countbox">
    <div class="countrow"><span class="lbl">B</span><span class="leds">${[0,1,2,3].map(i=>`<span class="led b ${i<m.balls?"on":""}"></span>`).join("")}</span>
      <span class="lbl">S</span><span class="leds">${[0,1,2].map(i=>`<span class="led s ${i<m.strikes?"on":""}"></span>`).join("")}</span>
      <span class="lbl">O</span><span class="leds">${[0,1,2].map(i=>`<span class="led o ${i<m.outs?"on":""}"></span>`).join("")}</span></div>
    <div class="countrow" style="margin-top:6px"><span class="lbl">局面</span><b style="color:#ffe07a">${m.inning}局${innLabel}</b>　<span class="lbl">壘上</span>${batterDesc(m)}</div>
  </div>`;

  const matchup=`<div class="matchup">
    <div style="margin-bottom:6px"><span class="who">🧑 ${esc(batter.name)}</span><span class="pos">${esc(batter.posLabel)}</span>
      <span class="muted" style="font-size:12px">　　打率 ${batAvg(m,batter.id)}</span></div>
    ${rbar("打擊",batter.meet)}${rbar("長打",batter.power)}${rbar("選球",batter.eye)}${rbar("走壘",batter.speed)}
    <div class="hr"></div>
    <div style="margin-bottom:6px"><span class="who">🔥 ${esc(P.obj.name)}</span><span class="pos">${esc(P.obj.role)}</span>
      <span class="muted" style="font-size:12px">　投球數 ${P.pitches}${eff.fatigue<0.95?' <span class="pill off">疲勞</span>':' <span class="pill on">狀態佳</span>'}　<span class="speed">⚡ ${m.pitchSpeed||"-"} km/h</span></span></div>
    ${rbar("球速",P.obj.velocity)}${rbar("控球",P.obj.control)}${rbar("變化",P.obj.breaking)}${rbar("體力",P.obj.stamina)}
  </div>`;

  // 日誌
  const log=`<div class="log" id="log">${m.log.map(l=>{
    if(typeof l==="string")return `<p>${esc(l)}</p>`;
    return `<p class="${l.c||""}">${esc(l.t)}</p>`;
  }).join("")}</div>`;

  // 動作
  let actions="";
  if(!m.over){
    if(off){
      actions=`<div class="actgroup"><span class="gtitle">打擊戰術</span><br>
        <button class="btn red" data-act="bat" data-arg="normal">正常揮擊</button>
        <button class="btn red" data-act="bat" data-arg="power">強力揮擊</button>
        <button class="btn red" data-act="bat" data-arg="take">耐心等球</button>
        ${m.bases[0]!==null||m.bases[1]!==null?`<button class="btn" data-act="bat" data-arg="bunt">犧牲短打</button>`:""}
        ${m.bases[0]||m.bases[1]?`<button class="btn" data-act="bat" data-arg="hitrun">打帶跑</button>`:""}
      </div>
      <div class="actgroup"><span class="gtitle">跑壘／調度</span><br>
        ${m.bases[0]||m.bases[1]?`<button class="btn blue" data-act="steal">盜壘</button>`:""}
        ${m.bench[offSide].length?`<button class="btn blue" data-act="pinchhit">代打</button>`:""}
      </div>`;
    }else{
      actions=`<div class="actgroup"><span class="gtitle">配球策略</span><br>
        <button class="btn gold" data-act="pitch" data-arg="power">全力投球</button>
        <button class="btn gold" data-act="pitch" data-arg="control">控球至上</button>
        <button class="btn gold" data-act="pitch" data-arg="corner">邊邊角角</button>
        <button class="btn gold" data-act="pitch" data-arg="chase">引誘球</button>
        <button class="btn" data-act="pitch" data-arg="ibb">故意四壞</button>
      </div>
      <div class="actgroup"><span class="gtitle">投手調度</span><br>
        ${bullpenButtons(m)}
      </div>`;
    }
    actions+=`<div class="actgroup" style="border-top:1px dotted var(--line);padding-top:6px">
      <button class="btn green" data-act="autoInning">⏩ 自動完成本局</button>
      <button class="btn green" data-act="simGame">⏭ 快速模擬全場</button>
    </div>`;
  }

  let result="";
  if(m.over){
    const win=m.winner;
    const title=m.walkoff?"🎉 再見安打！勝利！":
      win===null?"和局收場":`比賽結束　${esc(getTeam(win==="home"?m.homeId:m.awayId).name)} 獲勝`;
    result=`<div class="panel"><h2>${title}</h2>
      <p class="center">最終比數　<b class="bignum">${esc(getTeam(m.awayId).name)} ${m.score.away} － ${m.score.home} ${esc(getTeam(m.homeId).name)}</b></p>
      ${m.hero?`<p class="center" style="margin-top:8px">◆ Player of the Game：${teamBadge(teamOfPlayer({id:m.hero.pid}))}　<b>${esc(m.hero.name)}</b>　${m.hero.isPit?`<span class="pill on">三振 ${m.hero.s.k} 次</span>`:`<span class="pill on">安打 ${m.hero.s.h}／打點 ${m.hero.s.rbi}</span>`}</p>`:""}
      ${boxScore(m)}
      <div class="hr"></div>
      <button class="btn green blk" data-act="backToHub">▶ 回到球季總部</button>
    </div>`;
  }

  return `<div class="panel">
    ${S.ballFlash?`<div class="playball">⚾ PLAY BALL！</div>`:""}
    <div class="topbar"><div>你的球隊：<b>${team}</b></div><div class="turn">${m.over?"比賽結束":(off?"▶ 你的進攻（下達打擊戰術）":"▶ 你的守備（下達配球）")}</div></div>
    ${scoreboard}
    ${m.splash?`<div class="splash ${m.splash.c}">${esc(m.splash.t)}</div>`:""}
    <div class="fieldwrap" style="margin-top:10px">
      ${field}
      <div class="cond">${count}${matchup}</div>
    </div>
  </div>
  <div class="panel">
    <h2>實況轉播</h2>
    ${log}
    <div class="actions">${actions}</div>
  </div>
  ${result}`;
}
function batterDesc(m){
  const b=[];if(m.bases[2])b.push("三壘");if(m.bases[1])b.push("二壘");if(m.bases[0])b.push("一壘");
  return b.length?b.join("、")+"有跑者":"壘上無人";
}
function batAvg(m,pid){
  const s=m.stats[pid];
  if(!s||!s.ab)return ".000";
  return fmtAvg(s.h/s.ab);
}
function bullpenButtons(m){
  const defSide=defenseSide(m);
  const bp=m.bullpen[defSide];
  if(!bp.length)return `<span class="muted">牛棚已無可用投手</span>`;
  return bp.map(p=>`<button class="btn sm blue" data-act="changePit" data-arg="${p.id}">換上 ${esc(p.name)}（${p.role}）</button>`).join("");
}
function boxScore(m){
  const mk=(id,key)=>{
    const lu=m.lineups[key];
    let rows=lu.map(b=>{
      const s=m.stats[b.id]||{ab:0,h:0,hr:0,rbi:0,bb:0,k:0,r:0};
      return `<tr><td class="name">${esc(b.name)}</td><td>${esc(b.posLabel)}</td>
        <td class="num">${s.ab}</td><td class="num">${s.h}</td><td class="num">${s.hr}</td>
        <td class="num">${s.rbi}</td><td class="num">${s.bb}</td><td class="num">${s.k}</td></tr>`;
    }).join("");
    const P=m.pitchers[key];
    const ps=m.pstats[P.obj.id]||{outs:0,h:0,r:0,er:0,bb:0,k:0,pp:0};
    return `<h3>${esc(getTeam(id).name)}</h3>
      <table class="grid"><tr><th>打者</th><th>守位</th><th>打數</th><th>安打</th><th>全壘</th><th>打點</th><th>四壞</th><th>三振</th></tr>${rows}</table>
      <table class="grid" style="margin-top:6px"><tr><th>投手</th><th>局數</th><th>被安</th><th>失分</th><th>責失</th><th>四壞</th><th>三振</th><th>球數</th></tr>
      <tr><td class="name">${esc(P.obj.name)}</td><td class="num">${fmtIP(ps.outs)}</td><td class="num">${ps.h}</td><td class="num">${ps.r}</td><td class="num">${ps.er}</td><td class="num">${ps.bb}</td><td class="num">${ps.k}</td><td class="num">${ps.pp}</td></tr></table>`;
  };
  return `<div class="two">${mk(m.awayId,"away")}${mk(m.homeId,"home")}</div>`;
}
function fieldSVG(bases){
  const occ=[!!bases[0],!!bases[1],!!bases[2]];
  const base=(x,y,on,label)=>`<g><rect x="${x-14}" y="${y-14}" width="28" height="28" rx="4" transform="rotate(45 ${x} ${y})" fill="${on?"#f2c14e":"#e8e2d0"}" stroke="#5b5b4a" stroke-width="2"/>${on?`<text x="${x}" y="${y+5}" text-anchor="middle" font-size="15" fill="#3a2b00">${label}</text>`:""}</g>`;
  return `<svg viewBox="0 0 220 210" class="field-svg" preserveAspectRatio="xMidYMid meet">
    <rect width="220" height="210" fill="#0f2b1c"/>
    <path d="M110 196 L201 105 L110 14 L19 105 Z" fill="#3f7a3f" stroke="#dfe8c8" stroke-width="3"/>
    <path d="M110 196 L110 130 L188 105 Z" fill="#4c8a4c" opacity="0.5"/>

    <text x="46" y="112" text-anchor="middle" font-size="11" fill="#dfe8c8">3B</text>
    <text x="176" y="112" text-anchor="middle" font-size="11" fill="#dfe8c8">1B</text>
    ${base(19,105,occ[2],3)}
    ${base(110,14,occ[1],2)}
    ${base(201,105,occ[0],1)}
    <rect x="96" y="182" width="28" height="16" rx="3" transform="rotate(45 110 190)" fill="#e8e2d0" stroke="#5b5b4a" stroke-width="2"/>

/* ---------- 新人選秀（球季結束後、開新球季前） ---------- */
/* 規則：每個退休缺口都是一個指名權，按輪次由戰績差者優先選（一輪一支）；
   你的順位可從 4 名候補中挑人，其他球團自動補最強新人。 */
function prepareDraft(){
  const se=S.season;
  if(se.drafted||se.draft)return;
  const order=standingsList().map(x=>x.id).reverse();   // 戰績差者優先
  // 每個退休缺口都是一個指名權（同隊多缺口就多籤），按輪次輪流：弱隊先拿第一輪
  const vacsByTeam=order.map(tid=>{
    const t=getTeam(tid);
    return t.batters.concat(t.pitchers).filter(p=>(p.age||26)>=38)
      .map(v=>({teamId:tid,pid:v.id,pos:v.posLabel||v.role||"投手",kind:v.role!==undefined?"pit":"bat"}));
  });
  const picks=[];
  let round=0;
  for(;;){
    let added=false;
    vacsByTeam.forEach(vl=>{if(vl[round]){picks.push(vl[round]);added=true;}});
    if(!added)break;
    round++;
  }
  se.draftLog=se.draftLog||[];
  if(!picks.length){se.drafted=true;return;}
  se.draft={picks,idx:0,cands:null,done:false,logStart:se.draftLog.length};
}
function draftCurrentPick(){
  const d=S.season.draft;
  return d&&d.picks[d.idx];
}
/* 已被使用的姓名：全聯盟現有球員＋歷屆引退者（避免選秀新人與在役／退休球員同名） */
function takenNames(){
  const s=new Set();
  TEAM_DEFS.forEach(def=>{const t=getTeam(def.id);t.batters.concat(t.pitchers).forEach(p=>{if(p.name)s.add(p.name);});});
  (CAREER.retirements||[]).forEach(r=>{if(r.name)s.add(r.name);});
  return s;
}
function draftCandidates(pick){
  // 亂數含球季號：同一個 pid 再次被選秀回收時，候選人（姓名與能力）不會跟上一輪一樣
  const rng=mulberry32(hashStr("gk-draft-"+pick.teamId+"-"+pick.pid+"-"+seasonNo()));
  const used=takenNames();   // 現有全聯盟球員＋已引退者都算已用，避免同名新人看起來像同一人
  const str=getTeam(pick.teamId).str;
  const base=52+str;
  const nf=a=>(rng()-0.5)*2*a;
  const aro=rpick(rng,pick.kind==="pit"?["power","control","ground"]:["slug","contact","speed","balanced"]);
  const cands=[];
  for(let i=0;i<4;i++){
    let name="";
    for(let k=0;k<20;k++){const n=rpick(rng,SU)+rpick(rng,GI);if(!used.has(n)){used.add(n);name=n;break;}}
    if(!name)name=rpick(rng,SU)+rpick(rng,GI);
    const age=Math.round(rng()*3+19);
    if(pick.kind==="pit"){
      let velocity=base+nf(12),control=base+nf(11),breaking=base+nf(11),stamina=60+nf(14);
      if(aro==="power"){velocity+=10;control-=5;breaking+=2;}
      if(aro==="control"){control+=12;velocity-=4;breaking+=2;}
      if(aro==="ground"){breaking+=6;control+=4;velocity-=3;}
      cands.push({id:pick.pid+"-c"+i,teamId:pick.teamId,name,age,role:"先發",posLabel:pick.pos,
        velocity:Math.round(clamp(velocity,30,95)),control:Math.round(clamp(control,30,95)),
        breaking:Math.round(clamp(breaking,30,95)),stamina:Math.round(clamp(stamina,30,92))});
    }else{
      let meet=base+nf(11),power=base+nf(13),eye=base+nf(10),speed=54+nf(14),defense=base+nf(10);
      if(aro==="slug"){power+=13;meet-=6;speed-=5;}
      if(aro==="contact"){meet+=11;eye+=3;power-=5;}
      if(aro==="speed"){speed+=15;defense+=3;power-=6;}
      if(aro==="balanced"){eye+=5;defense+=3;}
      cands.push({id:pick.pid+"-c"+i,teamId:pick.teamId,name,age,posLabel:pick.pos,
        meet:Math.round(clamp(meet,30,95)),power:Math.round(clamp(power,30,95)),
        eye:Math.round(clamp(eye,30,95)),speed:Math.round(clamp(speed,25,95)),
        defense:Math.round(clamp(defense,28,95))});
    }
  }
  return cands;
}
function draftBest(cands){let bi=0,bv=-1;cands.forEach((c,i)=>{const v=playerOverall(c);if(v>bv){bv=v;bi=i;}});return bi;}
function applyDraftRookie(pick,rookie){
  const p=playerById(pick.pid);
  const o=CAREER.ov[pick.pid]||(CAREER.ov[pick.pid]={});
  recordRetirement(pick.pid,(p&&p.name)||rookie.name,pick.teamId,(p&&p.age)||null,pick.pos);
  const keys=rookie.role!==undefined?["velocity","control","breaking","stamina"]:["meet","power","eye","speed","defense"];
  let trend=0;
  keys.forEach(k=>{trend+=rookie[k]-(p?p[k]:52);o[k]=rookie[k];});
  o.name=rookie.name;o.age=rookie.age;o.trend=trend;
  if(CAREER.career){delete CAREER.career.bat[pick.pid];delete CAREER.career.pit[pick.pid];}
  // 該 pid 由新人沿用：舊人的里程碑／明星賽出場次數一併清除，避免掛到新人頭上
  if(CAREER.milestones)delete CAREER.milestones[pick.pid];
  if(CAREER.allstarAppearances)delete CAREER.allstarAppearances[pick.pid];
  if(CAREER.debut)delete CAREER.debut[pick.pid];   // 新人沿用舊 pid：他的初登場球季就是本季（=沒有紀錄）
  S.season.draftLog.push({teamId:pick.teamId,name:rookie.name,pos:pick.pos,age:rookie.age,pid:pick.pid,season:seasonNo()});
}
function draftJudge(){
  if(!S.season.draft)return;
  let d=S.season.draft,guard=0;
  while(d&&d.idx<d.picks.length&&d.picks[d.idx].teamId!==S.season.playerTeam&&guard++<50){
    const pick=d.picks[d.idx];const cs=draftCandidates(pick);
    applyDraftRookie(pick,cs[draftBest(cs)]);d.idx++;d.cands=null;
  }
  if(S.season.draft&&S.season.draft.idx>=S.season.draft.picks.length){
    if(S.season.draft.logStart!=null)S.season.lastDraftLogStart=S.season.draft.logStart;
    S.season.drafted=true;S.season.draft=null;
    for(const k in teamCache)delete teamCache[k];   // 讓選秀結果反映到名冊
    saveGame();
  }
}

/* ---------- 個人獎項（球季結束後頒獎） ---------- */
const AWARD_KINGS=[["avg","打擊王"],["hr","全壘打王"],["rbi","打點王"],["h","安打王"],["sb","盜壘王"],["r","得分王"],["era","防禦率王"],["w","勝投王"],["k","三振王"],["sv","救援王"]];
function awardPts(s,isPit){
  if(isPit)return starterPts(s);
  const ab=s.ab||1;
  return Math.round((s.h||0)*0.8+(s.hr||0)*2.5+(s.rbi||0)*1+(s.sb||0)*0.5+(s.r||0)*0.8+(s.h/ab)*110);
}
/* 投手評分已拆分：先發用 starterPts、後援用 relieverPts */
function starterPts(s){
  const era=s.outs?(s.er/s.outs)*27:99;
  return Math.round((s.w||0)*10+(s.k||0)*0.25+(s.outs||0)*0.07-era*7);
}
function relieverPts(s){
  const era=s.outs?(s.er/s.outs)*27:99;
  return Math.round((s.sv||0)*6+(s.w||0)*4+(s.k||0)*0.2-era*5);
}
function computeAwards(){
  if(!S.season.playerStats)S.season.playerStats={bat:{},pit:{}};
  const ps=S.season.playerStats,q={gp: (S.season&&S.season.day)||0, bat:3, pit:3, eraOuts:12}; // 先用保守值，實際用 leadersQualify 也行
  const q2 = leadersQualify();
  const qf = q2 || q;
  const kings=AWARD_KINGS.map(([kind,title])=>{
    const top=leadersList(kind)[0];
    return {kind,title,val:top?top.val:null,name:top?top.p.name:"",pid:top?top.pid:"",team:top?top.pid.replace(/[bp]\d+$/,""):""};
  });
  const batters=[],starters=[],relievers=[],rookies=[];
  /* 新人王資格：22 歲以下，且「本季是他的初登場」——CAREER.debut 記錄每位球員第一次
     在正式球季出賽的球季（球季結束時寫入）；沒有紀錄＝從沒在前面任何一季登場過。
     因此一個人一生涯只可能拿一次新人王。出道門檻放寬到一半，讓替補出身的新人也有機會。 */
  const debut=CAREER.debut||{};
  const rookieMinG=Math.max(3,Math.floor((qf.bat||6)/3));
  for(const pid in ps.bat){
    const s=ps.bat[pid],p=playerById(pid);
    if(!p||(s.g||0)<qf.bat)continue;
    batters.push({pid,p,s,pts:awardPts(s,false)});
    if(p.age<=22&&!debut[pid]&&(s.g||0)>=rookieMinG)rookies.push({pid,p,s,pts:awardPts(s,false)});
  }
  for(const pid in ps.pit){
    const s=ps.pit[pid],p=playerById(pid);
    if(!p||(s.g||0)<qf.pit)continue;
    if(p.starter){
      if((s.outs||0)<45)continue;   // 先發需一定局數
      starters.push({pid,p,s,pts:starterPts(s)});
    }else{
      if((s.outs||0)<15)continue;   // 後援需一定出賽量
      relievers.push({pid,p,s,pts:relieverPts(s)});
    }
  }
  const pick3=arr=>arr.sort((a,b)=>b.pts-a.pts).slice(0,3).map((x,i)=>({rank:i+1,name:x.p.name,pid:x.pid,team:x.pid.replace(/[bp]\d+$/,""),pts:x.pts,s:x.s}));
  S.season.awards={kings,mvp:pick3(batters),cy:pick3(starters),reliever:pick3(relievers),rookie:pick3(rookies),sawamura:pickSawamura(ps,qf),best9:pickBest9(ps,qf),gloves:pickGloves(ps,qf),bestDH:pickBestDH(ps,qf),gp:q.gp};
}
/* 最佳九人：按守位選最佳打者＋最佳投手 */
function pickBest9(ps,qf){
  const posOrder=["C","1B","2B","3B","SS","LF","CF","RF","DH"];
  const out=[];
  posOrder.forEach(pos=>{
    let best=null;
    for(const pid in ps.bat){
      const s=ps.bat[pid],p=playerById(pid);
      if(!p||p.pos!==pos)continue;
      if((s.g||0)<qf.bat)continue;
      const pts=awardPts(s,false);
      if(!best||pts>best.pts)best={pos,name:p.name,pid,team:pid.replace(/[bp]\d+$/,""),pts,s};
    }
    if(best)out.push(best);
  });
  let bestP=null;
  for(const pid in ps.pit){
    const s=ps.pit[pid],p=playerById(pid);
    if(!p||!p.starter)continue;   // 最佳九人投手席取先發最佳
    if((s.g||0)<qf.pit||(s.outs||0)<45)continue;
    const pts=starterPts(s);
    if(!bestP||pts>bestP.pts)bestP={pos:"P",name:p.name,pid,team:pid.replace(/[bp]\d+$/,""),pts,s};
  }
  if(bestP)out.push(bestP);
  return out;
}
/* 最佳指定打擊：DH 守位最佳打者（前三名） */
function pickBestDH(ps,qf){
  const arr=[];

/* 澤村賞：先發投手限定，勝場＋防禦率＋三振＋局數綜合評選 */
function pickSawamura(ps,qf){
  const arr=[];

    const s=ps.pit[pid],p=playerById(pid);

/* ---------- 明星賽（季中表演賽，不列入戰績） ---------- */
const AS_POS=["C","1B","2B","3B","SS","LF","CF","RF","DH"];
function asReady(){
  const se=S.season;if(!se)return false;
  return (se.day||0)>=Math.floor(((se.schedule||[]).length)/2);
}
/* 本季表現分：打者 0~100，投手 0~100 */
function asSeasonScore(pid){
  const se=S.season; if(!se) return 0;
  const ps=se.playerStats; if(!ps) return 0;
  const b=ps.bat[pid], p=ps.pit[pid];
  if(b){
    const ab=b.ab||1;
    const avg=b.h/ab, obp=(b.h+(b.bb||0))/(ab+(b.bb||0));
    const hr=b.hr||0, rbi=b.rbi||0, sb=b.sb||0;
    return Math.min(100, Math.round(avg*300 + obp*200 + hr*3 + rbi*1.5 + sb*2));
  }
  if(p){
    const outs=p.outs||1;
    const era=(p.er||0)*27/outs;
    const whip=((p.h||0)+(p.bb||0))/outs*3;
    const w=p.w||0, k=p.k||0, sv=p.sv||0;
    return Math.min(100, Math.round((4.5-era)*15 + (1.3-whip)*80 + w*8 + k*0.5 + sv*6));
  }
  return 0;
}
function asPick(groupTeams){
  const pool=[];
  groupTeams.forEach(tid=>{
    getTeam(tid).batters.forEach(b=>{
      if(b.bench) return;
      const ov=playerOverall(b);
      const season=asSeasonScore(b.id);
      const score=Math.round(ov*0.6 + season*0.4);
      pool.push({id:b.id,pos:b.pos,ov,season,score});
    });
  });
  const byPos={};
  pool.forEach(x=>{
    if(!x.pos) return;
    if(!byPos[x.pos] || x.score>byPos[x.pos].score) byPos[x.pos]=x;
  });
  const ids=AS_POS.map(pos=>byPos[pos]).filter(Boolean).map(x=>x.id);
  if(ids.length<9){
    const used=new Set(ids);
    pool.sort((a,b)=>b.score-a.score).forEach(x=>{
      if(ids.length<9 && !used.has(x.id)){ids.push(x.id); used.add(x.id);}
    });
  }
  let sp=null,spScore=-1;
  groupTeams.forEach(tid=>{
    getTeam(tid).pitchers.filter(p=>p.starter).forEach(p=>{
      const ov=playerOverall(p);
      const season=asSeasonScore(p.id);
      const score=Math.round(ov*0.6 + season*0.4);
      if(score>spScore){spScore=score; sp=p.id;}
    });
  });
  return {batters:ids.slice(0,9),sp};
}
function asRosterTeams(){
  const st=standingsList();
  return {red:st.slice(0,4).map(x=>x.id),blue:st.slice(4,8).map(x=>x.id)};
}
function ensureAllstarRoster(){
  const se=S.season;if(!se||!GK.asReady())return;
  if(se.allstar&&se.allstar.red)return;

function simAllstar(){

  let red=Math.max(0,Math.round(4+(rs-62)*0.09+ran(3)));
  let blue=Math.max(0,Math.round(4+(bs-62)*0.09+ran(3)));

  const recordBlue=a.blue.batters.map(pid=>({pid,name:recName(pid),team:teamOfPlayer({id:pid}),pos:playerById(pid)?.posLabel,ov:playerOverall(playerById(pid))}));

function newSeason(playerTeam){

/* 讓舊存檔也能顯示全聯盟球員排行：補齊欄位，並為已完成但當時未記錄的比賽補生成個人成績 */
function migrateSeasonStats(){
  const se=S.season;
  if(!se||se.statSchema===2)return;
  const ps=se.playerStats||(se.playerStats={bat:{},pit:{}}); ps.bat=ps.bat||{}; ps.pit=ps.pit||{};
  const hasPlayerBat=Object.keys(ps.bat).some(k=>k.indexOf(se.playerTeam+"b")===0);
  const bf=["g","ab","h","hr","rbi","bb","k","r","sb"];
  const pf=["g","outs","h","r","er","bb","k","pp","w","l","sv"];
  for(const pid in ps.bat){const d=ps.bat[pid];bf.forEach(k=>{if(typeof d[k]!=="number")d[k]=Number(d[k])||0;});}
  for(const pid in ps.pit){const d=ps.pit[pid];pf.forEach(k=>{if(typeof d[k]!=="number")d[k]=Number(d[k])||0;});}
  const playedDays=Math.min(se.day||0,(se.schedule||[]).length);
  for(let i=0;i<playedDays;i++){
    (se.schedule[i]||[]).forEach(g=>{
      if(!g.played||!g.score)return;
      const sc=gameScore(g),ra=sc.a,rh=sc.h;
      const invA=g.away===se.playerTeam,invH=g.home===se.playerTeam;
      if((!invA&&!invH)||!hasPlayerBat){
        synthGameStats(g.away,g.home,ra,rh);
      }else{
        const oppId=invA?g.home:g.away;
        const oppRuns=invA?rh:ra,myRuns=invA?ra:rh;
        const ob=synthBatting(oppId,oppRuns);
        const op=synthPitching(oppId,myRuns,ob.reduce((a,x)=>a+x.h,0),oppRuns>myRuns,Math.abs(myRuns-oppRuns)<=3);
        ob.forEach(s=>mergeBatLine(s.pid,s));
        op.forEach(s=>mergePitLine(s.pid,s));
        const sp=starterOf(getTeam(se.playerTeam),i);
        const line=ps.pit[sp.id]||(ps.pit[sp.id]={g:0,outs:0,h:0,r:0,er:0,bb:0,k:0,pp:0,w:0,l:0,sv:0});
        if(myRuns>oppRuns)line.w=(line.w||0)+1;else if(myRuns<oppRuns)line.l=(line.l||0)+1;
      }
    });
  }
  se.statSchema=2;
  saveGame();
}
function nextPlayerGame(){
  const day=S.season.schedule[S.season.day];
  if(!day)return null;
  const g=day.find(x=>x.away===S.season.playerTeam||x.home===S.season.playerTeam);
  return g||null;
}
function startMatch(){
  const g=nextPlayerGame();
  if(!g){ ensurePlayoff(); startPlayoffMatch(); return; }  // 例行賽結束 → 季後賽
  const dayIdx=S.season.day;
  const away=getTeam(g.away),home=getTeam(g.home);
  S.match=newMatch(g.home,g.away,dayIdx,starterOf(home,dayIdx),starterOf(away,dayIdx));
  S.match.playerSide=playerTeamSide(S.match);
  S.screen="game";
  S.ballFlash=Date.now();
  setTimeout(()=>{if(S.ballFlash)S.ballFlash=0;},1500);

function startPlayoffMatch(){
  const po=S.season.playoff;
  if(!po)return false;
  const pg=playoffNextGame();
  if(!pg)return false;
  const s=pg.series, gameNo=pg.gameNo;
  const hiHost=homeIsHi(gameNo);
  const home=hiHost?s.hi:s.lo, away=hiHost?s.lo:s.hi;
  const dayIdx=S.season.schedule.length+1+playoffGameCount();
  const m=newMatch(home,away,dayIdx,starterOf(getTeam(home),dayIdx),starterOf(getTeam(away),dayIdx));
  m.noTie=true;                                  // 季後賽不可和局
  m.po={stage:po.stage,si:pg.si,gameNo:gameNo};
  m.playerSide=playerTeamSide(m);
  S.match=m;S.screen="game";

function standingsList(){
  const r=S.season.records;
  const streaks=teamStreaks();
  const rows=TEAM_DEFS.map(t=>{
    const d=r[t.id]||{w:0,l:0,t:0,rs:0,ra:0};
    const pct=(d.w+d.l)?d.w/(d.w+d.l):0;
    return {id:t.id,name:t.name,w:d.w,l:d.l,t:d.t,pct,gb:0,rs:d.rs,ra:d.ra,streak:streaks[t.id]||{type:null,n:0}};
  });
  rows.sort((a,b)=>b.pct-a.pct||b.w-a.w);
  let top=rows[0];
  rows.forEach(x=>{
    if(x===top)x.gb="-";
    else x.gb=(((top.w-x.w)+(x.l-top.l))/2).toFixed(1);
  });
  return rows;
}

function rbar(label,v){

}
function playerOverall(p){
  if(p.role!==undefined)return Math.round(p.velocity*0.30+p.control*0.28+p.breaking*0.27+p.stamina*0.15);
  return Math.round(p.meet*0.34+p.power*0.30+p.eye*0.14+p.speed*0.11+p.defense*0.11);
}
function gradeOf(v){return v>=88?"S":v>=78?"A":v>=66?"B":v>=54?"C":"D";}
function gradeBadge(p){const v=playerOverall(p),g=gradeOf(v);return `<span class="grade g-${g}" title="綜合 ${v}">${g}</span>`;}
function ageNote(a){if(a<=22)return ' <span style="color:#1f8f4a" title="成長期">▲</span>';if(a>=34)return ' <span style="color:#b5533a" title="衰退期">▼</span>';return ' <span style="color:#6b6455" title="巔峰">–</span>';}

}

  const titles=(CAREER.history||[]).filter(x=>x.isChamp).length;
  const histRows=(CAREER.history||[]).slice().reverse().slice(0,8).map(x=>`<tr class="${x.isChamp?"me":""}"><td class="num">第 ${x.no} 季</td><td class="name">${teamBadge(x.team)}</td><td class="num">${x.w}-${x.l}${x.t?"-"+x.t:""}</td><td class="num">第 ${x.rank} 名</td><td class="name">${x.champ?teamBadge(x.champ)+(x.isChamp?" 🏆":""):"<span class=\"muted\">－</span>"}</td></tr>`).join("");
  return `<div class="panel"><h2>📋 球季資訊</h2>
    <div class="slotcard"><div class="slotinfo"><div class="nm">第 ${seasonNo()} 季</div>
      <div class="meta">${teamBadge(se.playerTeam)}　主場：${esc(team.stadium)}</div></div></div>
    <div class="hr"></div><h3>本季進度</h3>
    <table class="grid">
      <tr><th>例行賽</th><td class="num">第 ${day} / ${total} 日（剩 ${left} 日）</td></tr>
      <tr><th>目前戰績</th><td class="num">${rec.w}-${rec.l}${rec.t?"-"+rec.t:""}　（第 ${myRank} 名）</td></tr>
      <tr><th>季後賽</th><td class="name">${esc(poTxt)}</td></tr>
    </table>
    <div class="hr"></div><h3>生涯</h3>
    <table class="grid">
      <tr><th>已完成球季</th><td class="num">${CAREER.seasons||0} 季</td></tr>
      <tr><th>總冠軍</th><td class="num">${titles} 次</td></tr>
      <tr><th>明星賽</th><td class="num">${(CAREER.allstars||[]).length} 屆</td></tr>
    </table>
    ${histRows?`<div class="hr"></div><h3>近年球季</h3><table class="grid"><tr><th>球季</th><th>你的球隊</th><th>戰績</th><th>名次</th><th>總冠軍</th></tr>${histRows}</table>`:""}
    <div class="hr"></div>
    <div class="two">
      <button class="btn blk" data-act="history">📜 遊戲紀錄</button>
      <button class="btn blk" data-act="backHub">← 回球季總部</button>
    </div></div>`;
}

/* ----- 打線／守位編輯 ----- */
function luStatLine(b){
  const s=S.season&&S.season.playerStats&&S.season.playerStats.bat[b.id];
  const ab=s?s.ab:0,h=s?s.h:0,hr=s?s.hr:0,rbi=s?s.rbi:0,bb=s?s.bb:0;
  const obp=ab+bb>0?((h+bb)/(ab+bb)):0;
  return `<div class="lustats">打 <b>${b.meet}</b>　力 <b>${b.power}</b>　選 <b>${b.eye}</b>　走 <b>${b.speed}</b>　守 <b>${b.defense}</b></div>
    <div class="lustats2">本季 ${ab?fmtAvg(h/ab):"－"}　<span class="lusthr">HR <b>${hr}</b></span>　<span class="lustrbi">RBI <b>${rbi}</b></span>　<span class="lustobp">OBP ${obp>0?fmtAvg(obp):"－"}</span></div>`;
}
function viewLineup(){
  const se=S.season,team=getTeam(se.playerTeam);
  const lu=buildLineup(team),bench=buildBench(team);
  const sel=S.luSel==null?-1:S.luSel;
  const rows=lu.map((b,i)=>`<div class="lurow ${i===sel?"sel":""}" data-act="luPick" data-arg="${i}">
      <span class="luord">${i+1}</span>
      <div class="lumain">
        <div class="luname">${esc(b.name)} ${gradeBadge(b)}${b.bench?' <span class="pill off">板凳</span>':""}</div>
        ${luStatLine(b)}
      </div>
      <span class="lups">${esc(b.posLabel||"")}</span>
      <span class="lubtns">
        <button class="btn sm" data-act="luUp" data-arg="${i}" ${i===0?"disabled":""}>▲</button>
        <button class="btn sm" data-act="luDown" data-arg="${i}" ${i===lu.length-1?"disabled":""}>▼</button>
      </span>
    </div>`).join("");
  const brows=bench.length?bench.map(b=>`<div class="lurow benchrow">
      <span class="luord">–</span>
      <div class="lumain">
        <div class="luname">${esc(b.name)} ${gradeBadge(b)}</div>
        ${luStatLine(b)}
      </div>
      <span class="lups">${esc(b.posLabel||"")}</span>
      <button class="btn sm gold" data-act="luSwap" data-arg="${b.id}">⇄ 換入${sel>=0?"第 "+(sel+1)+" 棒":""}</button>
    </div>`).join(""):`<p class="muted">沒有可替換的球員。</p>`;
  return `<div class="panel"><h2>🧢 打線／守位編輯</h2>
    <p class="muted">調整打線：▲▼ 移動棒次；先點一位先發（反白），再按板凳的「換入」把他排進該棒次。守位依球員本身位置顯示，變更後立即套用到下一場比賽。</p>
    <p class="muted" style="font-size:11px">數值：<b>打</b>＝打擊　<b>力</b>＝力量　<b>選</b>＝選球　<b>走</b>＝速度　<b>守</b>＝守備；後方為本季打率（安打／打數）。</p>
    <div class="hr"></div><h3>先發打線</h3>
    <div class="lulist">${rows}</div>
    <div class="hr"></div><h3>板凳</h3>
    <div class="lulist">${brows}</div>
    <div class="hr"></div>
    <div class="two">
      <button class="btn blk" data-act="luAuto">🤖 自動排序打線</button>
      <button class="btn blk" data-act="luReset">↺ 回復預設打線</button>
      <button class="btn blk" data-act="backHub">← 回球季總部</button>
    </div></div>`;
}

/* ----- 比賽畫面 ----- */
function viewGame(){
  const m=S.match;
  if(!m)return viewHub();
  const off=playerIsOffense(m);
  const myTurn=!m.over;
  const innLabel=(m.half==="top"?"上":"下");
  const offSide=offenseSide(m),defSide=defenseSide(m);
  const batter=currentBatter(m);
  const myOrder=(m.batterIdx[offSide]%m.lineups[offSide].length)+1;
  const P=m.pitchers[defSide];
  const eff=pitcherEffective(P.obj,P.pitches);
  const team=esc(getTeam(S.season.playerTeam).name);

  // 記分板：只顯示已進行到的局數，未開打的半局留白（避免誤看成 0 分）
  const cols=Math.max(1,m.inning);
  const cellPlayed=(side,i)=>{   // i 為 0 起算的局
    if(i+1>m.inning)return false;
    if(i+1<m.inning)return true;
    return m.half==="top"?side==="away":true;
  };
  let head="<tr><th>球隊</th>";
  for(let i=1;i<=cols;i++)head+=`<th>${i}</th>`;
  head+="<th>R</th><th>H</th><th>E</th></tr>";
  const row=(id,key)=>{
    const isP=id===S.season.playerTeam;
    let r=`<tr class="${isP?"player":""}"><td class="team">${esc(getTeam(id).short)} ${esc(getTeam(id).name)}${isP?"＊":""}</td>`;
    for(let i=0;i<cols;i++)r+=`<td>${cellPlayed(key,i)?(m.line[key][i]||0):""}</td>`;
    r+=`<td class="rhe">${m.score[key]}</td><td class="rhe">${m.hits[key]}</td><td class="rhe">${m.errs[key]}</td></tr>`;
    return r;
  };
  const scoreboard=`<div class="scoreboard"><table>${head}${row(m.awayId,"away")}${row(m.homeId,"home")}</table></div>`;

  // 壘包圖
  const field=fieldSVG(m.bases);
  const count=`<div class="countbox">
    <div class="countrow"><span class="lbl">B</span><span class="leds">${[0,1,2,3].map(i=>`<span class="led b ${i<m.balls?"on":""}"></span>`).join("")}</span>
      <span class="lbl">S</span><span class="leds">${[0,1,2].map(i=>`<span class="led s ${i<m.strikes?"on":""}"></span>`).join("")}</span>
      <span class="lbl">O</span><span class="leds">${[0,1,2].map(i=>`<span class="led o ${i<m.outs?"on":""}"></span>`).join("")}</span></div>
    <div class="countrow" style="margin-top:6px"><span class="lbl">局面</span><b style="color:#ffe07a">${m.inning}局${innLabel}</b>　<span class="lbl">壘上</span>${batterDesc(m)}</div>
  </div>`;

  const matchup=`<div class="matchup">
    <div style="margin-bottom:6px"><span class="who">🧑 ${esc(batter.name)}</span><span class="pos">${esc(batter.posLabel)}</span><span class="pill on">第 ${myOrder} 棒</span>
      <span class="muted" style="font-size:12px">　打率 ${batAvg(m,batter.id)}</span></div>
    ${rbar("打擊",batter.meet)}${rbar("長打",batter.power)}${rbar("選球",batter.eye)}${rbar("走壘",batter.speed)}
    <div class="hr"></div>
    <div style="margin-bottom:6px"><span class="who">🔥 ${esc(P.obj.name)}</span><span class="pos">${esc(P.obj.role)}</span>
      <span class="muted" style="font-size:12px">　投球數 ${P.pitches}${eff.fatigue<0.95?' <span class="pill off">疲勞</span>':' <span class="pill on">狀態佳</span>'}　<span class="speed">⚡ ${m.pitchSpeed||"-"} km/h</span></span></div>
    ${rbar("球速",P.obj.velocity)}${rbar("控球",P.obj.control)}${rbar("變化",P.obj.breaking)}${rbar("體力",P.obj.stamina)}
  </div>`;

  // 日誌
  const log=`<div class="log" id="log">${m.log.map(l=>{
    if(typeof l==="string")return `<p>${esc(l)}</p>`;
    return `<p class="${l.c||""}">${esc(l.t)}</p>`;
  }).join("")}</div>`;

  // 動作
  let actions="";
  if(!m.over){
    if(off){
      actions=`<div class="actgroup"><span class="gtitle">打擊戰術</span><br>
        <button class="btn red" data-act="bat" data-arg="normal">正常揮擊</button>
        <button class="btn red" data-act="bat" data-arg="power">強力揮擊</button>
        <button class="btn red" data-act="bat" data-arg="take">耐心等球</button>
        ${m.bases[0]!==null||m.bases[1]!==null?`<button class="btn" data-act="bat" data-arg="bunt">犧牲短打</button>`:""}
        ${m.bases[0]||m.bases[1]?`<button class="btn" data-act="bat" data-arg="hitrun">打帶跑</button>`:""}
      </div>
      <div class="actgroup"><span class="gtitle">跑壘／調度</span><br>
        ${m.bases[0]||m.bases[1]?`<button class="btn blue" data-act="steal">盜壘</button>`:""}
        ${m.bench[offSide].length?`<button class="btn blue" data-act="pinchhit">代打</button>`:""}
      </div>`;
    }else{
      actions=`<div class="actgroup"><span class="gtitle">配球策略</span><br>
        <button class="btn gold" data-act="pitch" data-arg="power">全力投球</button>
        <button class="btn gold" data-act="pitch" data-arg="control">控球至上</button>
        <button class="btn gold" data-act="pitch" data-arg="corner">邊邊角角</button>
        <button class="btn gold" data-act="pitch" data-arg="chase">引誘球</button>
        <button class="btn" data-act="pitch" data-arg="ibb">故意四壞</button>
      </div>
      <div class="actgroup"><span class="gtitle">投手調度</span><br>
        ${bullpenButtons(m)}
      </div>`;
    }
    actions+=`<div class="actgroup" style="border-top:1px dotted var(--line);padding-top:6px">
      <button class="btn green" data-act="autoInning">⏩ 自動完成本局</button>
      <button class="btn green" data-act="simGame">⏭ 快速模擬全場</button>
    </div>`;
  }

  let result="";
  if(m.over){
    const win=m.winner;
    const title=m.walkoff?"🎉 再見安打！勝利！":
      win===null?"和局收場":`比賽結束　${esc(getTeam(win==="home"?m.homeId:m.awayId).name)} 獲勝`;
    const hasReg=!!nextPlayerGame(),hasPo=!!playoffNextGame();
    const nextBtn=(hasReg||hasPo)?`<button class="btn green blk" data-act="nextGame">⏭ ${hasReg?"繼續下一場":"繼續季後賽"}</button>`:"";
    const poInfo = (S.season&&S.season.playoff)?`<p class="center muted" style="font-size:12px">季後賽狀態：${S.season.playoff.champion?"已結束（總冠軍 ${teamBadge(S.season.playoff.champion)}）":(S.season.playoff.stage==="final"?"冠軍戰進行中":"準決賽進行中")}　${S.season.playoff.seeds&&S.season.playoff.seeds.indexOf(S.season.playerTeam)>=0?"（你已晉級）":""}</p>`:"";
    result=`<div class="panel" id="gameresult"><h2>${title}</h2>
      <p class="center">最終比數　<b class="bignum">${esc(getTeam(m.awayId).name)} ${m.score.away} － ${m.score.home} ${esc(getTeam(m.homeId).name)}</b></p>
      ${m.hero?`<p class="center" style="margin-top:8px">◆ Player of the Game：${teamBadge(teamOfPlayer({id:m.hero.pid}))}　<b>${esc(m.hero.name)}</b>　${m.hero.isPit?`<span class="pill on">三振 ${m.hero.s.k} 次</span>`:`<span class="pill on">安打 ${m.hero.s.h}／打點 ${m.hero.s.rbi}</span>`}</p>`:""}
      ${poInfo}
      ${boxScore(m)}
      <div class="hr"></div>
      ${nextBtn}
      <button class="btn ${nextBtn?"":"green"} blk" data-act="backToHub">▶ 回到球季總部</button>
    </div>`;
  }

  return `<div class="panel">
    ${S.ballFlash?`<div class="playball">⚾ PLAY BALL！</div>`:""}
    <div class="topbar"><div>你的球隊：<b>${team}</b></div><div class="turn">${m.over?"比賽結束":(off?"▶ 你的進攻（下達打擊戰術）":"▶ 你的守備（下達配球）")}</div></div>
    ${scoreboard}
    ${m.splash?`<div class="splash ${m.splash.c}">${esc(m.splash.t)}</div>`:""}
    <div class="fieldwrap" style="margin-top:10px">
      ${field}
      <div class="cond">${count}${matchup}</div>
    </div>
  </div>
  <div class="panel">
    <h2>實況轉播</h2>
    ${log}
    <div class="actions">${actions}</div>
  </div>
  <div class="panel">
    <h2>打線與板凳</h2>
    <div class="two">${lineupBox(m,"away")}${lineupBox(m,"home")}</div>
  </div>
  ${result}`;
}
function batterDesc(m){
  const b=[];if(m.bases[2])b.push("三壘");if(m.bases[1])b.push("二壘");if(m.bases[0])b.push("一壘");
  return b.length?b.join("、")+"有跑者":"壘上無人";
}
function batAvg(m,pid){
  const s=m.stats[pid];
  if(!s||!s.ab)return ".000";
  return fmtAvg(s.h/s.ab);
}
function lineupBox(m,side){
  const lu=m.lineups[side];
  const isOff=!m.over&&side===offenseSide(m);
  const cur=isOff?lu[m.batterIdx[side]%lu.length]:null;
  const onBase=new Set();m.bases.forEach(x=>{if(x)onBase.add(x.id);});
  const orig=(m.originals&&m.originals[side])||[];
  const tid=side==="away"?m.awayId:m.homeId;   // side 是 away/home，m.awayId/m.homeId 才是球隊 id（原本比錯對象，兩邊都顯示主隊）
  const rows=lu.map((b,i)=>{
    const cls=[];
    if(onBase.has(b.id))cls.push("onbase");
    if(cur&&b.id===cur.id)cls.push("batting");
    const o=orig[i];
    const subNote=(o&&o.id!==b.id)?` <span class="muted" style="font-size:11px">（原 ${esc(o.name)}・${esc(o.posLabel)}）</span>`:"";
    const mark=onBase.has(b.id)?' <span class="pill on">壘</span>':"";
    return `<tr class="${cls.join(" ")}"><td class="num">${i+1}</td><td class="name">${cur&&b.id===cur.id?"▶ ":""}${esc(b.name)}${mark}${subNote}</td><td>${esc(b.posLabel)}</td></tr>`;
  }).join("");
  const bench=m.bench[side].map(b=>`${esc(b.name)}<span class="muted">（${esc(b.posLabel)}）</span>`).join("、");
  const bp=m.bullpen[side].map(p=>`${esc(p.name)}<span class="muted">（${esc(p.role)}）</span>`).join("、");
  const P=m.pitchers[side].obj;
  return `<div>
    <h3>${teamBadge(tid)}${isOff?' <span class="pill on">進攻中</span>':""}</h3>
    <table class="grid lineup"><tr><th>棒</th><th>球員</th><th>守位</th></tr>${rows}</table>
    <p class="muted" style="font-size:12px;margin:6px 0 2px">投手：${esc(P.name)}（${esc(P.role)}）</p>
    <p class="muted" style="font-size:12px;margin:2px 0">板凳：${bench||"－"}</p>
    <p class="muted" style="font-size:12px;margin:2px 0">牛棚：${bp||"－"}</p>
  </div>`;
}
function bullpenButtons(m){
  const defSide=defenseSide(m);
  const bp=m.bullpen[defSide];
  if(!bp.length)return `<span class="muted">牛棚已無可用投手</span>`;
  return bp.map(p=>`<button class="btn sm blue" data-act="changePit" data-arg="${p.id}">換上 ${esc(p.name)}（${p.role}）</button>`).join("");
}
function boxScore(m){
  const mk=(id,key)=>{
    const lu=m.lineups[key];
    const orig=(m.originals&&m.originals[key])||[];
    let rows=lu.map((b,i)=>{
      const s=m.stats[b.id]||{ab:0,h:0,hr:0,rbi:0,bb:0,k:0,r:0};
      const o=orig[i];
      const subNote=(o&&o.id!==b.id)?` <span class="muted" style="font-size:11px">（原 ${esc(o.name)}・${esc(o.posLabel)}）</span>`:"";
      return `<tr><td class="name">${esc(b.name)}${subNote}</td><td>${esc(b.posLabel)}</td>
        <td class="num">${s.ab}</td><td class="num">${s.h}</td><td class="num">${s.hr}</td>
        <td class="num">${s.rbi}</td><td class="num">${s.bb}</td><td class="num">${s.k}</td></tr>`;
    }).join("");
    const cur=m.pitchers[key].obj.id;
    const ids=(m.usedPitchers[key]||[]).concat(cur).filter((v,i,a)=>a.indexOf(v)===i);
    const pitRows=ids.map(pid=>{
      const p=playerById(pid);
      const ps=m.pstats[pid]||{outs:0,h:0,r:0,er:0,bb:0,k:0,pp:0};
      return `<tr><td class="name">${esc(p?p.name:pid)}${pid===cur?' <span class="pill on">現任</span>':''}</td>
        <td class="num">${fmtIP(ps.outs)}</td><td class="num">${ps.h}</td><td class="num">${ps.r}</td><td class="num">${ps.er}</td>
        <td class="num">${ps.bb}</td><td class="num">${ps.k}</td><td class="num">${ps.pp}</td></tr>`;
    }).join("");
    return `<h3>${esc(getTeam(id).name)}</h3>
      <table class="grid boxscore"><tr><th>打者</th><th>守位</th><th>打數</th><th>安打</th><th>全壘</th><th>打點</th><th>四壞</th><th>三振</th></tr>${rows}</table>
      <table class="grid boxscore" style="margin-top:6px"><tr><th>投手</th><th>局數</th><th>被安</th><th>失分</th><th>責失</th><th>四壞</th><th>三振</th><th>球數</th></tr>${pitRows}</table>`;
  };
  return `${mk(m.awayId,"away")}${mk(m.homeId,"home")}`;
}
function fieldSVG(bases){
  const occ=[!!bases[0],!!bases[1],!!bases[2]];
  const base=(x,y,on,label)=>`<g><rect x="${x-14}" y="${y-14}" width="28" height="28" rx="4" transform="rotate(45 ${x} ${y})" fill="${on?"#7fd6ea":"#0d1e30"}" stroke="${on?"#eaf6ff":"#35597a"}" stroke-width="2"${on?' filter="url(#hglow)"':""}/>${on?`<text x="${x}" y="${y+5}" text-anchor="middle" font-size="15" fill="#06202b" font-weight="700">${label}</text>`:""}</g>`;
  return `<svg viewBox="0 0 220 210" class="field-svg" preserveAspectRatio="xMidYMid meet">
    <defs><filter id="hglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    <rect width="220" height="210" fill="#0d1a2a"/>
    <path d="M110 196 L201 105 L110 14 L19 105 Z" fill="#122c45" stroke="#57c8e6" stroke-width="2"/>
    <path d="M110 196 L110 130 L188 105 Z" fill="#1b3f60" opacity="0.6"/>
    <text x="110" y="66" text-anchor="middle" font-size="11" fill="#8fb0cc">2B</text>
    <text x="46" y="112" text-anchor="middle" font-size="11" fill="#8fb0cc">3B</text>
    <text x="176" y="112" text-anchor="middle" font-size="11" fill="#8fb0cc">1B</text>
    ${base(19,105,occ[2],3)}
    ${base(110,14,occ[1],2)}
    ${base(201,105,occ[0],1)}
    <rect x="96" y="182" width="28" height="16" rx="3" transform="rotate(45 110 190)" fill="#0d1e30" stroke="#35597a" stroke-width="2"/>
    <text x="110" y="205" text-anchor="middle" font-size="10" fill="#8fb0cc">本壘</text>
  </svg>`;
}

/* ----- 陣容與成績 ----- */
function viewRoster(){
  const tid=S.season.playerTeam,t=getTeam(tid),ps=S.season.playerStats;
  const batRows=t.batters.map(b=>{
    const s=ps.bat[b.id];
    const ab=s?s.ab:0,h=s?s.h:0;

/* ----- 選手能力數值 ----- */
function viewAbilities(){
  const teamIds=TEAM_DEFS.map(t=>t.id);
  const valid=teamIds.concat(["__all"]);
  const sel=valid.indexOf(S.abilTeam)>=0?S.abilTeam:S.season.playerTeam;
  const isAll=sel==="__all";
  const tabs=valid.map(id=>{
    const lab=id==="__all"?"🌐 全聯盟":esc(getTeam(id).short||getTeam(id).name);
    return `<button class="btn sm ${id===sel?"gold":""}" data-act="abilTeam" data-arg="${id}">${lab}</button>`;
  }).join("");
  let bats=[],pits=[];
  if(isAll){
    teamIds.forEach(id=>{const tt=getTeam(id);tt.batters.forEach(b=>bats.push({p:b,tid:id}));tt.pitchers.forEach(p=>pits.push({p,tid:id}));});
  }else{
    const tt=getTeam(sel);tt.batters.forEach(b=>bats.push({p:b,tid:sel}));tt.pitchers.forEach(p=>pits.push({p,tid:sel}));
  }
  // 守位清單（依傳統順序）
  const POS_ORDER=["捕手","一壘手","二壘手","三壘手","游擊手","左外野","中外野","右外野","指定打擊"];
  const posSet=[];
  bats.forEach(x=>{if(posSet.indexOf(x.p.posLabel)<0)posSet.push(x.p.posLabel);});
  posSet.sort((a,b)=>{const ia=POS_ORDER.indexOf(a),ib=POS_ORDER.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib);});
  const pos=S.abilPos||"all", role=S.abilRole||"all";
  // 野手：篩選 + 排序
  let batsF=(pos==="all")?bats.slice():bats.filter(x=>x.p.posLabel===pos);
  if(role==="start")batsF=batsF.filter(x=>!x.p.bench);
  else if(role==="bench")batsF=batsF.filter(x=>x.p.bench);
  const bkeys={overall:p=>playerOverall(p),meet:p=>p.meet,power:p=>p.power,eye:p=>p.eye,speed:p=>p.speed,defense:p=>p.defense};
  if(S.abilBatSort==="age")batsF.sort((a,b)=>a.p.age-b.p.age);
  else if(S.abilBatSort!=="orig"&&bkeys[S.abilBatSort]){const f=bkeys[S.abilBatSort];batsF.sort((a,b)=>f(b.p)-f(a.p));}
  // 投手：篩選 + 排序
  let pitsF=pits.slice();
  if(role==="start")pitsF=pitsF.filter(x=>x.p.starter);
  else if(role==="bench")pitsF=pitsF.filter(x=>!x.p.starter);
  const pkeys={overall:p=>playerOverall(p),velocity:p=>p.velocity,control:p=>p.control,breaking:p=>p.breaking,stamina:p=>p.stamina};
  if(S.abilPitSort==="age")pitsF.sort((a,b)=>a.p.age-b.p.age);
  else if(S.abilPitSort!=="orig"&&pkeys[S.abilPitSort]){const f=pkeys[S.abilPitSort];pitsF.sort((a,b)=>f(b.p)-f(a.p));}
  const teamCell=x=>isAll?`<td class="name"><span class="swatch" style="background:${getTeam(x.tid).c1}"></span>${esc(getTeam(x.tid).short)}</td>`:"";
  const batRows=batsF.map(x=>{const b=x.p;return `<tr><td class="name">${playerAvatar(b,18)}<span class="plink" data-act="player" data-arg="${b.id}">${esc(b.name)}</span>${b.bench?' <span class="pill off">替</span>':''}</td>${teamCell(x)}<td>${esc(b.posLabel)}</td><td class="num">${b.age}${ageNote(b.age)}</td><td class="num">${gradeBadge(b)}</td><td class="num">${b.meet}</td><td class="num">${b.power}</td><td class="num">${b.eye}</td><td class="num">${b.speed}</td><td class="num">${b.defense}</td></tr>`;}).join("");
  const pitRows=pitsF.map(x=>{const p=x.p;return `<tr><td class="name">${playerAvatar(p,18)}<span class="plink" data-act="player" data-arg="${p.id}">${esc(p.name)}</span></td>${teamCell(x)}<td>${esc(p.role)}</td><td class="num">${p.age}${ageNote(p.age)}</td><td class="num">${gradeBadge(p)}</td><td class="num">${p.velocity}</td><td class="num">${p.control}</td><td class="num">${p.breaking}</td><td class="num">${p.stamina}</td></tr>`;}).join("");
  const teamCol=isAll?"<th>球隊</th>":"";
  const btSort=S.abilBatSort||"overall", ptSort=S.abilPitSort||"overall";
  const bsortBtns=[["overall","綜合"],["meet","打擊"],["power","力量"],["eye","選球"],["speed","速度"],["defense","守備"],["age","年齡"],["orig","原本"]]
    .map(([k,l])=>`<button class="btn sm ${btSort===k?"blue":""}" data-act="abilSortBat" data-arg="${k}">${l}</button>`).join("");
  const psortBtns=[["overall","綜合"],["velocity","球速"],["control","控球"],["breaking","變化"],["stamina","體力"],["age","年齡"],["orig","原本"]]
    .map(([k,l])=>`<button class="btn sm ${ptSort===k?"blue":""}" data-act="abilSortPit" data-arg="${k}">${l}</button>`).join("");
  const posBtns=[["all","全部"]].concat(posSet.map(pp=>[pp,pp]))
    .map(([k,l])=>`<button class="btn sm ${pos===k?"gold":""}" data-act="abilPos" data-arg="${k}">${l}</button>`).join("");
  const roleBtns=[["all","全部"],["start","先發"],["bench","替補"]]
    .map(([k,l])=>`<button class="btn sm ${role===k?"gold":""}" data-act="abilRole" data-arg="${k}">${l}</button>`).join("");
  const label=isAll?"▸ 全聯盟":(sel===S.season.playerTeam?"▸ 你的球隊":"▸ 偵察敵隊");
  const sub=isAll?"":`　<span class="swatch" style="background:${getTeam(sel).c1}"></span>${esc(getTeam(sel).name)}`;
  return `<div class="panel"><h2>選手能力數值</h2>
    <div class="actions">${tabs}</div>
    <div class="muted" style="font-size:12px;margin:4px 0 6px">第 ${CAREER.seasons+1} 季　${label}${sub}</div>
    <div class="actgroup"><span class="gtitle">野手排序</span><br>${bsortBtns}</div>
    <div class="actgroup"><span class="gtitle">守位篩選</span><br>${posBtns}</div>
    <div class="actgroup"><span class="gtitle">先發／替補</span><br>${roleBtns}</div>
    <h3>野手</h3>
    <table class="grid"><tr><th>球員</th>${teamCol}<th>守位</th><th>年齡</th><th>綜合</th><th>打擊</th><th>力量</th><th>選球</th><th>速度</th><th>守備</th></tr>${batRows||`<tr><td colspan="${isAll?10:9}" class="muted">沒有符合的球員</td></tr>`}</table>
    <div class="actgroup"><span class="gtitle">投手排序</span><br>${psortBtns}</div>
    <h3>投手</h3>
    <table class="grid"><tr><th>球員</th>${teamCol}<th>角色</th><th>年齡</th><th>綜合</th><th>球速</th><th>控球</th><th>變化</th><th>體力</th></tr>${pitRows||`<tr><td colspan="${isAll?9:8}" class="muted">沒有符合的球員</td></tr>`}</table>
    <div class="abilnote">箭頭表示年齡趨勢：<span style="color:#1f8f4a">▲</span>成長期　<span style="color:#6b6455">–</span>巔峰　<span style="color:#b5533a">▼</span>衰退期。每打完一季、開始新球季時，全聯盟球員會+1 歲並成長／老化（39 歲退休換新人）。</div>
    <div class="hr"></div>
    <button class="btn blk" data-act="backHub">← 回球季總部</button></div>`;
}

/* ----- 球員資料卡 ----- */
function viewPlayer(){
  const pid=S.selPlayer,p=pid?playerById(pid):null;
  if(!p)return `<div class="panel"><h2>球員資料</h2><div class="muted">找不到球員資料。</div><div class="hr"></div><button class="btn blk" data-act="backHub">← 回球季總部</button></div>`;
  const tid=pid.replace(/[bp]\d+$/,""),team=getTeam(tid),isPit=(p.role!==undefined);
  const ps=S.season&&S.season.playerStats;
  let bars,statsTable,roleLabel;
  if(isPit){
    roleLabel=p.role;
    bars=rbar("球速",p.velocity)+rbar("控球",p.control)+rbar("變化",p.breaking)+rbar("體力",p.stamina);
    const s=ps&&ps.pit[pid];
    statsTable=`<table class="grid"><tr><th>出賽</th><th>局數</th><th>防禦率</th><th>勝</th><th>敗</th><th>救援</th><th>被安</th><th>四壞</th><th>三振</th></tr>
      <tr><td class="num">${s?s.g:0}</td><td class="num">${s?fmtIP(s.outs):"0.0"}</td><td class="num">${s?fmtERA(s.er,s.outs):"-.-"}</td><td class="num">${s?s.w:0}</td><td class="num">${s?s.l:0}</td><td class="num">${s?s.sv:0}</td><td class="num">${s?s.h:0}</td><td class="num">${s?s.bb:0}</td><td class="num">${s?s.k:0}</td></tr></table>`;
  }else{
    roleLabel=p.posLabel;
    bars=rbar("打擊",p.meet)+rbar("力量",p.power)+rbar("選球",p.eye)+rbar("速度",p.speed)+rbar("守備",p.defense);
    const s=ps&&ps.bat[pid],ab=s?s.ab:0,h=s?s.h:0;
    statsTable=`<table class="grid"><tr><th>出賽</th><th>打數</th><th>安打</th><th>打率</th><th>全壘</th><th>打點</th><th>四壞</th><th>三振</th><th>得分</th><th>盜壘</th></tr>
      <tr><td class="num">${s?s.g:0}</td><td class="num">${ab}</td><td class="num">${h}</td><td class="num">${fmtAvg(ab?h/ab:0)}</td><td class="num">${s?s.hr:0}</td><td class="num">${s?s.rbi:0}</td><td class="num">${s?s.bb:0}</td><td class="num">${s?s.k:0}</td><td class="num">${s?s.r:0}</td><td class="num">${s?s.sb:0}</td></tr></table>`;
  }
  const overall=playerOverall(p);
  // 生涯累計＝已完成球季＋本季進行中（careerMerged 會併入未結算的本季），不必等球季結束才看得到
  const care=careerMerged();
  const cs=isPit?(care.pit||{})[pid]:(care.bat||{})[pid];

  if(isPit){
    careerTable=cs?`<table class="grid"><tr><th>出賽</th><th>局數</th><th>防禦率</th><th>勝</th><th>敗</th><th>救援</th><th>三振</th></tr>
      <tr><td class="num">${cs.g||0}</td><td class="num">${fmtIP(cs.outs||0)}</td><td class="num">${fmtERA(cs.er||0,cs.outs||0)}</td><td class="num">${cs.w||0}</td><td class="num">${cs.l||0}</td><td class="num">${cs.sv||0}</td><td class="num">${cs.k||0}</td></tr></table>`
      :`<p class="muted">尚無生涯累計（本季目前也還沒有出賽紀錄）。</p>`;
  }else{
    const cab=cs?cs.ab:0,ch=cs?cs.h:0;
    careerTable=cs?`<table class="grid"><tr><th>出賽</th><th>打數</th><th>安打</th><th>打率</th><th>全壘</th><th>打點</th><th>盜壘</th></tr>
      <tr><td class="num">${cs.g||0}</td><td class="num">${cab}</td><td class="num">${ch}</td><td class="num">${fmtAvg(cab?ch/cab:0)}</td><td class="num">${cs.hr||0}</td><td class="num">${cs.rbi||0}</td><td class="num">${cs.sb||0}</td></tr></table>`
      :`<p class="muted">尚無生涯累計（本季目前也還沒有出賽紀錄）。</p>`;
  }
  const best=playerBestGame(pid,isPit);
  const bestHTML=best?`<p>${best.text}</p>
    <button class="btn sm" data-act="gameDetail" data-arg="${best.d},${best.gi}">查看該場明細 ▸</button>`
    :`<p class="muted">本季尚無出賽紀錄。</p>`;
  const aws=playerAwards(pid);
  const awardHTML=aws.length?`<ul class="awardlist">${aws.map(x=>`<li>🏆 ${esc(x)}</li>`).join("")}</ul>`
    :`<p class="muted">尚無獲獎紀錄。</p>`;
  const miles=playerMilestones(pid);
  const mileHTML=miles.length?`<ul class="awardlist">${miles.map(x=>`<li>🎖 ${esc(x)}</li>`).join("")}</ul>`
    :`<p class="muted">尚未達成生涯里程碑（跨季累計）。</p>`;
  const allMiles=(CAREER.milestones||{})[pid]||{};
  const milestoneSummary=Object.keys(allMiles).length?`<p class="muted" style="font-size:12px">累計達成 ${Object.keys(allMiles).length} 項里程碑</p>`:"";
  return `<div class="panel"><h2>球員資料</h2>
    <div class="matchup">
      ${playerAvatar(p,56)}
      <div style="margin-bottom:6px"><span class="who">${esc(p.name)}</span><span class="pos">${esc(roleLabel)}</span>

        <span style="float:right">綜合 <span class="grade g-${gradeOf(overall)}">${gradeOf(overall)}</span> <b style="font-family:Consolas,monospace">${overall}</b></span></div>
      ${bars}
    </div>
    <h3>本季成績（第 ${CAREER.seasons+1} 季）</h3>${statsTable}
    <h3>生涯累計（跨季＋本季）</h3>${careerTable}
    <h3>本季亮眼</h3>${bestHTML}
    <h3>生涯里程碑</h3>${milestoneSummary}${mileHTML}
    <h3>獲獎紀錄</h3>${awardHTML}
    <div class="abilnote">${isPit?"先發投手體力較高、後援球速與變化較突出。":"替補球員（藍色「替」標籤）可在比賽中用代打上場。"}</div>
    <div class="hr"></div>
    <button class="btn" data-act="roster">← 回陣容</button>
    <button class="btn" data-act="abilities">選手能力一覽</button>
    <button class="btn" data-act="backHub">回球季總部</button>
  </div>`;
}
/* ----- 引退球員資料卡（人已離開聯盟，資料取引退當下存下的快照） ----- */

        <td class="num">${s.hr||0}</td><td class="num">${s.rbi||0}</td><td class="num">${s.bb||0}</td><td class="num">${s.k||0}</td><td class="num">${s.r||0}</td><td class="num">${s.sb||0}</td></tr></table>`;

  const aws=[];

    const add=(e,label)=>{if(e&&e.pid===r.pid&&e.name===r.name)aws.push(`第 ${a.no} 季 ${label}`);};
    add(a.mvp,"最有價值球員");add(a.cy,"最佳投手（先發）");add(a.reliever,"最佳後援");

    ((a.kings||[])||[]).forEach(x=>{if(x.pid===r.pid&&x.name===r.name)aws.push(`第 ${a.no} 季 ${x.title}`);});

  const kindTxt=isPit?"投手":(s.ab!=null?"打者":"－");

/* 從本季逐場 box 找出該球員最亮眼的一場 */
function playerBestGame(pid,isPit){
  const se=S.season;if(!se)return null;
  let best=null;
  (se.boxes||[]).forEach((arr,d)=>(arr||[]).forEach((b,gi)=>{
    const f=isPit?b.pit[pid]:b.bat[pid];
    if(!f)return;
    const myTeam=pid.replace(/[bp]\d+$/,"");
    const oppId=(b.aw===myTeam)?b.hm:(b.hm===myTeam)?b.aw:null;
    if(!oppId)return;
    const opp=getTeam(oppId).name;
    if(isPit){
      const score=(f[0]||0)*10+(f[5]||0)*3-f[2]*2+(f[7]?20:0);
      if(!best||score>best.score){
        best={d,gi,score,text:`第 ${d+1} 日 vs ${esc(opp)}：${fmtIP(f[0])} 局、${f[5]} 次三振、失 ${f[2]} 分${f[7]?"（勝投）":f[9]?"（救援）":""}`};
      }
    }else{
      const score=(f[1]||0)*2+(f[2]||0)*4+(f[3]||0)*2+(f[5]||0);
      if(!best||score>best.score){
        const hr=f[2]?"、"+f[2]+" 發全壘打":"";
        const rbi=f[3]?"、"+f[3]+" 打點":"";
        best={d,gi,score,text:`第 ${d+1} 日 vs ${esc(opp)}：${f[0]} 打數 ${f[1]} 安打${hr}${rbi}`};
      }
    }
  }));
  return best;
}
/* 該球員的歷屆獲獎紀錄（跨季，綁定頒獎典禮） */
function playerAwards(pid){
  const out=[];
  const me=playerById(pid),myName=me?me.name:null;
  // 同時比對姓名：pid 會被選秀新人沿用，只比 pid 會把退休前人的獎掛到新人頭上
  const same=(e)=>e&&e.pid===pid&&(!myName||!e.name||e.name===myName);
  (CAREER.awards||[]).forEach(a=>{
    if(same(a.mvp))out.push(`第 ${a.no} 季 最有價值球員（MVP）`);
    if(same(a.cy))out.push(`第 ${a.no} 季 最佳投手`);
    if(same(a.reliever))out.push(`第 ${a.no} 季 最佳後援`);
    if(same(a.rookie))out.push(`第 ${a.no} 季 新人王`);
    if(same(a.sawamura))out.push(`第 ${a.no} 季 澤村賞`);
    if(same(a.bestDH))out.push(`第 ${a.no} 季 最佳指定打擊`);
    (a.best9||[]).forEach(b=>{if(b.pid===pid&&(!myName||b.name===myName))out.push(`第 ${a.no} 季 最佳九人（${b.pos}）`);});
    (a.gloves||[]).forEach(g=>{if(g.pid===pid&&(!myName||g.name===myName))out.push(`第 ${a.no} 季 金手套（${g.pos}）`);});
    (a.kings||[]).forEach(k=>{if(same(k))out.push(`第 ${a.no} 季 ${k.title}${k.val!=null?"（"+k.val+"）":""}`);});
  });
  return out;
}

function inningLineTable(box){
  const a=box.line.aw||[],h=box.line.hm||[];
  const N=Math.max(a.length,h.length,1);
  let head="<tr><th></th>";
  for(let i=1;i<=N;i++)head+=`<th>${i}</th>`;
  head+="<th>R</th></tr>";
  const mk=(arr,score,tid)=>`<tr><td class="name">${teamBadge(tid)}</td>`+arr.slice(0,N).map(v=>`<td class="num">${v!=null?v:0}</td>`).join("")+`<td class="num"><b>${score}</b></td></tr>`;
  return `<table class="grid">${head}${mk(a,box.a,box.aw)}${mk(h,box.h,box.hm)}</table>`;
}
function boxBatTable(box,side){
  const tid=side==="aw"?box.aw:box.hm;
  const rows=Object.keys(box.bat).filter(pid=>pid.indexOf(tid+"b")===0).map(pid=>{
    const f=box.bat[pid],p=playerById(pid);
    return `<tr><td class="name">${esc(p?p.name:pid)}</td><td class="num">${f[0]}</td><td class="num">${f[1]}</td><td class="num">${f[2]}</td><td class="num">${f[3]}</td><td class="num">${f[4]}</td><td class="num">${f[5]}</td><td class="num">${f[6]}</td></tr>`;
  }).join("");
  return `<h3>${esc(getTeam(tid).name)}</h3><table class="grid boxscore"><tr><th>打者</th><th>打數</th><th>安打</th><th>全壘</th><th>打點</th><th>四壞</th><th>三振</th><th>得分</th></tr>${rows||`<tr><td colspan="8" class="muted">－</td></tr>`}</table>`;
}
function boxPitTable(box,side){
  const tid=side==="aw"?box.aw:box.hm;
  const rows=Object.keys(box.pit).filter(pid=>pid.indexOf(tid+"p")===0).map(pid=>{
    const f=box.pit[pid],p=playerById(pid);
    const cur=f[7]?' <span class="pill on">勝</span>':f[8]?' <span class="pill off">敗</span>':f[9]?' <span class="pill on">救</span>':"";
    return `<tr><td class="name">${esc(p?p.name:pid)}${cur}</td><td class="num">${fmtIP(f[0])}</td><td class="num">${f[1]}</td><td class="num">${f[2]}</td><td class="num">${f[3]}</td><td class="num">${f[4]}</td><td class="num">${f[5]}</td><td class="num">${f[6]}</td></tr>`;
  }).join("");
  return `<h3>${esc(getTeam(tid).name)}</h3><table class="grid boxscore"><tr><th>投手</th><th>局數</th><th>被安</th><th>失分</th><th>責失</th><th>四壞</th><th>三振</th><th>球數</th></tr>${rows||`<tr><td colspan="8" class="muted">－</td></tr>`}</table>`;
}
function gameDigest(box){
  const parts=[];
  const runsLine=side=>{
    const xs=[];
    (box.line[side]||[]).forEach((v,i)=>{if(v)xs.push(`${i+1}${side==="aw"?"上":"下"}+${v}`);});
    return xs;
  };
  const aRuns=runsLine("aw"),hRuns=runsLine("hm");
  if(aRuns.length||hRuns.length){
    const L=[];
    if(aRuns.length)L.push(`${esc(getTeam(box.aw).name)} ${aRuns.join("、")}`);
    if(hRuns.length)L.push(`${esc(getTeam(box.hm).name)} ${hRuns.join("、")}`);
    parts.push(`<p><span class="dlbl">得分過程</span>　${L.join("　／　")}</p>`);
  }
  const hrList=side=>Object.keys(box.bat).filter(pid=>pid.indexOf(box[side==="aw"?"aw":"hm"]+"b")===0).filter(pid=>box.bat[pid][2]>0).map(pid=>{const p=playerById(pid);return `${esc(p?p.name:pid)} ${box.bat[pid][2]}轟`;});
  const hr=[...hrList("aw"),...hrList("hm")];
  if(hr.length)parts.push(`<p><span class="dlbl">全壘打</span>　${hr.join("、")}</p>`);
  const pitOf=side=>{
    const tid=box[side==="aw"?"aw":"hm"];
    const ps=Object.keys(box.pit).filter(pid=>pid.indexOf(tid+"p")===0);
    const nm=pid=>{const p=playerById(pid);return p?esc(p.name):pid;};
    const w=ps.find(pid=>box.pit[pid][7]>0),l=ps.find(pid=>box.pit[pid][8]>0),sv=ps.find(pid=>box.pit[pid][9]>0);
    return [(w?"勝投 "+nm(w):""),(l?"敗投 "+nm(l):""),(sv?"救援 "+nm(sv):"")].filter(Boolean).join("　");
  };
  const pi=[pitOf("aw"),pitOf("hm")].filter(Boolean).join("　");
  if(pi)parts.push(`<p><span class="dlbl">勝敗</span>　${pi}</p>`);
  return parts.join("");
}

/* ----- 球員排行 ----- */
/* 入榜門檻：依本季已賽場數動態調整，避免小樣本刷榜 */
function leadersQualify(){
  const gp=Math.min((S.season&&S.season.day)||0,(S.season.schedule||[]).length);
  return {
    gp,
    bat: Math.max(3,Math.ceil(gp*0.8)),          // 野手：須達到約 80% 出賽場次
    pit: Math.max(3,gp>=10?5:3),                 // 投手：明顯提升門檻，避免打沒幾場就領獎
    eraOuts: Math.min(30,Math.max(12,gp*2))      // 防禦率：完整球季約 28 出局（先發 100+、終結者 30+ 可進榜，雜役投手排除）
  };
}
function leadersList(kind){
  if(!S.season.playerStats)S.season.playerStats={bat:{},pit:{}};
  const ps=S.season.playerStats;
  const q=leadersQualify();
  if(kind==="era"||kind==="w"||kind==="k"||kind==="sv"){
    const arr=[];
    for(const pid in ps.pit){const s=ps.pit[pid],p=playerById(pid);if(p&&(s.g||0)>=q.pit)arr.push({p,pid,s});}
    if(kind==="era")return arr.filter(x=>(x.s.outs||0)>=q.eraOuts).sort((a,b)=>(a.s.er*27/a.s.outs)-(b.s.er*27/b.s.outs)).map(x=>({...x,val:fmtERA(x.s.er,x.s.outs)}));
    if(kind==="w") return arr.sort((a,b)=>b.s.w-a.s.w||b.s.k-a.s.k).map(x=>({...x,val:x.s.w+" 勝"}));
    if(kind==="k") return arr.sort((a,b)=>b.s.k-a.s.k).map(x=>({...x,val:x.s.k}));
    return arr.sort((a,b)=>b.s.sv-a.s.sv).map(x=>({...x,val:x.s.sv}));
  }
  const arr=[];
  for(const pid in ps.bat){const s=ps.bat[pid],p=playerById(pid);if(p&&(s.g||0)>=q.bat)arr.push({p,pid,s});}
  const minAB=Math.max(5,Math.ceil(q.gp*2));   // 打擊率另設打席門檻（完整球季約 28 打席），避免代打專家刷榜
  switch(kind){
    case "hr": return arr.sort((a,b)=>b.s.hr-a.s.hr).map(x=>({...x,val:x.s.hr}));
    case "rbi":return arr.sort((a,b)=>b.s.rbi-a.s.rbi).map(x=>({...x,val:x.s.rbi}));
    case "h":  return arr.sort((a,b)=>b.s.h-a.s.h).map(x=>({...x,val:x.s.h}));
    case "sb": return arr.sort((a,b)=>b.s.sb-a.s.sb).map(x=>({...x,val:x.s.sb}));
    case "r":  return arr.sort((a,b)=>b.s.r-a.s.r).map(x=>({...x,val:x.s.r}));
    default:   return arr.filter(x=>x.s.ab>=minAB).sort((a,b)=>(b.s.h/b.s.ab)-(a.s.h/a.s.ab)).map(x=>({...x,val:fmtAvg(x.s.h/x.s.ab)}));
  }
}
function viewLeaders(){
  const cat=S.leadCat||"avg";
  const cats=[["avg","打擊率"],["hr","全壘打"],["rbi","打點"],["h","安打"],["sb","盜壘"],["r","得分"],["era","防禦率"],["w","勝投"],["k","三振"],["sv","救援"]];
  const q=leadersQualify();
  const list=leadersList(cat).slice(0,15);
  const rows=list.map((x,i)=>{
    const tid=x.pid.replace(/[bp]\d+$/,"");
    const team=getTeam(tid);
    const isMine=tid===S.season.playerTeam;
    return `<tr class="${isMine?"me":""}"><td>${i+1}</td><td class="name">${esc(x.p.name)}</td>
      <td class="name"><span class="swatch" style="background:${team.c1}"></span>${esc(team.short)}</td>
      <td>${esc(x.p.posLabel||x.p.role)}</td><td class="num">${x.s.g||0}</td><td class="num" style="font-weight:700">${x.val}</td></tr>`;
  }).join("");
  const tabs=cats.map(c=>`<button class="btn sm ${c[0]===cat?"gold":""}" data-act="leadCat" data-arg="${c[0]}">${c[1]}</button>`).join("");
  const isPitCat=(cat==="era"||cat==="w"||cat==="k"||cat==="sv");
  const qualifyNote=isPitCat
    ? `投手需出賽滿 <b>${q.pit}</b> 場${cat==="era"?`、且投滿 <b>${fmtIP(q.eraOuts)}</b> 局`:""}`
    : `野手需出賽滿 <b>${q.bat}</b> 場${cat==="avg"?`、且滿 ${Math.max(5,Math.ceil(q.gp*2))} 打數`:""}`;
  const empty=`<tr><td colspan="6" class="muted">尚無符合資格的資料（本季已賽 ${q.gp} 場）。請先打完更多比賽。</td></tr>`;

    <div class="hr"></div>

}

      <dt>■ 季後賽</dt>
      <dd>例行賽結束後，由<b>前四名</b>晉級季後賽。先打<b>準決賽（1 對 4、2 對 3，3 戰 2 勝）</b>，勝隊再打<b>冠軍戰（5 戰 3 勝）</b>。較高種子擁有較多主場（依系列賽的第 1、3、5 戰在高種子主場）。你的球隊的系列賽可用即時戰術或快速模擬進行；其他對戰會自動模擬。季後賽戰績<b>不列入例行賽排名</b>，打完總冠軍後頒獎並展開新人選秀，接著才結算年齡成長。</dd>
      <dt>■ 存檔</dt>
      <dd>每場比賽結束會自動存入瀏覽器（localStorage）。主選單可「繼續球季」。</dd>
    </dl>
    <div class="hr"></div>
    <button class="btn blk" data-act="${S.season?"backHub":"toTitle"}">← 返回</button>

/* ---------- 事件分派 ---------- */
function confirmMsg(t,arg){
  if(t==="wipeCareer")return "「清除生涯成就」會刪除所有跨季紀錄（生涯戰績、歷屆榮譽、生涯紀錄榜、獲獎紀錄），且無法復原。確定嗎？";
  if(t==="wipeSeason")return "「刪除本季進度」會移除目前的球季存檔，但會保留你的生涯成就（歷史戰績、獎項、紀錄）。確定嗎？";
  if(t==="slotSave")return `槽 ${arg} 已有存檔，確定要用目前的進度覆蓋嗎？`;
  if(t==="slotLoad")return `讀取槽 ${arg} 會覆蓋你目前的進度（尚未存檔的變更會遺失）。確定嗎？`;
  if(t==="slotDel")return `確定要刪除槽 ${arg} 的存檔嗎？`;
  if(t==="adminWipeRecs")return "確定要清除「本季單場紀錄」嗎？（生涯歷史紀錄不受影響）";
  return "確定嗎？";
}
const ACT={
  newgame(){
    const d=S.season?.draft;
    if(d&&!d.done&&d.idx<d.picks.length){
      const remain = d.picks.length - d.idx;
      S.confirm={act:"autoDraftThenNewgame",arg:null,msg:`選秀尚未完成（剩 ${remain} 位）。點擊確定將自動完成剩餘選秀並開始新球季，或取消後前往選秀畫面手動指名。`};
      S.screen="newgame";render();return;
    }
    S.screen="newgame";render();
  },
  autoDraftThenNewgame(){
    const d=S.season.draft;
    const remain=d?(d.picks.length-d.idx):0;   // 先記下剩餘人數（draftAuto 後 draft 會被清掉）
    ACT.draftAuto();
    const drafted=remain?(S.season.draftLog||[]).slice(-remain):[];
    if(drafted.length){
      const names = drafted.map(x=>`${getTeam(x.teamId).name}${x.teamId===S.season.playerTeam?"（你的球團）":""}${x.name}(${x.pos})`).join("、");
      flash(`⚾ 選秀自動完成：${names}`);
    }
    S.screen="newgame";render();
  },
  toTitle(){S.screen="title";render();},
  pickTeam(id){
    // 若有未完成選秀，先自動完成並提示結果（須先於老化：否則新人會被多算一歲、且 draftLog 的 season 標記會不一致）
    const oldDraft = S.season?.draft;
    if(oldDraft && !oldDraft.done && oldDraft.idx < oldDraft.picks.length){
      ACT.draftAuto();
      const drafted = S.season.draftLog?.slice(-oldDraft.picks.length + oldDraft.idx) || [];
      if(drafted.length){
        const names = drafted.map(x=>`${getTeam(x.teamId).name}${x.teamId===S.season.playerTeam?"（你的球團）":""}${x.name}(${x.pos})`).join("、");
        flash(`⚾ 選秀自動完成：${names}`);
      }
    }
    if(CAREER.pending)advanceCareer();
    newSeason(id);
    // 本季過渡期引退快訊（選秀覆蓋＋開季老化，取剛結束那季的記錄）
    const retired=(CAREER.retirements||[]).filter(x=>x.no===(CAREER.seasons||0));
    if(retired.length){
      const names=retired.map(x=>`${getTeam(x.team).name}${x.name}(${x.pos||""}${x.age!=null?x.age+"歲":""})`).join("、");
      flash(`🌅 引退：${names} 高掛球鞋（共 ${retired.length} 人，名單請看歷史→引退名單）`);
    }
    S.screen="hub";render();
  },
  continue(){
    if(loadGame()){S.season&&(S.screen="hub");render();}
  },
  ask(a){
    const i=String(a).indexOf(":"),t=i<0?String(a):String(a).slice(0,i),arg=i<0?null:String(a).slice(i+1);
    S.confirm={act:t,arg,msg:confirmMsg(t,arg)};
    render();
  },
  confirmNo(){S.confirm=null;render();},
  confirmYes(){const c=S.confirm;S.confirm=null;if(c&&ACT[c.act])ACT[c.act](c.arg);else render();},
  wipeSeason(){
    try{localStorage.removeItem(SAVEKEY);localStorage.removeItem(OLD_SAVEKEY);}catch(e){}
    S.season=null;S.match=null;flash("已刪除本季進度（生涯成就保留）");render();
  },
  wipeCareer(){
    try{localStorage.removeItem(CAREERKEY);localStorage.removeItem(OLD_CAREERKEY);}catch(e){}
    CAREER=normalizeCareer(null);   // 走同一套預設欄位，避免清掉後缺 career/milestones 等
    for(const k in teamCache)delete teamCache[k];
    flash("已清除生涯成就");render();
  },
  saveManager(){S.screen="save";S.confirm=null;render();},
  backFromSave(){S.screen=S.season?"hub":"title";S.confirm=null;render();},
  slotSave(a){const n=+a;if(writeSlot(n,exportPayload()))flash("已存入槽 "+n);render();},
  slotLoad(a){
    const n=+a,p=readSlot(n);
    if(!p){flash("槽位是空的");render();return;}
    applyPayload(p);saveCareer();flash("已讀取槽 "+n);render();
  },
  slotDel(a){const n=+a;deleteSlotStorage(n);flash("已刪除槽 "+n);render();},
  exportSave(){flash(exportSaveFile()?"已匯出存檔檔（請確認下載）":"匯出失敗");render();},
  pickImport(){const el=document.getElementById("importFile");if(el)el.click();},
  lineup(){S.screen="lineup";S.luSel=null;render();},
  luPick(i){S.luSel=(S.luSel===+i?null:+i);render();},
  luUp(i){
    const ids=buildLineup(getTeam(S.season.playerTeam)).map(b=>b.id);i=+i;
    if(i>0){[ids[i-1],ids[i]]=[ids[i],ids[i-1]];setPlayerLineup(ids);if(S.luSel===i)S.luSel=i-1;}
    render();
  },
  luDown(i){
    const ids=buildLineup(getTeam(S.season.playerTeam)).map(b=>b.id);i=+i;
    if(i<ids.length-1){[ids[i+1],ids[i]]=[ids[i],ids[i+1]];setPlayerLineup(ids);if(S.luSel===i)S.luSel=i+1;}
    render();
  },
  luSwap(pid){
    const ids=buildLineup(getTeam(S.season.playerTeam)).map(b=>b.id);
    let i=S.luSel==null?0:S.luSel;if(i<0||i>=ids.length)i=0;
    ids[i]=pid;setPlayerLineup(ids);S.luSel=null;
    flash("已把 "+recName(pid)+" 排入第 "+(i+1)+" 棒");render();
  },
  luReset(){
    if(S.season){if(CAREER.lineups)delete CAREER.lineups[S.season.playerTeam];saveCareer();}
    S.luSel=null;flash("已回復預設打線");render();
  },
  luAuto(){
    const team=getTeam(S.season.playerTeam);
    const lu=buildLineup(team),bench=buildBench(team);
    const all=[...lu,...bench];
    // 計算每人的綜合打擊分數（近似 OPS）：打擊+力量+選球*1.2+速度*0.5
    all.forEach(p=>{p._score=Math.round(p.meet*1.2+p.power*1.5+p.eye*1.2+p.speed*0.5);});
    // 先發9人：依分數排序，但前2棒優先高選球+高速度，3-5棒優先高力量
    all.sort((a,b)=>b._score-a._score);
    const top=all.slice(0,9).map(p=>p.id);
    setPlayerLineup(top);
    S.luSel=null;flash("已依綜合打擊能力自動排序（前2棒優先上壘、3-5棒優先長打）");render();
  },
  allstar(){S.screen="allstar";render();},
  allstarSim(){const a=simAllstar();render();},
  seasonInfo(){S.screen="season";render();},
  commissioner(){S.screen="admin";if(!S.adminTeam&&S.season)S.adminTeam=S.season.playerTeam;render();},
  adminTeam(id){S.adminTeam=id;S.adminPid=null;render();},
  adminPlayer(pid){S.adminPid=pid;render();},
  adminStat(arg){
    const [k,d]=String(arg||"").split(",");
    const p=S.adminPid?playerById(S.adminPid):null;
    if(!p||!k)return;
    const o=CAREER.ov[p.id]||(CAREER.ov[p.id]={});
    o[k]=clamp(Math.round((p[k]||50)+Number(d)),20,99);
    for(const ck in teamCache)delete teamCache[ck];
    saveCareer();saveGame();flash(`${p.name} ${k} → ${o[k]}`);render();
  },
  adminAge(arg){
    const p=S.adminPid?playerById(S.adminPid):null;
    if(!p)return;
    const o=CAREER.ov[p.id]||(CAREER.ov[p.id]={});
    o.age=clamp((p.age||26)+Number(arg),19,45);
    for(const ck in teamCache)delete teamCache[ck];
    saveCareer();saveGame();flash(`${p.name} 年齡 → ${o.age}`);render();
  },
  adminWipeRecs(){
    if(S.season){S.season.recs=newRecBook();saveGame();}
    S.confirm=null;flash("已清除本季單場紀錄");render();
  },
  /* 快速模擬到季中/季末 */
  simToMid(){
    const se=S.season;
    if(!se)return;
    const mid=Math.floor((se.schedule||[]).length/2);
    // 如果明星賽已經進行過或已通知過且已經過了季中日，直接回總部並提示
    if(se.allstar && se.allstar.played){
      flash("⭐ 明星賽已經結束");
      render();
      return;
    }
    let guard=0;
    while(se.day < mid && guard++<30){
      startMatch();   // 每輪開新比賽（舊 match 已結算，不可重用）
      if(!S.match) break;
      if(!S.match.over){ autoGame(S.match); }
      processGameEnd(S.match);
      S.match=null;
      if(S.screen!=="hub" && S.screen!=="game") break;
    }
    S.match=null;S.screen="hub";
    render();
  },
  simToEnd(){
    const se=S.season;
    if(!se)return;
    let guard=0;
    while(se.day < (se.schedule||[]).length && guard++<30){
      startMatch();   // 每輪開新比賽（舊 match 已結算，不可重用）
      if(!S.match) break;
      if(!S.match.over){ autoGame(S.match); }
      processGameEnd(S.match);
      S.match=null;
      if(S.screen!=="hub" && S.screen!=="game") break;
    }
    S.match=null;S.screen="hub";
    render();
  },
  help(){S.screen="help";render();},
  backHub(){
    // 選秀未完成也不擋路：總部（例行賽／季後賽面板）本來就有「選秀進行中」提醒＋前往選秀鈕，
    // 且選秀進度會保留（開新季也會帶過去），直接回去即可，避免季後賽結束後哪裡都回不去。
    S.confirm=null;
    S.screen="hub";S.match=null;render();
  },
  roster(){S.screen="roster";render();},
  abilities(){S.screen="abilities";render();},
  abilTeam(id){S.abilTeam=id;render();},
  abilSortBat(k){S.abilBatSort=k;render();},
  abilSortPit(k){S.abilPitSort=k;render();},
  abilPos(p){S.abilPos=p;render();},
  abilRole(r){S.abilRole=r;render();},
  player(id){S.selPlayer=id;S.screen="player";render();},
  retiree(i){S.selRetire=+i;S.screen="retiree";render();},
  backFromRetiree(){S.screen="history";S.histTab="retire";render();},
  schedule(){S.screen="schedule";render();},
  standings(){S.screen="standings";render();},
  leaders(){S.screen="leaders";render();},
  leadCat(c){S.leadCat=c;render();},
  saveNow(){saveGame();flash("已存檔");render();},
  play(){startMatch();if(S.match)render();},
  simPlay(){
    startMatch();
    if(!S.match)return;
    submit(()=>{autoGame(S.match);});
  },
  backToHub(){S.screen="hub";S.match=null;render();},
  nextGame(){
    const se=S.season;
    if(se && se.allstar && !se.allstar.played && GK.asReady()){
      S.match=null;
      const a=simAllstar();
      se.news=se.news||[];
      se.news.push({day:se.day+1,text:`⭐ 明星賽週已到！已自動進行明星賽（MVP：${a.mvp?.name||"－"}）`,special:true});
      if(se.news.length>15)se.news.shift();
      if(!S.flash) S.flash="⭐ 明星賽週到了！自動進行明星賽";
      S.screen="allstar";
      render();
      return;
    }
    if(se){
      const total=(se.schedule||[]).length;
      // 季後賽已建立：優先處理季後賽流程
      if(se.playoff){
        const pg=playoffNextGame();
        if(pg){
          startMatch();
          if(S.match)render();
          else S.screen="hub";
        }else{
          if(!S.flash){
            const po=se.playoff, me=se.playerTeam;
            if(po.stage==="done")S.flash=`🏆 季後賽結束：總冠軍 ${getTeam(po.champion).name}`;
            else S.flash="季後賽進行中：你的球隊本輪無賽事，請回總部模擬剩餘季後賽。";
          }
          S.screen="hub"; render();
        }
        return;
      }
      if(se.day >= total){
        ensurePlayoff();
        // 建立季後賽後，若玩家還有下一場季後賽要打，直接開始
        if(se.playoff){
          const pg=playoffNextGame();
          if(pg){
            startMatch();
            if(S.match)render();
            else S.screen="hub";
            return;
          }
        }
        render();
        return;
      }
      if(se.day === total-1){
        if(!S.flash) S.flash=`⚠️ 下一場就是最後一日（第 ${total} 日）例行賽！`;
      }
    }
    S.match=null;
    startMatch();
    if(S.match)render();
    else{S.screen="hub";render();}
  },
  simPlayoff(){playoffSimAll();render();},
  autoInning(){const m=S.match;if(!m||m.over)return;submit(()=>{autoHalf(m);if(!m.over&&m.outs>=3)endHalf(m);playSnd(m);});},
  simGame(){const m=S.match;if(!m||m.over)return;submit(()=>{autoGame(m);if(m.walkoff)setTimeout(()=>SFX.cheer(),250);});},
  bat(t){const m=S.match;if(!m||m.over||!playerIsOffense(m))return;submit(()=>{resolveTurn(t,aiDefense(m));playSnd(m);});},
  pitch(t){const m=S.match;if(!m||m.over||playerIsOffense(m))return;submit(()=>{resolveTurn(aiOffense(m),t);playSnd(m);});},
  steal(){const m=S.match;if(!m||m.over||!playerIsOffense(m))return;submit(()=>{doSteal(m);});},
  pinchhit(){const m=S.match;if(!m||m.over||!playerIsOffense(m))return;submit(()=>{doPinchHit(m);});},
  changePit(pid){const m=S.match;if(!m||m.over||playerIsOffense(m))return;submit(()=>{doChangePitcher(m,pid);});},
  records(){S.screen="records";render();},
  history(){S.screen="history";S.histTab=S.histTab||"games";render();},
  histTab(t){S.histTab=t;render();},
  histCat(c){S.histCat=c;render();},
  recTab(c){S.recTab=c;render();},
  exportCsv(){downloadCSV();render();},
  league(){S.screen="league";render();},
  gameDetail(a){
    if(!a)return;
    const from=(S.screen==="schedule"||S.screen==="player")?S.screen:"league";
    if(a.charAt(0)==="p")S.gameDetail={po:+a.slice(1),from};
    else{const p=a.split(",");S.gameDetail={day:+p[0],i:+p[1],from};}
    S.screen="gameDetail";render();
  },
  gameDetailBack(){S.screen=(S.gameDetail&&S.gameDetail.from)||"league";render();},
  awards(){S.awardsStep=0;S.screen="awards";render();},
  awardStep(){S.awardsStep=Math.min(AWARD_MAX,(S.awardsStep||0)+1);if(S.awardsStep>=AWARD_MAX)SFX.champ();else SFX.wink();render();},
  awardAll(){S.awardsStep=AWARD_MAX;SFX.champ();render();},
  awardsReplay(){S.awardsStep=0;render();},
  draft(){S.screen="draft";render();},
  draftNext(){const d=S.season.draft;if(d&&d.idx<d.picks.length&&d.picks[d.idx].teamId!==S.season.playerTeam){
    const pick=d.picks[d.idx];const cs=draftCandidates(pick);
    applyDraftRookie(pick,cs[draftBest(cs)]);d.idx++;d.cands=null;}
    draftJudge();render();},
  draftPick(ci){const d=S.season.draft;if(d&&d.idx<d.picks.length&&d.picks[d.idx].teamId===S.season.playerTeam){
    const pick=d.picks[d.idx];const cs=draftCandidates(pick);
    const ii=(ci!=null&&cs[+ci])?+ci:draftBest(cs);
    applyDraftRookie(pick,cs[ii]);d.idx++;d.cands=null;SFX.wink();}
    draftJudge();render();},
  draftAuto(){const d=S.season.draft;if(!d)return;
    while(d.idx<d.picks.length){const pick=d.picks[d.idx];const cs=draftCandidates(pick);
      applyDraftRookie(pick,cs[draftBest(cs)]);d.idx++;}
    draftJudge();render();},
  confirmLeaveDraft(){S.confirm={act:"forceLeaveDraft",arg:null,msg:"選秀尚未完成，確定要離開？未完成的選秀將自動由系統代選最強新人。"};render();},
  forceLeaveDraft(){const d=S.season.draft;if(d){ACT.draftAuto();}S.confirm=null;render();}
};
let flashTimer=null;
function flash(msg){S.flash=msg;clearTimeout(flashTimer);}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");
  if(!el||busy)return;
  const a=el.dataset.act,arg=el.dataset.arg;
  if(ACT[a])ACT[a](arg);
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el&&el.id==="importFile"&&el.files&&el.files[0])importSaveFile(el.files[0]);
});

};

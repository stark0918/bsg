<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>球團物語 ～ CLUB STORY</title>
<style>
:root{
  --paper:#0e1a2b; --paper2:#101d2f; --ink:#e2eefb;
  --dark:#0b1523; --dark2:#080e18;
  --accent:#d7568f; --gold:#e6c877; --led:#8fd6ea; --ledbg:#0a121e;
  --line:#24405f; --muted:#93a9c4;
  --neon:#57c8e6; --neon2:#e0559a; --neon3:#4fd39a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1000px 620px at 50% -10%, #15283f 0%, #0a1322 55%, #070b14 100%);
  color:var(--ink);
  font-family:"Microsoft JhengHei","PingFang TC","Heiti TC","Segoe UI",system-ui,sans-serif;
  font-size:15px; line-height:1.65; min-height:100vh;
  padding:14px 10px 60px; position:relative;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(87,200,230,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(87,200,230,.035) 1px,transparent 1px);
  background-size:44px 44px;
  -webkit-mask-image:radial-gradient(circle at 50% 16%,#000 0%,transparent 76%);
          mask-image:radial-gradient(circle at 50% 16%,#000 0%,transparent 76%);
}
.wrap{max-width:880px;margin:0 auto;position:relative;z-index:2}
a{color:#7fd3ec}
.logo{
  text-align:center; color:#eef6ff; letter-spacing:.14em;
  font-weight:900; font-size:30px; margin:6px 0 2px;
  text-shadow:0 2px 0 #000, 0 0 10px rgba(87,200,230,.22);
}
.logo small{display:block;font-size:11px;letter-spacing:.42em;color:#8fb9d0;font-weight:400;margin-top:4px}

.panel{
  position:relative;
  background:#0e1a2b;
  border:1px solid var(--line); border-radius:6px;
  box-shadow:0 1px 0 rgba(0,0,0,.45);
  padding:14px 16px; margin-top:12px;
}
.panel::before,.panel::after{content:"";position:absolute;width:11px;height:11px;border:1.5px solid rgba(87,200,230,.45);pointer-events:none}
.panel::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-top-left-radius:6px}
.panel::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-bottom-right-radius:6px}
.panel h2{
  margin:0 0 10px; font-size:17px; color:#e9f3fd;
  background:linear-gradient(90deg,rgba(87,200,230,.10),rgba(87,200,230,0) 72%);
  padding:6px 10px; border-left:3px solid var(--neon); border-radius:0 4px 4px 0; letter-spacing:.06em;
}
.panel h3{margin:16px 0 6px;font-size:15px;color:#9fd6ea;border-bottom:1px solid var(--line);padding-bottom:4px;letter-spacing:.03em}
.muted{color:var(--muted)}
.center{text-align:center}
.hr{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:10px 0;border:0}

/* buttons: clean HUD */
.btn{
  font-family:inherit;font-size:14px;cursor:pointer;color:#d8ecff;
  background:#152436; border:1px solid #3d6f92; border-radius:5px;
  padding:7px 12px; margin:3px 3px; font-weight:700; letter-spacing:.02em;
  box-shadow:0 1px 2px rgba(0,0,0,.45); transition:background .15s, border-color .15s, transform .05s;
}
.btn:hover{background:#1d3350;border-color:var(--neon)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:default}
.btn.red{color:#f6c3d9;border-color:#9c4a6e}
.btn.red:hover{background:#3a1f2e;border-color:#e0559a}
.btn.green{color:#b6ebd0;border-color:#3f8f6b}
.btn.green:hover{background:#17352a;border-color:#4fd39a}
.btn.gold{color:#f4e2ac;border-color:#9a8440}
.btn.gold:hover{background:#332c17;border-color:#e6c877}
.btn.blue{color:#c8ddf6;border-color:#4a6f9e}
.btn.blue:hover{background:#1b2c44;border-color:#7fb0e6}
.btn.sm{font-size:12px;padding:4px 8px}
.btn.blk{display:block;width:100%;text-align:center}

/* header strip */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;color:#a9c2da;font-size:12px;letter-spacing:.02em}
.topbar b{color:#e9f3fd}

/* scoreboard */
.scoreboard{
  background:var(--ledbg); border:1px solid var(--line); border-radius:6px; padding:8px; overflow:auto;
}
.scoreboard table{border-collapse:collapse;width:100%;font-family:"Consolas","Courier New",monospace}
.scoreboard th,.scoreboard td{border:1px solid #1e3550;padding:4px 6px;text-align:center;color:#cfe3f5;font-size:14px}
.scoreboard th{color:#8fb0cc;font-weight:400;font-size:12px;letter-spacing:.05em}
.scoreboard td.team{text-align:left;white-space:nowrap;color:#eef6ff;font-family:inherit;font-weight:700}
.scoreboard td.rhe{color:var(--gold);font-weight:700}
.scoreboard tr.player td.team{color:#8fe0b8;font-weight:700}

/* field */
.fieldwrap{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch}
.field-svg{width:210px;max-width:48vw;border:1px solid var(--line);border-radius:6px;background:#0d1a2a}
.cond{flex:1;min-width:200px}
.countbox{background:#0b1523;border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:8px}
.countrow{display:flex;gap:14px;align-items:center;font-family:"Consolas",monospace;color:#bcd8ee;font-size:12px}
.countrow .lbl{width:26px;color:var(--muted)}
.leds{display:flex;gap:5px}
.led{width:15px;height:15px;border-radius:50%;background:#0e1c2c;border:1px solid var(--line)}
.led.on.b{background:#4fd39a;border-color:#7fe8bb}
.led.on.s{background:#e6c877;border-color:#f4e2ac}
.led.on.o{background:#e06782;border-color:#f2a2b4}
.matchup{background:#101d2f;border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.matchup .who{font-weight:700;color:#eef6ff;font-size:15px}
.matchup .pos{display:inline-block;background:#16283d;color:#9fd6ea;border:1px solid var(--line);font-size:11px;padding:1px 6px;border-radius:4px;margin-left:6px}
.rrow{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:12px}
.rrow .rlab{width:44px;color:var(--muted)}
.rbar{flex:1;height:9px;background:#0c1826;border:1px solid #1e3550;border-radius:4px;overflow:hidden;min-width:60px}
.rbar i{display:block;height:100%}
.rrow b{width:26px;text-align:right;font-family:Consolas,monospace;color:#cfe3f5}

/* log */
.log{
  background:#0b141f; color:#c7d8ea;
  border:1px solid var(--line); border-radius:6px;
  padding:10px 12px; height:230px; overflow:auto; font-size:13.5px; line-height:1.7;
  font-family:"Consolas","Microsoft JhengHei","MingLiU",monospace;
}
.log p{margin:2px 0;padding:2px 4px;border-radius:3px}
.log p.inn{color:var(--gold);font-weight:700;border-top:1px solid var(--line);margin-top:6px}
.log p.run{color:#f0a0bd;font-weight:700}
.log p.hit{color:#93e6b8}
.log p.out{color:#9fb4c8}
.log p.sys{color:#8fb0cc;font-style:italic}
.log p.big{color:#fff;background:#7a2340;font-weight:700;border-radius:4px}

/* actions */
.actions{margin-top:10px}
.actgroup{margin:6px 0}
.actgroup .gtitle{display:inline-block;font-size:12px;color:#0a1726;background:#8fd6ea;padding:2px 9px;border-radius:4px;margin-bottom:3px;font-weight:700;letter-spacing:.03em}
.turn{font-weight:700;color:#f0a0bd}

/* tables */
table.grid{border-collapse:collapse;width:100%;font-size:13px;background:#0e1a2b}
table.grid th,table.grid td{border:1px solid var(--line);padding:4px 6px;text-align:center;color:var(--ink)}
table.grid th{background:#16283d;color:#a6d4e8;letter-spacing:.03em;font-weight:700}
table.grid tr.me td{background:rgba(79,211,154,.12);font-weight:700}
table.grid.boxscore{table-layout:fixed}
table.grid.boxscore th{white-space:nowrap;font-size:12px;padding:4px 3px}
table.grid.boxscore td{padding:4px 3px;overflow:hidden;text-overflow:ellipsis}
table.grid.boxscore td.name{text-align:left;width:30%}
table.grid td.name{text-align:left;white-space:nowrap}
table.grid td.num{font-family:Consolas,monospace;color:#cfe3f5}
table.grid tr:hover td{background:rgba(87,200,230,.06)}
.rank1{color:var(--gold);font-weight:900}

/* 打線表 */
table.lineup{font-size:12.5px}
table.lineup th,table.lineup td{padding:2px 5px}
table.lineup tr.onbase td{background:rgba(79,211,154,.13)}
table.lineup tr.batting td{background:rgba(87,200,230,.16);color:#eef6ff;font-weight:700}
table.lineup tr.batting td:first-child{box-shadow:inset 3px 0 0 var(--neon)}

/* 聯盟日報／賽事卡片 */
button.gline{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;margin:4px 0;border:1px solid var(--line);border-radius:5px;background:#0d1017;color:var(--ink);font-size:13px;text-align:left;cursor:pointer}
button.gline:hover{border-color:var(--neon);background:#111b28}
button.gline.me{box-shadow:inset 3px 0 0 var(--neon)}
.gline .sc{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;color:var(--gold)}
.gline .gmeta{flex:1;color:var(--muted);font-size:12px}
.gline .gmore{color:var(--neon);font-size:12px;white-space:nowrap}
.dlbl{color:var(--neon);font-weight:700;font-size:12.5px}
tr.clickable td{cursor:pointer}
tr.clickable:hover td{background:#101a26}

/* 紀錄殿堂／分頁／獎牌 */
.hallhead{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:linear-gradient(180deg,#16211a,#0d1017);margin:0 0 10px}
.tabbar{display:flex;gap:6px;margin:10px 0}
button.tab{flex:1;padding:7px 4px;border:1px solid var(--line);background:#0d1017;color:var(--muted);border-radius:5px;cursor:pointer;font-size:12.5px}
button.tab:hover{border-color:var(--neon)}
button.tab.on{border-color:var(--gold);color:var(--gold);background:#1a1a12;font-weight:700}
.medal{display:inline-block;min-width:16px;padding:0 4px;border-radius:3px;font-size:11px;font-weight:800;text-align:center}
.medal.g1{background:#3a3320;color:#f2c94c}
.medal.g2{background:#2a3238;color:#bfd3de}
.medal.g3{background:#33283a;color:#d3a7e8}

/* 頒獎典禮演出 */
.party{border-color:var(--gold);background:linear-gradient(180deg,#241d10,#0d1017)}
.ceremony{border-left:3px solid var(--gold);animation:cerin .45s ease-out}
@keyframes cerin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.champbanner{font-size:22px;font-weight:800;letter-spacing:.12em;padding:10px 0;color:var(--gold);text-shadow:0 0 12px rgba(230,200,119,.35)}
.awardlist{margin:4px 0 0;padding-left:18px}
.awardlist li{margin:2px 0;color:#f0e0b0}

/* 刪除確認 */
.confirmbox{border:1px solid #9c4a6e;background:#21141c;border-radius:6px;padding:10px;margin-top:8px}
.confirmbox p{margin:0 0 8px;font-size:13px;line-height:1.5;color:#f6c3d9;text-align:left}
/* 存檔管理 */
.slotcard{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:6px 0;background:#0d1520}
.slotcard.empty{opacity:.6}
.slotinfo{min-width:0}
.slotinfo .nm{font-weight:700;color:var(--ink,#e8e2d0)}
.slotinfo .meta{font-size:11.5px;color:var(--muted,#8a93a5);margin-top:2px}
.slotbtns{display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap}

.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;color:#cfe9ff;background:#16283d;border:1px solid var(--line);margin-left:4px}
.pill.on{background:rgba(79,211,154,.15);color:#a9e6c6;border-color:#3f8f6b}
.pill.off{background:rgba(224,85,154,.15);color:#f2b9d2;border-color:#9c4a6e}

.teamcard{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:6px 0;background:#101d2f;
}
.teamcard .nm{font-weight:900;font-size:16px;color:#eef6ff}
.teamcard .meta{font-size:11px;color:var(--muted)}
.swatch{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid #0007;vertical-align:-2px;margin-right:6px}
.plink{cursor:pointer;color:#7fd3ec;text-decoration:none;border-bottom:1px dotted rgba(127,211,236,.5)}
.plink:hover{color:#fff}
.abilnote{font-size:12px;color:#bcd8ee;background:#0f1c2c;border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:8px 0}
.news{background:#0b141f;color:#c7d8ea;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12px}
.news p{margin:2px 0}
.news p:before{content:"▸ ";color:var(--gold)}
.paper{background:#0b141f;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:4px;padding:6px 10px;margin:6px 0}
.paper .pday{font-size:11px;color:var(--muted);letter-spacing:.08em}
.paper ul{margin:2px 0 0;padding-left:18px}
.paper li{font-size:12.5px;color:#c7d8ea;margin:2px 0}
.paper li.top{color:#ffe6a8;font-weight:700}
/* 打線編輯 */
.lulist{display:flex;flex-direction:column;gap:4px;margin:4px 0}
.lurow{display:flex;align-items:center;gap:8px;background:#0d1520;border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.lurow.sel{border-color:var(--gold);background:#1b2233}
.luord{width:20px;height:20px;flex:0 0 20px;text-align:center;line-height:20px;background:#16283d;border-radius:50%;font-weight:700;font-size:12px}
.luname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lups{font-size:12px;color:var(--muted);width:34px;text-align:center}
.lubtns{display:flex;gap:3px}
.lumain{flex:1;min-width:0}
.lustats{font-size:11px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.lustats2{font-size:10px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.lustats b,.lustats2 b{color:#e8e2d4;font-weight:700}
.lustavg{color:#ffd777}
.lusthr{color:#ff7b7b}.lustrbi{color:#7bdfff}.lustobp{color:#ffd777}
.daysep td{background:#16283d;color:#a6d4e8;font-weight:700;letter-spacing:.1em;font-size:12px}
.daysep td:before{content:"▸ "}
.grade{display:inline-block;font-weight:900;font-family:Consolas,monospace;font-size:12px;padding:1px 7px;border-radius:4px;color:#fff}
.g-S{background:#b8457a}.g-A{background:#c07a2a}.g-B{background:#2b8f63}.g-C{background:#3f6383}.g-D{background:#5f7286}

.overlay{position:fixed;inset:0;background:rgba(4,8,14,.82);display:none;align-items:center;justify-content:center;z-index:50}
.overlay.on{display:flex}
.overlay div{background:var(--dark);color:#dcecfa;border:1px solid var(--line);padding:16px 28px;font-weight:700;letter-spacing:.18em;border-radius:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#101d2f;color:#a9e6c6;border:1px solid #3f8f6b;padding:8px 20px;border-radius:20px;font-weight:700;opacity:0;transition:opacity .25s, transform .25s;z-index:60;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.footer{color:#5f7ea0;font-size:11px;text-align:center;margin-top:14px;font-family:Consolas,monospace;word-break:break-all}
.help dt{font-weight:700;color:#9fd6ea;margin-top:8px}
.help dd{margin:2px 0 0 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.two{grid-template-columns:1fr}.logo{font-size:22px}}
.bignum{font-family:"Consolas",monospace;font-weight:900;font-size:20px;color:#cfe3f5}

/* 熱血演出 */
.playball{
  position:relative;text-align:center;font-size:26px;font-weight:900;color:#eef6ff;letter-spacing:.3em;
  background:#123452; border:1px solid var(--neon); border-radius:6px; padding:8px; margin:10px 0;
  animation:pb 1.3s ease-out;
}
@keyframes pb{0%{transform:scale(2.1);opacity:0}35%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:0}}
.splash{pointer-events:none;text-align:center;position:relative;font-size:24px;font-weight:900;margin:6px 0 0;animation:sp .95s ease-out;letter-spacing:.16em}
.splash.hr{color:#fff;background:#a12a58;border-radius:6px}
.splash.k{color:#eaf6ff;background:#1c5f96;border-radius:6px}
.splash.hit{color:#06231a;background:#4fd39a;border-radius:6px}
.splash.bb{color:#06202b;background:#7fd6ea;border-radius:6px}
.splash.out{color:#9fb4c8}
@keyframes sp{0%{transform:scale(1.6);opacity:0}30%{transform:scale(1.03);opacity:1}75%{opacity:1}100%{opacity:.15}}
.speed{color:var(--gold);font-family:Consolas,monospace;font-weight:700}
.confetti{position:relative;height:0;overflow:visible}
.confetti i{position:absolute;top:-14px;width:9px;height:15px;opacity:.95;border-radius:2px;animation:cf 2.6s linear infinite}
@keyframes cf{from{transform:translateY(-8px) rotate(0deg);opacity:.95}to{transform:translateY(80px) rotate(340deg);opacity:0}}

/* 選秀 */
.cand{background:#101d2f}
.cand-top{display:flex;align-items:center;gap:9px}
.cand .bars{margin:6px 0}
.cand .btn{margin-top:6px}

/* 明星賽卡片 */
.cards{display:flex;flex-direction:column;gap:10px}
.card{background:#0d1520;border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.card-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.card-body{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.roster h4{font-size:12px;color:var(--muted);margin:0 0 4px;padding-bottom:2px;border-bottom:1px solid var(--line)}
.prizegrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-bottom:8px}
@media(max-width:620px){
  .card-body{grid-template-columns:1fr}
  .prizegrid{grid-template-columns:1fr}
}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.player-tag{font-size:11px;background:#152436;border:1px solid var(--line);border-radius:3px;padding:2px 6px;color:#cfe3f5}
@media(max-width:620px){
  .card-body{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">球團物語<small>CLUB STORY</small></div>
  <div id="app"></div>

</div>
<div class="overlay" id="ov"><div>送信中…</div></div>
<div class="toast" id="toast"></div>

function nrm(rnd,mean,sd){return mean+((rnd()+rnd()+rnd()+rnd()-2)/2)*sd;}
function weightedPick(pairs){let t=0;for(const p of pairs)t+=p[1];let r=Math.random()*t;for(const p of pairs){r-=p[1];if(r<=0)return p[0];}return pairs[pairs.length-1][0];}
function poisson(l){let L=Math.exp(-l),k=0,p=1;do{k++;p*=Math.random();}while(p>L);return k-1;}
function fmtAvg(v){if(!v||isNaN(v))return ".000";return (v>=1?"1.000":v.toFixed(3).replace(/^0/,""));}
function fmtIP(outs){return Math.floor(outs/3)+"."+(outs%3);}
function fmtERA(er,outs){if(!outs)return"-.--";return (er*27/outs).toFixed(2);}

/* ---------- 熱血音效（WebAudio 合成，不需外部檔） ---------- */
let _snd={ctx:null,master:null};
function sndInit(){
  if(_snd.ctx)return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    _snd.ctx=new AC();
    if(_snd.ctx.state==="suspended")_snd.ctx.resume();
    _snd.master=_snd.ctx.createGain();
    _snd.master.gain.value=0.32;
    _snd.master.connect(_snd.ctx.destination);
  }catch(e){}
}
function _tone(freq,dur,type,vol,slideTo,delay){
  if(!_snd.ctx)return;
  const t=_snd.ctx.currentTime+(delay||0);
  const o=_snd.ctx.createOscillator(),g=_snd.ctx.createGain();
  o.type=type||"square";o.frequency.setValueAtTime(freq,t);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(vol||0.2,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(_snd.master);
  o.start(t);o.stop(t+dur+0.02);
}
function _noise(dur,vol,delay,freq,type){
  if(!_snd.ctx)return;
  const t=_snd.ctx.currentTime+(delay||0);
  const len=Math.max(1,Math.floor(_snd.ctx.sampleRate*dur));
  const buf=_snd.ctx.createBuffer(1,len,_snd.ctx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1);
  const src=_snd.ctx.createBufferSource();src.buffer=buf;
  const f=_snd.ctx.createBiquadFilter();
  f.type=type||"lowpass";f.frequency.value=freq||800;
  const g=_snd.ctx.createGain();
  g.gain.setValueAtTime(vol||0.3,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  src.connect(f);f.connect(g);g.connect(_snd.master);
  src.start(t);src.stop(t+dur+0.02);
}
const SFX={
  crack(){sndInit();_noise(0.12,0.5,0,2600,"highpass");_tone(900,0.06,"square",0.25);},
  hit(){sndInit();_noise(0.07,0.4,0,3000,"highpass");_tone(1800,0.05,"triangle",0.2,700);},

  charge(){sndInit();[392,523,659,784].forEach((f,i)=>_tone(f,0.22,"square",0.16,null,i*0.12));_noise(1.8,0.3,0.5,1000,"bandpass");},
  champ(){sndInit();[523,659,784,1046].forEach((f,i)=>_tone(f,0.3,"square",0.2,null,i*0.14));_tone(1318,0.7,"triangle",0.2,1046,0.56);_noise(2.2,0.4,0.7,1400,"bandpass");}

/* 依上一打席結果播放音效（僅互動回合） */
function playSnd(m){
  if(!m||!m.lastKind)return;
  const k=m.lastKind;
  if(k==="HR")SFX.hr();
  else if(k==="3B"||k==="2B")SFX.hit();
  else if(k==="1B"||k==="BUNTHIT")SFX.crack();
  else if(k==="K")SFX.k();
  else if(k==="BB"||k==="HBP")SFX.wink();
  else if(k==="OUT"||k==="SAC"||k==="BUNTOUT")SFX.out();
  if(m.walkoff)setTimeout(()=>SFX.cheer(),220);
}

/* 用舊名單重現一支球隊原本的名字順序（先 13 名野手、再 6 名投手，共用同一組不重複記錄） */
function legacyRosterNames(teamId){
  const rnd=mulberry32(hashStr("gk-name-v1-"+teamId)),used=new Set(),out=[];

    for(let i=0;i<40;i++){const n=rpick(rnd,SU_OLD)+rpick(rnd,GI_OLD);if(!used.has(n)){used.add(n);return n;}}

   綁定本身會寫進 CAREER.ov，若每支球隊都重新判斷，後面的隊伍會被自己剛寫入的紀錄誤判成舊存檔。 */
function bindRosterNames(team){
  const ov=CAREER.ov=CAREER.ov||{};
  const players=team.batters.concat(team.pitchers);
  // 判斷「這是擴充名單以前的舊存檔嗎」整個存檔只做一次，結果寫進 CAREER.namePool：
  //   0 = 尚未決定、1 = 舊存檔（用舊名單重現原名）、2 = 全新玩家（直接用現行名單）
  // 注意綁定本身會寫進 CAREER.ov，若每支球隊都重新判斷，後面的隊伍會被自己剛寫入的紀錄誤判。
  if(!CAREER.namePool){
    const old=((CAREER.seasons||0)>0)||((CAREER.history||[]).length>0)||Object.keys(ov).length>0||
              SAVEKEY_HINT.some(k=>{try{return !!localStorage.getItem(k);}catch(e){return false;}});
    CAREER.namePool=old?1:NAMEPOOL_V;
  }
  const legacy=CAREER.namePool===1?legacyRosterNames(team.id):null;
  players.forEach((p,i)=>{
    const o=ov[p.id]||(ov[p.id]={});
    if(o.name==null)o.name=(legacy&&legacy[i])||p.name;
  });
}

function mkName(rnd,used){  for(let i=0;i<40;i++){
    const n=rpick(rnd,SU)+rpick(rnd,GI);
    if(!used.has(n)){used.add(n);return n;}
  }
  return rpick(rnd,SU)+rpick(rnd,GI);
}
function genRoster(team){
  const rnd=mulberry32(hashStr("gk-roster-v3-"+team.id));
  const nrnd=mulberry32(hashStr("gk-name-v1-"+team.id));
  const arnd=mulberry32(hashStr("gk-arch-v1-"+team.id));
  const used=new Set();
  const pos=["C","1B","2B","3B","SS","LF","CF","RF","DH"];
  const benchPos=["C","SS","CF","1B"];   // 板凳球員守位（僅供顯示／換人對照，不影響能力加成）
  const arch=["contact","power","speed","eye","balanced"];
  const batters=[];
  for(let i=0;i<13;i++){
    const p=i<9?pos[i]:null;
    const bp=i>=9?benchPos[i-9]:null;
    const a=rpick(arnd,arch);
    let meet=nrm(rnd,52,10),power=nrm(rnd,50,13),eye=nrm(rnd,50,11),speed=nrm(rnd,52,12),def=nrm(rnd,52,11);
    if(a==="contact"){meet+=9;eye+=3;power-=4;}
    if(a==="power"){power+=14;meet-=5;speed-=6;}
    if(a==="speed"){speed+=16;def+=4;power-=7;meet+=1;}
    if(a==="eye"){eye+=14;meet+=2;power+=2;speed-=6;}
    if(p==="C"){def+=12;speed-=8;meet+=2;}
    if(p==="1B"){power+=8;def-=3;speed-=4;}
    if(p==="2B"){def+=8;speed+=4;power-=6;}
    if(p==="3B"){power+=6;def+=3;}
    if(p==="SS"){def+=12;speed+=6;power-=4;}
    if(p==="CF"){def+=8;speed+=8;power-=2;}
    if(p==="LF"||p==="RF"){power+=3;def-=2;}
    const s=team.str;
    batters.push({
      id:team.id+"b"+i, name:mkName(nrnd,used),
      pos:p||(bp||("B"+i)), posLabel:p?POS_ZH[p]:(bp?POS_ZH[bp]:"替補"), bench:i>=9,
      meet:Math.round(clamp(meet+s,25,96)), power:Math.round(clamp(power+s,20,96)),
      eye:Math.round(clamp(eye+s,25,96)), speed:Math.round(clamp(speed+s,20,96)),
      defense:Math.round(clamp(def+s,20,96))
    });
  }
  const pitchers=[];
  for(let i=0;i<6;i++){
    const sp=i<3;
    let velocity=nrm(rnd,sp?62:71,8),control=nrm(rnd,sp?64:60,9),breaking=nrm(rnd,sp?62:68,9),stamina=nrm(rnd,sp?74:42,sp?7:8);
    pitchers.push({
      id:team.id+"p"+i, name:mkName(nrnd,used), role:sp?"先發":"後援", starter:sp,
      velocity:Math.round(clamp(velocity+team.str,25,97)),
      control:Math.round(clamp(control+team.str,25,97)),
      breaking:Math.round(clamp(breaking+team.str,25,97)),
      stamina:Math.round(clamp(stamina,25,95))
    });
  }
  return {batters,pitchers};
}
const teamCache={};
function getTeam(id){
  if(!teamCache[id]){
    const def=TEAM_DEFS.find(t=>t.id===id);
    const team=Object.assign({},def,genRoster(def));
    bindRosterNames(team);   // 首次見到球員就把名字寫進 CAREER.ov，名單之後再改也不換名
    team.batters.concat(team.pitchers).forEach(applyOv);
    teamCache[id]=team;
  }
  return teamCache[id];
}

const OFF_MODS={
  normal:{k:1,hr:1,xbh:1,hit:1,bb:1},
  power:{k:1.35,hr:1.85,xbh:1.35,hit:0.90,bb:0.90},
  take:{k:1.22,hr:0.80,xbh:0.85,hit:0.88,bb:1.55},
  hitrun:{k:1.15,hr:1.05,xbh:1.05,hit:1.06,bb:0.85}
};
const DEF_MODS={
  power:{k:1.24,hr:1.25,hit:0.90,bb:1.28,hbp:1.15,fat:1.7},
  control:{k:0.85,hr:1.05,hit:1.10,bb:0.55,hbp:0.9,fat:1.0},
  corner:{k:1.05,hr:0.90,hit:0.90,bb:1.12,hbp:1.0,fat:1.2,ground:1.3},
  chase:{k:1.18,hr:0.82,hit:1.00,bb:1.30,hbp:1.0,fat:1.15}
};
const OFF_NAME={normal:"正常揮擊",power:"強力揮擊",take:"耐心等球",bunt:"犧牲短打",hitrun:"打帶跑"};
const DEF_NAME={power:"全力投球",control:"控球至上",corner:"邊邊角角",chase:"引誘球",ibb:"故意四壞"};

function pitcherEffective(p,pitches){
  const thr=42+p.stamina*0.62;
  let f=1;
  if(pitches>thr) f=clamp(1-(pitches-thr)*0.0032,0.70,1);
  return {velocity:p.velocity*f,control:p.control*(0.86+0.14*f),breaking:p.breaking*f,fatigue:f};
}
const m_=(v,ref,k)=>Math.exp((v-ref)*k);
const inv=(v,ref,k)=>1/m_(v,ref,k);
function paOutcome(batter,eff,offT,defT){
  const om=OFF_MODS[offT]||OFF_MODS.normal, dm=DEF_MODS[defT]||DEF_MODS.control;
  const kAb=eff.velocity*0.45+eff.breaking*0.55;
  const supp=eff.breaking*0.6+eff.velocity*0.4;
  const ctl=eff.control;
  let pK =0.178*m_(kAb,60,1/60)*inv(batter.meet,60,1/55)*om.k*dm.k;
  let pBB=0.090*m_(batter.eye,60,1/70)*inv(ctl,60,1/60)*om.bb*dm.bb;
  let pHBP=0.010*(dm.hbp||1);
  let pHR=0.032*m_(batter.power,60,1/55)*inv(supp,60,1/55)*om.hr*dm.hr;
  let p3B=0.007*m_(batter.speed,60,1/80)*om.xbh*dm.hit;
  let p2B=0.058*m_(batter.power,58,1/70)*inv(supp,60,1/64)*om.xbh*dm.hit;
  let p1B=0.172*m_(batter.meet,60,1/70)*inv(supp,60,1/60)*om.hit*dm.hit;
  let sum=pK+pBB+pHBP+pHR+p3B+p2B+p1B;
  if(sum>0.985){const s=0.985/sum;pK*=s;pBB*=s;pHBP*=s;pHR*=s;p3B*=s;p2B*=s;p1B*=s;sum=0.985;}
  const pOut=1-sum;
  return weightedPick([["K",pK],["BB",pBB],["HBP",pHBP],["HR",pHR],["3B",p3B],["2B",p2B],["1B",p1B],["OUT",pOut]]);
}

/* ---------- 壘上推進 ---------- */
function hitAdvance(bases,batter,kind,hitrun){
  let runs=0;const nb=[null,null,null];const scored=[];
  const r1=bases[0],r2=bases[1],r3=bases[2];
  const sp=x=>x?x.speed:0;
  if(kind==="HR"){
    if(r1){runs++;scored.push(r1);}if(r2){runs++;scored.push(r2);}if(r3){runs++;scored.push(r3);}
    runs++;scored.push(batter);
    return{runs,bases:nb,scored};
  }
  if(kind==="3B"){
    if(r1){runs++;scored.push(r1);}if(r2){runs++;scored.push(r2);}if(r3){runs++;scored.push(r3);}
    nb[2]=batter;return{runs,bases:nb,scored};
  }
  if(kind==="2B"){
    if(r3){runs++;scored.push(r3);}
    if(r2){runs++;scored.push(r2);}
    if(r1){if(hitrun||sp(r1)>=62||chance(0.42)){runs++;scored.push(r1);}else nb[2]=r1;}
    nb[1]=batter;return{runs,bases:nb,scored};
  }
  // 一壘安打
  if(r3){runs++;scored.push(r3);}
  if(r2){if(hitrun||sp(r2)>=58||chance(0.62)){runs++;scored.push(r2);}else nb[2]=r2;}
  if(r1){if(hitrun){if(!nb[2])nb[2]=r1;}else nb[1]=r1;}
  nb[0]=batter;return{runs,bases:nb,scored};
}
function advanceOnWalk(bases,batter){
  const nb=[bases[0],bases[1],bases[2]];let runs=0;const scored=[];
  if(bases[0]&&bases[1]&&bases[2]){runs++;scored.push(bases[2]);nb[2]=bases[1];nb[1]=bases[0];nb[0]=batter;}
  else if(bases[0]&&bases[1]){nb[2]=bases[1];nb[1]=bases[0];nb[0]=batter;}
  else if(bases[0]){nb[1]=bases[0];nb[0]=batter;}
  else{nb[0]=batter;}
  return {runs,bases:nb,scored};
}
function resolveOut(bases,batter,outs,groundBias){
  const r1=bases[0],r2=bases[1],r3=bases[2];
  const w=[["ground",0.42*(groundBias||1)],["fly",0.36],["line",0.12],["pop",0.10*(groundBias?0.8:1)]];
  let subtype=weightedPick(w);
  let nb=[r1,r2,r3],runs=0,outsAdded=1,reached=false,error=false,desc="";
  if(subtype==="ground"&&r1&&outs<2){
    const roll=Math.random();
    if(roll<0.32*(groundBias||1)){ // 雙殺
      outsAdded=2;nb[0]=null;desc="精湛的雙殺守備";
    }else if(roll<0.32*(groundBias||1)+0.30){ // 野手選擇
      nb[0]=batter;reached=true;
      if(r3&&chance(0.35)){runs++;nb[2]=null;}
      desc="野手選擇，跑者被封殺在二壘";
    }else{ nb[0]=null; desc="滾地球遭到刺殺"; }
  }else if(subtype==="fly"&&r3&&outs<2&&chance(0.5)){
    runs++;nb[2]=null;desc="高飛犧牲打，三壘跑者奔回本壘";
  }else if(subtype==="line"&&r1&&outs<2&&chance(0.12)){
    outsAdded=2;nb[0]=null;desc="平飛球被接殺，跑者回壘不及造成雙殺";
  }else{
    desc=({ground:"滾地球遭到刺殺",fly:"高飛球被接殺",line:"平飛球被沒收",pop:"內野小飛球被接殺"})[subtype];
  }
  return {bases:nb,runs,outsAdded,reached,error:false,subtype,desc};
}

/* ---------- 比賽狀態 ---------- */
function sideName(m,side){return getTeam(side==="home"?m.homeId:m.awayId).name;}
function currentBatter(m){const lu=m.lineups[offenseSide(m)];return lu[m.batterIdx[offenseSide(m)]%lu.length];}
function defenseSide(m){return m.half==="top"?"home":"away";}
function offenseSide(m){return m.half==="top"?"away":"home";}
function playerIsOffense(m){const s=S.season.playerTeam;return m.half==="top"?m.awayId===s:m.homeId===s;}
function getBat(m,pid){if(!m.stats[pid])m.stats[pid]={ab:0,h:0,hr:0,rbi:0,bb:0,k:0,r:0,sb:0};return m.stats[pid];}
function batAdd(m,pid,d){const s=getBat(m,pid);for(const k in d)s[k]=(s[k]||0)+d[k];}
function getPit(m,pid){if(!m.pstats[pid])m.pstats[pid]={outs:0,h:0,r:0,er:0,bb:0,k:0,pp:0,w:0,l:0,sv:0};return m.pstats[pid];}
function pitAdd(m,pid,d){const s=getPit(m,pid);for(const k in d)s[k]=(s[k]||0)+d[k];}
/* 球季累計（含其他球團）；target 可指定為季後賽獨立累計（poPlayerStats） */
function mergeBatLine(pid,s,tgt){const ps=tgt||S.season.playerStats;const d=ps.bat[pid]||(ps.bat[pid]={g:0,ab:0,h:0,hr:0,rbi:0,bb:0,k:0,r:0,sb:0});d.g++;for(const k in s)d[k]=(d[k]||0)+s[k];}
function mergePitLine(pid,s,tgt){const ps=tgt||S.season.playerStats;const d=ps.pit[pid]||(ps.pit[pid]={g:0,outs:0,h:0,r:0,er:0,bb:0,k:0,pp:0,w:0,l:0,sv:0});d.g++;for(const k in s)d[k]=(d[k]||0)+s[k];}
function playerById(pid){const mm=/^([a-z]+)([bp])(\d+)$/.exec(pid);if(!mm)return null;const t=getTeam(mm[1]);return mm[2]==="b"?t.batters[+mm[3]]:t.pitchers[+mm[3]];}
function splitInt(total,weights){
  const n=weights.length,sum=weights.reduce((a,b)=>a+b,0)||1;
  const raw=weights.map(w=>Math.max(0,total)*w/sum);
  const out=raw.map(x=>Math.floor(x));
  let rem=total-out.reduce((a,b)=>a+b,0);
  const frac=raw.map((x,i)=>[x-Math.floor(x),i]).sort((a,b)=>b[0]-a[0]);
  let k=0;while(rem>0&&k<500){out[frac[k%n][1]]++;rem--;k++;}
  return out;
}
function weightedIndex(weights){
  let t=0;for(const w of weights)t+=Math.max(0,w);let r=Math.random()*t;
  for(let i=0;i<weights.length;i++){r-=Math.max(0,weights[i]);if(r<=0)return i;}
  return weights.length-1;
}
function addRuns(m,side,n){if(n<=0)return;m.score[side]+=n;if(m.line[side].length<m.inning)m.line[side].length=m.inning;m.line[side][m.inning-1]=(m.line[side][m.inning-1]||0)+n;}

function defaultLineup(team){return team.batters.filter(b=>!b.bench).slice(0,9);}
function buildLineup(team){
  const custom=(CAREER.lineups||{})[team.id];
  if(custom&&custom.length){
    const byId={};team.batters.forEach(b=>byId[b.id]=b);
    const seen={},arr=[];
    custom.forEach(id=>{const b=byId[id];if(b&&!seen[id]){arr.push(b);seen[id]=1;}});
    team.batters.forEach(b=>{if(arr.length<9&&!seen[b.id]){arr.push(b);seen[b.id]=1;}});
    if(arr.length>=9)return arr.slice(0,9);
  }
  return defaultLineup(team);
}
function buildBench(team){const lu=buildLineup(team);return team.batters.filter(b=>lu.indexOf(b)<0);}
function setPlayerLineup(ids){
  if(!S.season)return;
  CAREER.lineups=CAREER.lineups||{};
  CAREER.lineups[S.season.playerTeam]=ids.slice();
  saveCareer();
}
function starterOf(team,day){const sp=team.pitchers.filter(p=>p.starter);return sp[(day+hashStr(team.id))%sp.length];}

function newMatch(homeId,awayId,dayIndex,homeStarter,awayStarter){
  const home=getTeam(homeId),away=getTeam(awayId);
  const m={
    homeId,awayId,dayIndex,
    inning:1,half:"top",outs:0,balls:0,strikes:0,
    bases:[null,null,null],
    score:{away:0,home:0},hits:{away:0,home:0},errs:{away:0,home:0},
    line:{away:new Array(12).fill(0),home:new Array(12).fill(0)},
    lineups:{away:buildLineup(away),home:buildLineup(home)},
    bench:{away:buildBench(away),home:buildBench(home)},
    bullpen:{away:away.pitchers.filter(p=>!p.starter),home:home.pitchers.filter(p=>!p.starter)},
    usedPitchers:{away:[],home:[]},
    batterIdx:{away:0,home:0},
    pitchers:{away:{obj:awayStarter,pitches:0},home:{obj:homeStarter,pitches:0}},
    starters:{away:awayStarter,home:homeStarter},
    stats:{},pstats:{},log:[],over:false,winner:null,walkoff:false,
    lastOff:null,lastDef:null,usedSubs:new Set()
  };
  m.originals={away:m.lineups.away.slice(),home:m.lineups.home.slice()};  // 記錄原先發，供換人／打線對照
  m.log.push(`◆ 比賽開始　${away.name} ＠ ${home.name}（${home.stadium}）`);
  m.log.push(`　先發投手　${away.name}：${awayStarter.name}　／　${home.name}：${homeStarter.name}`);
  m.log.push(`◆ 1局上　${away.name}的進攻`);
  return m;
}

/* ---------- 打席處理 ---------- */
function playPA(m,offT,defT){
  const offSide=offenseSide(m),defSide=defenseSide(m);
  const batter=currentBatter(m);
  const P=m.pitchers[defSide];
  const eff=pitcherEffective(P.obj,P.pitches);
  const L=[];
  const push=(s,cls)=>{L.push(s);m.log.push(cls?{t:s,c:cls}:s);};

  const runnerOn1=!!m.bases[0],runnerOn2=!!m.bases[1],runnerOn3=!!m.bases[2];
  const anyRunner=runnerOn1||runnerOn2||runnerOn3;
  if(offT==="bunt"&&!anyRunner)offT="normal";
  if(offT==="hitrun"&&!anyRunner)offT="normal";

  const thrown=ri(1,4)+ri(0,2);
  P.pitches+=thrown;
  m.pitchSpeed=Math.round(138+P.obj.velocity*0.35+ri(-3,3));   // 球速（熱血演出）
  pitAdd(m,P.obj.id,{pp:thrown});

  let ev;
  if(offT==="bunt"){
    const succ=clamp(0.62+(batter.speed-60)/300-(eff.velocity-60)/500,0.30,0.86);
    if(chance(succ)) ev=chance(0.10)?"BUNTHIT":"SAC";
    else ev="BUNTOUT";
  }else{
    ev=paOutcome(batter,eff,offT,defT);
  }

  push(`　投手「${DEF_NAME[defT]||"配球"}」對決打者「${OFF_NAME[offT]||"揮擊"}」。`,null);

  let runs=0,desc="",cls="out";
  if(ev==="K"){m.outs++;
    batAdd(m,batter.id,{ab:1,k:1});pitAdd(m,P.obj.id,{k:1,outs:1});
    desc=`三振！${batter.name}揮棒落空，黯然退回休息區。`;cls="out";
    if(offT==="hitrun"&&runnerOn1&&m.outs<2&&chance(0.42)){
      m.bases[0]=null;m.outs++;desc+=`（打帶跑走壘失敗，一壘跑者被封殺！）`;
    }
  }
  else if(ev==="OUT"){const r=resolveOut(m.bases,batter,m.outs,DEF_MODS[defT]&&DEF_MODS[defT].ground);
    runs=r.runs;m.outs+=r.outsAdded;m.bases=r.bases;
    batAdd(m,batter.id,{ab:1});pitAdd(m,P.obj.id,{outs:r.outsAdded});
    desc=r.desc+"。";cls="out";
  }
  else if(ev==="SAC"){const nb=[m.bases[0],m.bases[1],m.bases[2]];let rr=0;
    if(m.bases[2]){rr++;nb[2]=null;}
    if(m.bases[1]){nb[2]=m.bases[1];nb[1]=null;}
    if(m.bases[0]){nb[1]=m.bases[0];nb[0]=null;}
    runs=rr;m.bases=nb;m.outs++;
    batAdd(m,batter.id,{ab:0});pitAdd(m,P.obj.id,{outs:1});
    desc=`漂亮的犧牲短打！${batter.name} 成功護送跑者${rr?"並送回一分":""}。`;cls="out";
  }
  else if(ev==="BUNTOUT"){m.outs++;batAdd(m,batter.id,{ab:1});pitAdd(m,P.obj.id,{outs:1});desc=`短打失敗，${batter.name} 點成小飛球被接殺。`;cls="out";}
  else if(ev==="BUNTHIT"){const nb=[batter,m.bases[0],m.bases[1]];let rr=0;
    if(m.bases[2]){rr++;nb[2]=m.bases[1];nb[1]=m.bases[0];nb[0]=batter;}
    else if(m.bases[1]){nb[2]=m.bases[1];nb[1]=m.bases[0];nb[0]=batter;}
    runs=rr;m.bases=nb;m.hits[offSide]++;
    batAdd(m,batter.id,{ab:1,h:1});pitAdd(m,P.obj.id,{h:1});
    desc=`出其不意！${batter.name} 偷點形成內野安打！`;cls="hit";
  }
  else if(ev==="BB"){const r=advanceOnWalk(m.bases,batter);runs=r.runs;m.bases=r.bases;
    batAdd(m,batter.id,{ab:0,bb:1});pitAdd(m,P.obj.id,{bb:1});
    r.scored.forEach(x=>{if(x)batAdd(m,x.id,{r:1});});
    desc=`四壞球保送，${batter.name}選球上壘。`;cls="hit";
  }
  else if(ev==="HBP"){const r=advanceOnWalk(m.bases,batter);runs=r.runs;m.bases=r.bases;
    batAdd(m,batter.id,{ab:0,bb:1});
    r.scored.forEach(x=>{if(x)batAdd(m,x.id,{r:1});});
    desc=`觸身球！${batter.name}挨了一記，保送上壘。`;cls="hit";
  }
  else{ // 安打：一壘／二壘／三壘／全壘打
    const h=hitAdvance(m.bases,batter,ev,offT==="hitrun");
    runs=h.runs;m.bases=h.bases;m.hits[offSide]++;
    pitAdd(m,P.obj.id,{h:1});
    batAdd(m,batter.id,{ab:1,h:1});
    if(ev==="HR")batAdd(m,batter.id,{hr:1});
    h.scored.forEach(x=>{if(x)batAdd(m,x.id,{r:1});});
    const word={"HR":"全壘打","3B":"三壘安打","2B":"二壘安打","1B":"一壘安打"}[ev];
    if(ev==="HR"){desc=`全壘打～～！！ ${batter.name} 的${runs>1?runs+"分":"陽春"}彈！`;cls="big";}
    else{desc=`${word}！${batter.name} 擊出穿越防線的安打${runs?"，跑者回壘得分":""}。`;cls="hit";}
  }

  // 得分
  if(runs>0){
    addRuns(m,offSide,runs);
    batAdd(m,batter.id,{rbi:runs});
    pitAdd(m,P.obj.id,{r:runs,er:runs});
    push(`　★ ${sideName(m,offSide)} 拿下 ${runs} 分！`, "run");
  }

  // 產出文字
  const cnt=makeCount(ev);
  const pitchWords=makePitchSeq(ev,cnt);
  pitchWords.forEach(w=>push("　　› "+w,null));
  push(`　${desc}（球數 ${cnt.b}-${cnt.s}）`,cls);

  // 下一棒
  m.batterIdx[offSide]++;
  m.balls=0;m.strikes=0;

  // 熱血演出：記錄上一打席結果與大字形（每打席先清除，避免舊大字殘留）
  m.lastKind=ev;
  m.lastRuns=runs;
  m.splash=null;
  if(ev==="HR")m.splash={t:"全壘打！！",c:"hr"};
  else if(ev==="K")m.splash={t:"三振！",c:"k"};
  else if(ev==="3B")m.splash={t:"三壘安打！",c:"hit"};
  else if(ev==="2B")m.splash={t:"二壘安打！",c:"hit"};
  else if(ev==="1B"||ev==="BUNTHIT")m.splash={t:"安打！",c:"hit"};
  else if(ev==="BB")m.splash={t:"保送",c:"bb"};
  else if(ev==="HBP")m.splash={t:"觸身球",c:"bb"};
  else if(ev==="SAC")m.splash={t:"犧牲觸擊",c:"out"};

  // 再見安打判定
  if(m.half==="bottom"&&m.inning>=9&&m.score.home>m.score.away){
    m.over=true;m.winner="home";m.walkoff=true;m.splash={t:"再見！",c:"hr"};
  }
}
/* 單場英雄（Player of the Game）
   候選僅取「勝利方」球員（和局時兩隊皆可），並讓打者與投手份量相當，
   避免以往投手（含敗投）幾乎必當 MVP 的問題。 */
function gameHero(m){
  const wSide=m.winner;                    // "home" / "away" / null(和局)
  const winTeam=wSide==null?null:(wSide==="home"?m.homeId:m.awayId);
  const winStarter=(wSide!=null&&m.starters)?m.starters[wSide].id:null;
  const teamOf=pid=>String(pid).replace(/[bp]\d+$/,"");
  const cand=[];
  for(const pid in m.stats){
    if(winTeam&&teamOf(pid)!==winTeam)continue;
    const s=m.stats[pid];
    const v=s.h*1.5+s.hr*2.5+s.rbi*1.4+(s.r||0)*1.0+(s.sb||0)*0.5+(s.bb||0)*0.2;
    const p=playerById(pid);
    cand.push({pid,name:p?p.name:pid,isPit:false,s,v});
  }
  for(const pid in m.pstats){
    if(winTeam&&teamOf(pid)!==winTeam)continue;
    const s=m.pstats[pid];
    let v=s.k*2+(s.outs||0)*0.45-(s.er||0)*3+(s.sv||0)*3;
    if(pid===winStarter)v+=3;              // 勝隊先發勝投加成（m.pstats 未記勝投）
    const p=playerById(pid);
    cand.push({pid,name:p?p.name:pid,isPit:true,s,v});
  }
  if(!cand.length)return null;
  cand.sort((a,b)=>b.v-a.v);
  return cand[0];
}

function makeCount(ev){
  if(ev==="K")return{b:ri(0,3),s:3};
  if(ev==="BB")return{b:4,s:ri(0,2)};
  if(ev==="HBP")return{b:0,s:0};
  return{b:ri(0,3),s:ri(0,2)};
}
function makePitchSeq(ev,cnt){
  const arr=[];
  for(let i=0;i<cnt.b;i++)arr.push("壞球，球數落後");
  for(let i=0;i<cnt.s;i++)arr.push(chance(0.5)?"好球沒揮，記好球":"精彩的界外球");
  if(arr.length===0)arr.push("第一球就出手");
  const fin={"K":"再見三振，棒子揮了個空","BB":"明顯壞球，打者獲得保送","HBP":"身體附近的球，打者閃避不及",
    "HR":"清脆的擊球聲！球飛向中外野深處","3B":"強勁的平飛球滾向右外野縫隙","2B":"深遠的飛球落地，打者衝上二壘",
    "1B":"穿越內野的強襲安打","OUT":"擊球進場，被防守方處理",
    "SAC":"輕輕一點，球滾向三壘方向","BUNTHIT":"突如其來的一點，防守方反應不及","BUNTOUT":"點成小飛球，被捕手接殺"}[ev]||"擊球進場";
  arr.push(fin);
  return arr;
}

/* ---------- 半局 / 比賽結束 ---------- */
function endHalf(m){
  m.outs=0;m.bases=[null,null,null];m.balls=0;m.strikes=0;
  const finished=m.half;
  if(finished==="top"){
    if(m.inning>=9&&m.score.home>m.score.away){m.over=true;m.winner="home";return;}  // 主隊領先才不用打九局下
    m.half="bottom";
    m.log.push({t:`◆ ${m.inning}局下　${sideName(m,"home")}的進攻`,c:"inn"});
  }else{
    if(m.inning>=9&&m.score.home!==m.score.away){m.over=true;m.winner=m.score.home>m.score.away?"home":"away";return;}
    if(m.inning>=18){m.over=true;m.winner=m.score.home>m.score.away?"home":(m.score.home<m.score.away?"away":null);return;}
    if(m.inning>=12&&!m.noTie){m.over=true;m.winner=null;return;}
    m.inning++;m.half="top";
    m.log.push({t:`◆ ${m.inning}局上　${sideName(m,"away")}的進攻`,c:"inn"});
  }
}

/* ---------- CPU AI 戰術 ---------- */
function aiOffense(m){
  const batter=currentBatter(m);
  const defSide=defenseSide(m);
  const eff=pitcherEffective(m.pitchers[defSide].obj,m.pitchers[defSide].pitches);
  const r1=!!m.bases[0],r2=!!m.bases[1],r3=!!m.bases[2];
  if(m.outs<2&&!r3&&(r1||r2)&&batter.power<58&&chance(0.32))return "bunt";
  if(r1&&batter.speed>72&&m.outs<2&&chance(0.14))return "hitrun";
  if(batter.power>72&&(r1||r2)&&m.outs<2&&chance(0.26))return "power";
  if(eff.control<58&&chance(0.30))return "take";
  return "normal";
}
function aiDefense(m){
  const batter=currentBatter(m);
  const defSide=defenseSide(m);
  const P=m.pitchers[defSide];
  const openFirst=!m.bases[0];
  if(m.outs<2&&openFirst&&(m.bases[1]||m.bases[2])&&batter.power>78&&chance(0.55))return "ibb";
  if(P.pitches>75&&chance(0.4))return "control";
  if(batter.power>75)return chance(0.5)?"corner":"chase";
  return weightedPick([["corner",0.40],["control",0.28],["power",0.20],["chase",0.12]]);
}

/* ---------- 玩家特殊動作 ---------- */
function doIBB(m){
  const offSide=offenseSide(m),batter=currentBatter(m),P=m.pitchers[defenseSide(m)];
  const r=advanceOnWalk(m.bases,batter);
  m.bases=r.bases;
  if(r.runs>0){addRuns(m,offSide,r.runs);batAdd(m,batter.id,{rbi:r.runs});}
  batAdd(m,batter.id,{ab:0,bb:1});
  m.log.push({t:`　投手選擇故意四壞，保送 ${batter.name} 上一壘。`,c:"sys"});
  m.batterIdx[offSide]++;P.pitches+=4;pitAdd(m,P.obj.id,{pp:4,bb:1});
}
function doSteal(m){
  const offSide=offenseSide(m);
  let from=-1,to=-1,runner=null;
  if(m.bases[0]){from=0;to=1;runner=m.bases[0];}
  else if(m.bases[1]){from=1;to=2;runner=m.bases[1];}
  if(!runner){m.log.push({t:"　沒有可盜壘的跑者。",c:"sys"});return;}
  const defSide=defenseSide(m),eff=pitcherEffective(m.pitchers[defSide].obj,m.pitchers[defSide].pitches);
  const p=clamp(0.60+(runner.speed-60)/160-(eff.velocity-60)/400,0.35,0.88);
  if(chance(p)){
    m.bases[from]=null;m.bases[to]=runner;
    batAdd(m,runner.id,{sb:1});
    m.log.push({t:`　★ 盜壘成功！${runner.name} 用速度搶下${to===2?"三壘":"二壘"}！`,c:"hit"});
  }else{
    m.bases[from]=null;m.outs++;
    m.log.push({t:`　盜壘失敗！${runner.name} 遭到阻殺，${m.outs}人出局。`,c:"out"});
    if(m.outs>=3)endHalf(m);
  }
}
function doPinchHit(m,auto){
  const offSide=offenseSide(m);
  const bench=m.bench[offSide];
  if(!bench.length){m.log.push({t:"　已無可用之兵。",c:"sys"});return;}
  const lu=m.lineups[offSide],idx=m.batterIdx[offSide]%lu.length;
  const before=lu[idx];
  const bi=auto?ri(0,bench.length-1):0;   // 自動調度隨機挑替補，讓大家都有上場機會
  const sub=bench.splice(bi,1)[0];
  lu[idx]=sub;
  m.log.push({t:`　代打！換下「${before.name}」（${before.posLabel}），由「${sub.name}」（${sub.posLabel}）拎著球棒上場代打。`,c:"sys"});
}
function doChangePitcher(m,pid){
  const defSide=defenseSide(m);
  const bp=m.bullpen[defSide];
  const i=bp.findIndex(p=>p.id===pid);
  if(i<0)return;
  const np=bp.splice(i,1)[0];
  const old=m.pitchers[defSide].obj;
  m.usedPitchers[defSide].push(old.id);
  m.pitchers[defSide]={obj:np,pitches:0};
  m.log.push({t:`　★ 換投！${sideName(m,defSide)} 換下「${old.name}」（${old.role}），由「${np.name}」（${np.role}）接替投球。`,c:"run"});
}

/* ---------- 遊戲回合控制 ---------- */
let busy=false;
function submit(fn,ms){
  if(busy)return;
  busy=true;
  const ov=$("#ov");if(ov)ov.classList.add("on");
  setTimeout(()=>{
    try{fn();}catch(e){console.error(e);}
    busy=false;if(ov)ov.classList.remove("on");
    if(S.match&&S.match.over&&!S.match._processed)processGameEnd(S.match);
    render();
  },ms||230);
}
function maybeAutoSub(m){
  if(m.over)return;
  const bench=m.bench[offenseSide(m)];
  if(!bench.length||!chance(0.06))return;
  doPinchHit(m,true);   // 自動讓替補上場代打（自動比賽才有機會上場的問題）
}
function resolveTurn(offT,defT){
  const m=S.match;if(!m||m.over)return;
  if(!playerIsOffense(m))maybeAutoSub(m);   // AI 進攻時也讓其替補有代打機會
  if(defT==="ibb"){doIBB(m);}
  else{playPA(m,offT,defT);}
  if(!m.over&&m.outs>=3)endHalf(m);
}
function autoHalf(m){
  const startHalf=m.half,startInn=m.inning;let guard=0;
  while(!m.over&&m.half===startHalf&&m.inning===startInn&&guard++<200){
    maybeAutoSub(m);
    playPA(m,aiOffense(m),aiDefense(m));
    if(m.outs>=3)endHalf(m);
  }
}
function autoGame(m){
  let guard=0;
  while(!m.over&&guard++<4000){
    maybeAutoSub(m);
    playPA(m,aiOffense(m),aiDefense(m));
    if(m.outs>=3)endHalf(m);
  }
  if(!m.over){m.over=true;}
}
/* ===================== 40-season.js ===================== */
/* ---------- 球季 ---------- */
function roundRobin(ids){
  const n=ids.length,rounds=[];
  let arr=ids.slice();
  for(let r=0;r<n-1;r++){
    const pairs=[];
    for(let i=0;i<n/2;i++)pairs.push([arr[i],arr[n-1-i]]);
    rounds.push(pairs);
    const fixed=arr[0],rest=arr.slice(1);rest.unshift(rest.pop());arr=[fixed].concat(rest);
  }
  return rounds;
}
function makeSchedule(){
  const ids=TEAM_DEFS.map(t=>t.id);
  const first=roundRobin(ids);
  const days=[];
  first.forEach((round,r)=>{
    days.push(round.map((p,i)=>r%2===0?{away:p[0],home:p[1],played:false,score:null}:{away:p[1],home:p[0],played:false,score:null}));
  });
  first.forEach((round,r)=>{
    days.push(round.map((p,i)=>r%2===0?{away:p[1],home:p[0],played:false,score:null}:{away:p[0],home:p[1],played:false,score:null}));
  });
  return days;
}
function teamStrength(id){
  const t=getTeam(id);
  const off=avg(t.batters.slice(0,9).map(b=>b.meet*0.6+b.power*0.4));
  const def=avg(t.pitchers.map(p=>p.control*0.4+p.breaking*0.3+p.velocity*0.3));
  return {off,def};
}
function quickSim(aId,bId){
  const a=teamStrength(aId),b=teamStrength(bId);
  const lamA=clamp(4.3*Math.pow(a.off/b.def,0.6)*rf(0.8,1.2),0.6,12);
  const lamB=clamp(4.3*Math.pow(b.off/a.def,0.6)*rf(0.8,1.2),0.6,12);
  let sa=poisson(lamA),sb=poisson(lamB),x=0;
  while(sa===sb&&x<6){if(chance(0.5))sa++;else sb++;x++;}
  return {a:sa,b:sb};
}
function gameScore(g){const s=g&&g.score;if(!s)return {a:0,h:0};return {a:s.a||0,h:(s.h!=null?s.h:(s.b!=null?s.b:0))};}
function applyRecord(awayId,homeId,ra,rh){
  const r=S.season.records;
  [awayId,homeId].forEach(id=>{if(!r[id])r[id]={w:0,l:0,t:0,rs:0,ra:0};});
  r[awayId].rs+=ra;r[awayId].ra+=rh;r[homeId].rs+=rh;r[homeId].ra+=ra;
  if(ra>rh){r[awayId].w++;r[homeId].l++;}
  else if(rh>ra){r[homeId].w++;r[awayId].l++;}
  else{r[awayId].t++;r[homeId].t++;}
}
function synthBatting(teamId,runs){
  const t=getTeam(teamId);
  // 先發 9 人，並隨機讓 0~2 名替補代打上場（讓替補在模擬比賽也有上場機會）
  const roster=t.batters.slice(0,9).slice();
  const bench=t.batters.filter(x=>x.bench);
  const subN=bench.length?ri(0,2):0;
  for(let i=0;i<subN&&bench.length;i++)roster.push(bench.splice(ri(0,bench.length-1),1)[0]);
  const ps=roster.map(p=>({pid:p.id,ab:p.bench?ri(1,2):ri(3,5),h:0,hr:0,rbi:0,bb:0,k:0,r:0,sb:0}));
  const totalAB=ps.reduce((a,x)=>a+x.ab,0);
  const H=clamp(Math.round(runs*1.15+4.6+rf(-1.5,1.5)),runs,Math.min(15,totalAB));
  const powW=roster.map(p=>Math.pow(Math.max(1,p.power-30),2));
  let hr=clamp(Math.round(runs*rf(0.12,0.45)),0,runs);
  hr=Math.min(hr,H);
  for(let i=0;i<hr;i++){let idx=weightedIndex(powW),tries=0;while(ps[idx].h>=ps[idx].ab&&tries<9){idx=weightedIndex(powW);tries++;}ps[idx].hr++;ps[idx].h++;}
  const w=roster.map(p=>0.8+Math.max(0,p.meet-40)*0.008+Math.max(0,p.power-40)*0.003);
  const add=splitInt(H-hr,w);
  let extra=0;
  ps.forEach((x,i)=>{const room=Math.max(0,x.ab-x.h);const give=Math.min(add[i],room);x.h+=give;extra+=add[i]-give;});
  while(extra>0){const i=weightedIndex(w);if(ps[i].h<ps[i].ab){ps[i].h++;extra--;}else break;}
  const rw=roster.map(p=>0.8+Math.max(0,p.meet-40)*0.006+Math.max(0,p.speed-40)*0.004);
  const rs=splitInt(runs,rw);ps.forEach((x,i)=>x.r+=rs[i]);
  const wr=roster.map(p=>0.8+Math.max(0,p.power-40)*0.01+Math.max(0,p.meet-40)*0.004);
  const rbi=splitInt(runs,wr);ps.forEach((x,i)=>x.rbi+=rbi[i]);
  const bbT=ri(1,5);for(let i=0;i<bbT;i++)ps[weightedIndex(roster.map(p=>p.eye))].bb++;
  const kT=ri(4,11);for(let i=0;i<kT;i++)ps[weightedIndex(roster.map(p=>Math.max(1,110-p.meet)))].k++;
  const sbT=ri(0,3);for(let i=0;i<sbT;i++)ps[weightedIndex(roster.map(p=>Math.max(1,p.speed-48)))].sb++;
  return ps;
}
function synthPitching(teamId,runsAllowed,oppHits,won,close){
  const t=getTeam(teamId);
  const sp=t.pitchers.filter(p=>p.starter),rp=t.pitchers.filter(p=>!p.starter);
  const starter=sp[ri(0,sp.length-1)];
  const outs=Math.min(27,ri(15,25));
  const rest=27-outs;
  const starterLine={pid:starter.id,outs:outs,h:Math.round(oppHits*0.68),r:Math.round(runsAllowed*0.72),er:Math.round(runsAllowed*0.68),bb:ri(0,4),k:ri(3,9),pp:outs*ri(3,4),w:0,l:0,sv:0};
  const list=[starterLine];
  let relLine=null;
  if(rest>0){
    const rel=rp.length?rp[ri(0,rp.length-1)]:starter;
    relLine={pid:rel.id,outs:rest,h:Math.max(0,oppHits-starterLine.h),r:Math.max(0,runsAllowed-starterLine.r),er:Math.max(0,runsAllowed-starterLine.er),bb:ri(0,2),k:ri(1,4),pp:rest*ri(3,4),w:0,l:0,sv:0};
    list.push(relLine);
  }
  const last=list[list.length-1];
  if(won){ last.w=1; if(close&&list.length>1&&last.outs>=3&&last.outs<9)last.sv=1; }
  else starterLine.l=1;
  return list;
}
function synthGameStats(awayId,homeId,ra,rh,merge){
  const margin=Math.abs(ra-rh);
  const awayBat=synthBatting(awayId,ra), homeBat=synthBatting(homeId,rh);
  const awayPit=synthPitching(awayId,rh,homeBat.reduce((a,x)=>a+x.h,0),rh<ra,margin<=3);
  const homePit=synthPitching(homeId,ra,awayBat.reduce((a,x)=>a+x.h,0),ra<rh,margin<=3);
  if(merge!==false){
    awayBat.forEach(s=>mergeBatLine(s.pid,s));
    homeBat.forEach(s=>mergeBatLine(s.pid,s));
    awayPit.forEach(s=>mergePitLine(s.pid,s));
    homePit.forEach(s=>mergePitLine(s.pid,s));
  }
  return {away:{bat:awayBat,pit:awayPit},home:{bat:homeBat,pit:homePit}};
}
/* ---------- 逐場 box（精簡數字陣列，節省存取空間） ---------- */
const BOX_BAT=["ab","h","hr","rbi","bb","k","r","sb"];
const BOX_PIT=["outs","h","r","er","bb","k","pp","w","l","sv"];
function packBat(s){return BOX_BAT.map(k=>s[k]||0);}
function packPit(s){return BOX_PIT.map(k=>s[k]||0);}
/* 模擬比賽的該隊逐局得分分布（產生後即存入，不需可重現） */
function synthInnings(runs){
  const line=new Array(9).fill(0);
  if(runs<=0)return line;
  const n=Math.max(1,Math.min(runs,ri(1,2)+(runs>3?1:0)+(runs>6?1:0)));
  const pool=[0,1,2,3,4,5,6,7,8],picks=[];
  for(let i=0;i<n&&pool.length;i++)picks.push(pool.splice(ri(0,pool.length-1),1)[0]);
  let left=runs;
  while(left>0){line[picks[ri(0,picks.length-1)]]++;left--;}
  return line;
}
/* 玩家實際比賽 → box */
function boxFromMatch(m){
  const cBat={},cPit={};
  for(const pid in m.stats)cBat[pid]=packBat(m.stats[pid]);
  for(const pid in m.pstats)cPit[pid]=packPit(m.pstats[pid]);
  if(m.winner){
    const wId=m.starters[m.winner].id;
    const lId=m.starters[m.winner==="home"?"away":"home"].id;
    const wl=cPit[wId]||(cPit[wId]=packPit({}));
    wl[7]=1;
    const ll=cPit[lId]||(cPit[lId]=packPit({}));
    ll[8]=1;
  }
  return {
    st:m.po?(m.po.stage==="semi"?"準決賽":"冠軍戰"):"",
    aw:m.awayId,hm:m.homeId,a:m.score.away,h:m.score.home,
    line:{aw:m.line.away.slice(0,12),hm:m.line.home.slice(0,12)},
    e:{aw:m.errs.away,hm:m.errs.home},
    bat:cBat,pit:cPit,win:m.winner,
    sp:{away:m.starters.away.id,home:m.starters.home.id}
  };
}
/* 模擬比賽 → box（L 為 synthGameStats 的回傳，st 為季後賽標籤） */
function boxFromSim(awayId,homeId,r,L,st){
  const cBat={},cPit={};
  L.away.bat.forEach(s=>cBat[s.pid]=packBat(s));
  L.home.bat.forEach(s=>cBat[s.pid]=packBat(s));
  L.away.pit.forEach(s=>cPit[s.pid]=packPit(s));
  L.home.pit.forEach(s=>cPit[s.pid]=packPit(s));
  return {
    st:st||"",
    aw:awayId,hm:homeId,a:r.a,h:r.b,
    line:{aw:synthInnings(r.a),hm:synthInnings(r.b)},
    e:{aw:ri(0,2),hm:ri(0,2)},
    bat:cBat,pit:cPit,win:r.a>r.b?"away":r.b>r.a?"home":null,
    sp:{away:(L.away.pit[0]&&L.away.pit[0].pid)||"",home:(L.home.pit[0]&&L.home.pit[0].pid)||""}
  };
}
function mergePlayerStats(m,tgt){
  if(!S.season.playerStats)S.season.playerStats={bat:{},pit:{}};
  const ps=tgt||S.season.playerStats;
  for(const pid in m.stats)mergeBatLine(pid,m.stats[pid],ps);
  for(const pid in m.pstats)mergePitLine(pid,m.pstats[pid],ps);
  // 勝敗投手：獲勝方先發勝投、落敗方先發敗投（寫入球季累計）
  if(m.winner){
    const wSide=m.winner,lSide=wSide==="home"?"away":"home";
    const pp=ps.pit;
    const wId=m.starters[wSide].id,lId=m.starters[lSide].id;
    if(pp[wId])pp[wId].w=(pp[wId].w||0)+1;
    if(pp[lId])pp[lId].l=(pp[lId].l||0)+1;
  }
}
/* 季後賽球員成績：獨立累計，不寫入例行賽 playerStats／排行榜 */
function mergePoStats(m){
  const se=S.season;
  if(!se.poPlayerStats)se.poPlayerStats={bat:{},pit:{}};
  mergePlayerStats(m,se.poPlayerStats);
}
function processGameEnd(m){
  if(m._processed)return;m._processed=true;
  if(m.po){recordPlayoffResult(m);return;}   // 季後賽：只更新籤表，不動例行賽排名
  m.hero=gameHero(m);
  const day=S.season.schedule[m.dayIndex];
  const g=day.find(x=>x.away===m.awayId&&x.home===m.homeId);
  if(g){g.played=true;g.score={a:m.score.away,h:m.score.home};}
  applyRecord(m.awayId,m.homeId,m.score.away,m.score.home);
  mergePlayerStats(m);
  const when="第"+(m.dayIndex+1)+"日";
  checkMatchRecords(m,when);
  logGame(m.dayIndex+1,"",m.awayId,m.homeId,m.score.away,m.score.home);
  const boxes=S.season.boxes||(S.season.boxes=[]);
  boxes[m.dayIndex]=boxes[m.dayIndex]||[];
  if(g)boxes[m.dayIndex][day.indexOf(g)]=boxFromMatch(m);
  day.forEach((x,i)=>{
    if(x.played)return;
    const r=quickSim(x.away,x.home);
    x.played=true;x.score={a:r.a,h:r.b};
    applyRecord(x.away,x.home,r.a,r.b);
    logGame(m.dayIndex+1,"",x.away,x.home,r.a,r.b);
    const L=synthGameStats(x.away,x.home,r.a,r.b);
    boxes[m.dayIndex][i]=boxFromSim(x.away,x.home,r,L,"");
    checkLineRecords(L.away,x.away,when);
    checkLineRecords(L.home,x.home,when);
    checkSimTeamRecords(x.away,x.home,r.a,r.b,when);
  });
  checkInningRecords(m.dayIndex,when);   // 單局團隊得分（當日全部 box 含實戰場）
  /* 特殊事蹟與生涯里程碑（本日全部打完後結算） */
  let special="";
  (boxes[m.dayIndex]||[]).forEach(b=>{
    const d=b&&recordNoHitter(b,"第"+(m.dayIndex+1)+"日");
    if(d&&d.team===S.season.playerTeam)special="★ "+NH_LABELS[d.kind]+"！"+getTeam(d.team).name+" 投手群寫下紀錄";
  });
  const miles=checkMilestones();
  if(!special&&miles.length)special="★ "+milestoneText(miles[0],miles[0].pid)+(miles.length>1?"　（本日共 "+miles.length+" 項）":"");
  if(special){
    const se=S.season;se.news=se.news||[];
    se.news.push({day:m.dayIndex+1,text:special,special:true});
    if(se.news.length>5)se.news.shift();
    if(!S.flash)S.flash=special;
  }
  buildDayPaper(m.dayIndex);
  S.season.day++;
  updateStreakBest();   // 每日更新隊史最長連勝／連敗
  leagueNews(m.dayIndex);
  if(S.season.day>=Math.floor(S.season.schedule.length/2)&&!S.season.asNotified){
    S.season.asNotified=true;
    if(!S.flash)S.flash="★ 明星賽週到了！紅藍名單已自動生成";
    ensureAllstarRoster();  // 自動生成明星賽名單
  }
  if(S.season.day>=S.season.schedule.length)ensurePlayoff();  // 例行賽結束 → 建立季後賽籤表
  saveGame();
}
/* 每日聯盟快報：首位攻防與你的排名變動 */
function leagueNews(dayIdx){
  const se=S.season;
  const st=standingsList();
  const top=st[0],second=st[1];
  const my=se.playerTeam;
  const myRank=st.findIndex(x=>x.id===my)+1;
  const prev=se.prevMyRank;
  let line="";
  if(prev!==undefined&&prev<9){
    if(myRank<prev)line=`◎ 你的${getTeam(my).name}升至第 ${myRank} 名！`;
    else if(myRank>prev)line=`◎ 你的${getTeam(my).name}滑落至第 ${myRank} 名…`;
  }
  if(!line&&myRank===1)line=`◎ 你的${getTeam(my).name}攻佔/續保首位！`;
  if(!line&&second){
    const gap=Number(second.gb);
    if(gap!=null&&gap<=1.0)line=`◎ ${dayIdx+1}日終了：首位 ${getTeam(top.id).name}，第2名 ${getTeam(second.id).name} 僅差 ${gap} 場！`;
    else line=`◎ ${dayIdx+1}日終了：首位 ${getTeam(top.id).name}（${top.w}勝）`;
  }
  if(!line)line=`◎ ${dayIdx+1}日終了：首位 ${getTeam(top.id).name}（${top.w}勝）`;
  se.news=se.news||[];se.news.push({day:dayIdx+1,text:line});
  if(se.news.length>5)se.news.shift();
  se.prevMyRank=myRank;
  if(!S.flash)S.flash=line;
}
/* ===================== 45-playoff.js ===================== */
/* ---------- 季後賽 ---------- */
/* 例行賽前 4 名晉級：準決賽 3 戰 2 勝（1vs4、2vs3），冠軍戰 5 戰 3 勝。
   較高種子擁有較多主場（偶數戰＝高種子主場）。季後賽不列入例行賽排名。 */
function seriesNeed(best){return Math.ceil(best/2);}
function mkSeries(hi,lo,best){return {hi:hi,lo:lo,best:best,winsHi:0,winsLo:0,games:[],winner:null};}
function homeIsHi(gameNo){return gameNo%2===0;}
function seriesOver(s){return !!s.winner;}

/* 例行賽結束 → 建立季後賽籤表 */
function ensurePlayoff(){
  const se=S.season;
  if(!se||se.playoff)return;
  if((se.day||0)<(se.schedule||[]).length)return;   // 例行賽尚未結束
  // 安全網：若明星賽名單已產生卻從未開打（例如整季用快進跳過），在此自動補打，確保歷屆明星賽不缺季
  if(se.allstar&&!se.allstar.played){ try{ simAllstar(); }catch(e){} }
  const st=standingsList();
  const seeds=st.slice(0,4).map(x=>x.id);
  se.playoff={
    seeds:seeds,
    semi:[mkSeries(seeds[0],seeds[3],3),mkSeries(seeds[1],seeds[2],3)],
    final:null,
    stage:"semi",
    champion:null
  };
}

/* 目前玩家要打的季後賽是哪個系列賽的第幾戰（沒有則 null） */
function playoffNextGame(){
  const po=S.season.playoff;
  if(!po||po.stage==="done")return null;
  const me=S.season.playerTeam;
  const arr=po.stage==="semi"?po.semi:(po.final?[po.final]:[]);
  for(let i=0;i<arr.length;i++){
    const s=arr[i];
    if(s.winner)continue;
    if(s.hi===me||s.lo===me)return {series:s,si:i,gameNo:s.games.length};
  }
  return null;
}
function playoffGameCount(){
  const po=S.season.playoff;if(!po)return 0;
  let n=0;po.semi.forEach(s=>n+=s.games.length);
  if(po.final)n+=po.final.games.length;
  return n;
}

/* 快速模擬一個系列賽的一場 */
function simSeriesGame(s,label){
  const gameNo=s.games.length;
  const hiHost=homeIsHi(gameNo);
  const home=hiHost?s.hi:s.lo, away=hiHost?s.lo:s.hi;
  const r=quickSim(away,home);
  const awayScore=r.a, homeScore=r.b;
  const winnerId=homeScore>awayScore?home:away;
  const hiScore=home===s.hi?homeScore:awayScore;
  const loScore=home===s.hi?awayScore:homeScore;
  s.games.push({home:home,away:away,scoreHi:hiScore,scoreLo:loScore,winner:winnerId});
  logGame(null,label||"季後賽",away,home,awayScore,homeScore);
  const L=synthGameStats(away,home,awayScore,homeScore,false);
  const bx=boxFromSim(away,home,{a:awayScore,b:homeScore},L,label||"季後賽");
  (S.season.poBoxes||(S.season.poBoxes=[])).push(bx);
  recordNoHitter(bx,label||"季後賽");
  if(winnerId===s.hi)s.winsHi++;else s.winsLo++;
  if(s.winsHi>=seriesNeed(s.best)||s.winsLo>=seriesNeed(s.best))s.winner=winnerId;
}
function simSeriesToEnd(s,label){let g=0;while(!s.winner&&g++<20)simSeriesGame(s,label);}

/* 自動推進與玩家無關的系列賽；必要時產生冠軍戰、產生總冠軍 */
function playoffProgress(){
  const po=S.season.playoff;
  if(!po)return;
  const me=S.season.playerTeam;
  let guard=0;
  while(guard++<60){
    if(po.stage==="semi"){
      po.semi.forEach(s=>{if(!s.winner&&s.hi!==me&&s.lo!==me)simSeriesToEnd(s,"準決賽");});
      if(po.semi.every(s=>!!s.winner)){
        po.final=mkSeries(seriesWinnerOf(po.semi[0]),seriesWinnerOf(po.semi[1]),5);
        const rank=id=>po.seeds.indexOf(id);
        if(rank(po.final.lo)<rank(po.final.hi)){const t=po.final.hi;po.final.hi=po.final.lo;po.final.lo=t;}
        po.stage="final";
        continue;
      }
      break;
    }
    if(po.stage==="final"){
      const f=po.final;
      if(f&&!f.winner&&f.hi!==me&&f.lo!==me)simSeriesToEnd(f,"冠軍戰");
      if(f&&f.winner){
        po.champion=f.winner;po.stage="done";
        const won = po.champion===me;
        const se=S.season;
        // 季後賽冠軍／晉級日報
        se.news=se.news||[];
        se.news.push({day:se.schedule.length+1,text:`★ 季後賽結束：總冠軍 ${getTeam(po.champion).name}${won?"（你率領奪冠！）":""}`,special:true});
        if(won) se.news.push({day:se.schedule.length+1,text:`🏆 恭喜！你率領 ${getTeam(me).name} 奪得本季總冠軍！`,special:true});
        if(se.news.length>10)se.news.shift();
        computeAwards();                      // 季後頒獎
        finalizeSeason();                     // 累計生涯、寫入跨季紀錄
        prepareDraft();                       // 新人選秀（有退休缺口才展開）
        CAREER.pending=true;saveCareer();saveGame();
        if(won){S.flash=S.flash||`🏆 總冠軍 ${getTeam(me).name}！恭喜奪冠！`; setTimeout(()=>SFX.champ(),220);} else {S.flash=S.flash||`季後賽結束：總冠軍 ${getTeam(po.champion).name}`;}
    // 提示晉級冠軍（對玩家而言）
    if(won) S.flash = S.flash || `🏆 你率領 ${getTeam(me).name} 奪得總冠軍！`;
      }
      break;
    }
    break;
  }
}
function seriesWinnerOf(s){return s.winner;}

/* 玩家打完一場季後賽：寫入系列賽結果 */
function recordPlayoffResult(m){
  const po=S.season.playoff;
  if(!po){saveGame();return;}
  const s=(m.po.stage==="semi")?po.semi[m.po.si]:po.final;
  if(s&&!s.winner){
    const awayScore=m.score.away, homeScore=m.score.home;
    const winnerId=homeScore>awayScore?m.homeId:m.awayId;
    const hiScore=m.homeId===s.hi?homeScore:awayScore;
    const loScore=m.homeId===s.hi?awayScore:homeScore;
    s.games.push({home:m.homeId,away:m.awayId,scoreHi:hiScore,scoreLo:loScore,winner:winnerId});
    if(winnerId===s.hi)s.winsHi++;else s.winsLo++;
    if(s.winsHi>=seriesNeed(s.best)||s.winsLo>=seriesNeed(s.best))s.winner=winnerId;
  }
  mergePoStats(m);   // 季後賽成績獨立累計，不寫入例行賽排行榜
  m.hero=gameHero(m);
  const stName=m.po.stage==="semi"?"準決賽":"冠軍戰";
  logGame(null,stName,m.awayId,m.homeId,m.score.away,m.score.home);
  const bx=boxFromMatch(m);
  (S.season.poBoxes||(S.season.poBoxes=[])).push(bx);
  const nh=recordNoHitter(bx,stName+"·第"+(m.po.gameNo+1)+"戰");
  const miles=checkMilestones();
  if(!S.flash&&nh&&nh.team===S.season.playerTeam)S.flash="★ "+NH_LABELS[nh.kind]+"！"+getTeam(nh.team).name;
  if(!S.flash&&miles.length)S.flash="★ "+milestoneText(miles[0],miles[0].pid);
  // 晉級／淘汰提示（玩家系列賽剛分出勝負時）
  const me=S.season.playerTeam;
  if(s&&s.winner){
    if(s.winner===me){
      S.flash = m.po.stage==="semi"
        ? `🎉 晉級冠軍戰！${getTeam(me).name} 以 ${Math.max(s.winsHi,s.winsLo)} 勝拿下準決賽！`
        : `🏆 總冠軍！${getTeam(me).name} 奪下本季王座！`;
    }else if(s.hi===me||s.lo===me){
      S.flash=`😢 ${stName}落敗…${getTeam(me).name} 本季止步（${Math.max(s.winsHi,s.winsLo)}-${Math.min(s.winsHi,s.winsLo)}）。`;
    }
  }
  // 季後賽場次日報（純文字＋勝隊 id；徽章由顯示層依 team 欄位繪製，避免 HTML 被跳脫）
  const se=S.season; se.news=se.news||[];
  const winTeam = m.score.home>m.score.away?m.homeId:m.awayId;
  const loseTeam = m.score.home>m.score.away?m.awayId:m.homeId;
  const poDay = (se.poBoxes?se.poBoxes.length:0);
  const poTxt = `${stName}·第${m.po.gameNo+1}戰：${getTeam(winTeam).name} ${m.score.away>m.score.home?m.score.away:m.score.home}:${m.score.away>m.score.home?m.score.home:m.score.away} ${getTeam(loseTeam).name}`;
  se.news.push({day:se.schedule.length, text:poTxt, special:true, team:winTeam});
  if(se.news.length>15)se.news.shift();
  saveGame();
}

/* 全部季後賽快速模擬完畢（用於玩家未參與時） */
function playoffSimAll(){
  const po=S.season.playoff;
  if(!po)return;
  let guard=0;
  while(po.stage!=="done"&&guard++<60){
    const arr=po.stage==="semi"?po.semi:(po.final?[po.final]:[]);
    const label=po.stage==="semi"?"準決賽":"冠軍戰";
    arr.forEach(s=>{if(!s.winner)simSeriesToEnd(s,label);});
    playoffProgress();
  }
  saveGame();
}

/* ---------- 遊戲紀錄 ---------- */
/* 三種紀錄：
   1) 逐場賽果：本季每場比賽（例行賽＋季後賽）的對戰與比數。
   2) 跨季生涯：每完成一季，留下一筆摘要（戰績、名次、總冠軍）。
   3) 生涯里程碑：跨季累計的各項生涯數據排行榜。 */

/* 記錄一場比賽（例行賽帶 day；季後賽帶 stage 標籤、day 為 null） */
function logGame(day,stage,awayId,homeId,sa,sh){
  const se=S.season;if(!se)return;
  se.gl=se.gl||[];
  se.gl.push({d:day||null,st:stage||"",aw:awayId,hm:homeId,a:sa,h:sh});
}

/* 球季（含季後賽）結束：累計生涯數據、寫入跨季生涯摘要 */
function finalizeSeason(){
  const se=S.season;
  if(!se||se.finalized)return;
  se.finalized=true;

  /* 生涯累計（全聯盟球員） */
  CAREER.career=CAREER.career||{bat:{},pit:{}};
  const cb=CAREER.career.bat,cp=CAREER.career.pit;
  const ps=se.playerStats||{bat:{},pit:{}};
  const BAT=["g","ab","h","hr","rbi","bb","k","r","sb"];
  const PIT=["g","outs","h","r","er","bb","k","pp","w","l","sv"];
  for(const pid in ps.bat){const s=ps.bat[pid],d=cb[pid]||(cb[pid]={});BAT.forEach(k=>d[k]=(d[k]||0)+(s[k]||0));}
  for(const pid in ps.pit){const s=ps.pit[pid],d=cp[pid]||(cp[pid]={});PIT.forEach(k=>d[k]=(d[k]||0)+(s[k]||0));}

  /* 初登場球季：只要在這一季有過正式出賽就記下來（新人王只能拿第一季） */
  CAREER.debut=CAREER.debut||{};
  const debutNo=CAREER.seasons+1;
  for(const pool of [ps.bat,ps.pit])for(const pid in pool){
    if((pool[pid].g||0)>0&&!CAREER.debut[pid])CAREER.debut[pid]=debutNo;
  }

  /* 跨季生涯摘要 */
  const st=standingsList();
  const me=se.playerTeam;
  const rank=st.findIndex(x=>x.id===me)+1;
  const rec=se.records[me]||{w:0,l:0,t:0};
  CAREER.history=CAREER.history||[];
  const hno=CAREER.seasons+1;
  CAREER.history.push({
    no:hno, team:me, w:rec.w, l:rec.l, t:rec.t, rank,
    champ:(se.playoff&&se.playoff.champion)||null, isChamp:!!(se.playoff&&se.playoff.champion===me)
  });
  /* 詳細球季存檔（供歷史回顧） */
  CAREER.seasonDetails=CAREER.seasonDetails||[];
  CAREER.seasonDetails.push({
    no:hno, team:me,
    rec:{w:rec.w, l:rec.l, t:rec.t, rank},
    rs:rec.rs||0, ra:rec.ra||0,
    champ:(se.playoff&&se.playoff.champion)||null,
    isChamp:!!(se.playoff&&se.playoff.champion===me),
    playoff:se.playoff?{stage:se.playoff.stage,champion:se.playoff.champion,semi:se.playoff.semi,final:se.playoff.final}:null,
    awards:se.awards?{mvp:se.awards.mvp,cy:se.awards.cy,reliever:se.awards.reliever,rookie:se.awards.rookie,sawamura:se.awards.sawamura,best9:se.awards.best9,gloves:se.awards.gloves,bestDH:se.awards.bestDH,kings:se.awards.kings}:null,
    leaders:se.awards?{bat:Object.keys(se.playerStats?.bat||{}).length,pit:Object.keys(se.playerStats?.pit||{}).length}:null,
    standings:st.map(x=>({id:x.id,w:x.w,l:x.l,t:x.t,pct:x.pct,rs:x.rs,ra:x.ra})),
    teamStats:{bat:{},pit:{}}
  });
  // 存球隊打擊/投手彙總
  const sd=CAREER.seasonDetails[CAREER.seasonDetails.length-1];
  for(const pid in ps.bat){const s=ps.bat[pid];const tid=teamOfPlayer({id:pid});if(tid===me)sd.teamStats.bat[pid]={...s};}
  for(const pid in ps.pit){const s=ps.pit[pid];const tid=teamOfPlayer({id:pid});if(tid===me)sd.teamStats.pit[pid]={...s};}

  /* 歷屆獎項：綁定選手百科與紀錄殿堂 */
  CAREER.awards=CAREER.awards||[];
  const aw=se.awards;
  if(aw){
    const top1=list=>list&&list[0]?{pid:list[0].pid,name:list[0].name,team:list[0].team,pts:list[0].pts,s:list[0].s||null}:null;
    CAREER.awards.push({
      no:CAREER.seasons+1,
      champ:(se.playoff&&se.playoff.champion)||null,
      mvp:top1(aw.mvp), cy:top1(aw.cy), reliever:top1(aw.reliever), rookie:top1(aw.rookie), sawamura:top1(aw.sawamura),
      best9:(aw.best9||[]).map(x=>({pos:x.pos,name:x.name,pid:x.pid,team:x.team,pts:x.pts,s:x.s||null})),
      gloves:(aw.gloves||[]).map(x=>({pos:x.pos,name:x.name,pid:x.pid,team:x.team})),
      bestDH:top1(aw.bestDH),
      kings:(aw.kings||[]).filter(k=>k.name).map(k=>({kind:k.kind,title:k.title,name:k.name,pid:k.pid||"",team:k.team,val:k.val}))
    });
  }
  /* 單季紀錄榜（跨季最佳單季成績）＋ 季末里程碑補檢 */
  recordSeasonBest(ps,CAREER.seasons+1);
  checkMilestones();
  saveCareer();
}

function histGamesPanel(){
  const se=S.season;
  const me=se?se.playerTeam:"";
  const gl=(se&&se.gl)||[];
  if(!gl.length)return `<div class="panel"><h2>逐場賽果</h2><p class="muted">本季尚無比賽紀錄。</p></div>`;
  let rows="",lastKey=null;
  let debugInfo = [];
  gl.forEach((g,gi)=>{
    const key=g.d?("D"+g.d):("S"+g.st);
    if(key!==lastKey){
      lastKey=key;
      const label=g.d?`第 ${g.d} 日`:(g.st||"季後賽");
      rows+=`<tr class="daysep"><td colspan="3">${esc(label)}</td></tr>`;
    }
    const mine=(g.aw===me||g.hm===me);
    const tie=g.a===g.h;
    const winner=tie?null:(g.a>g.h?g.aw:g.hm);
    const res=tie?'<span class="muted">和局</span>':`${teamBadge(winner)} 勝`;
    // 找對應的 box
    let box=null,inningHtml="";
    if(g.d!=null){
      const dayBoxes=(se.boxes||[])[g.d-1]||[];
      const idx=dayBoxes.findIndex(b=>b.aw===g.aw&&b.hm===g.hm);
      if(idx>=0)box=dayBoxes[idx];
    }else if(g.st!=null){
      box=(se.poBoxes||[]).find(b=>b.aw===g.aw&&b.hm===g.hm);
    }
    if(box){
      const a=box.line.aw||[],h=box.line.hm||[];
      const N=Math.max(a.length,h.length,1);
      const mk=(arr,tid)=>`<tr><td class="name">${teamBadge(tid)}</td>`+arr.slice(0,N).map(v=>`<td class="num">${v!=null?v:0}</td>`).join("")+`<td class="num"><b>${arr.reduce((s,v)=>s+(v||0),0)}</b></td></tr>`;
      const toggleId=`inning-${gi}`;
      inningHtml=`<tr id="${toggleId}" class="inning-detail" style="display:none"><td colspan="3">
        <table class="grid" style="margin:4px 0;font-size:11px"><tr><th></th>`+
        Array.from({length:N},(_,i)=>`<th>${i+1}</th>`).join("")+`<th>R</th></tr>`+
        mk(a,box.aw)+mk(h,box.hm)+`</table></td></tr>`;
      rows+=`<tr class="${mine?"me":""}" onclick="document.getElementById('${toggleId}').style.display=''"><td class="name">${teamBadge(g.aw)} vs ${teamBadge(g.hm)}</td>
        <td class="num">${g.a}：${g.h}</td><td class="name">${res} <span class="pill" style="font-size:10px">▼ 局數</span></td></tr>`;
      rows+=inningHtml;
    }else{
      rows+=`<tr class="${mine?"me":""}"><td class="name">${teamBadge(g.aw)} vs ${teamBadge(g.hm)}</td>
        <td class="num">${g.a}：${g.h}</td><td class="name">${res}</td></tr>`;
    }
  });
  return `<div class="panel"><h2>逐場賽果</h2>
    <p class="muted">本季所有比賽（例行賽＋季後賽）。＊標記者為你的球隊。點擊比賽列展開每局得分。</p>

const HIST_MIN_AB=200;   // 生涯打擊率榜規定打席（與里程碑同門檻）
function histMilePanel(){

  const cat=S.histCat||"hr";

    for(const pid in src){const s=src[pid];if((s.ab||0)>=HIST_MIN_AB)arr.push({pid,v:s.h/s.ab});}

    for(const pid in src){const v=src[pid][cat]||0;if(v>0)arr.push({pid,v});}

    const p=playerById(x.pid);

  }).join("")||`<tr><td colspan="4" class="muted">尚無資料。</td></tr>`;

/* ---------- 連勝／連敗（本季即時＋隊史最長） ---------- */
/* 依賽程日序重建各隊當前連續狀態；和局中斷連續 */
function teamStreaks(){
  const se=S.season;const cur={};
  TEAM_DEFS.forEach(t=>cur[t.id]={type:null,n:0});
  (se.schedule||[]).forEach(day=>{
    (day||[]).forEach(g=>{
      if(!g.played||!g.score)return;
      const sc=gameScore(g);
      const res=sc.a===sc.h?null:(sc.a>sc.h?"away":"home");
      [[g.away,res==="away"?"W":(res?"L":null)],[g.home,res==="home"?"W":(res?"L":null)]].forEach(([id,r])=>{
        if(!r){cur[id]={type:null,n:0};return;}
        cur[id]=(cur[id].type===r)?{type:r,n:cur[id].n+1}:{type:r,n:1};
      });
    });
  });
  return cur;
}
function streakLabel(s){
  if(!s||!s.type||!s.n)return "<span class=\"muted\">－</span>";
  return s.type==="W"?`<b style="color:#4fd39a">${s.n}連勝</b>`:`<b style="color:#e06782">${s.n}連敗</b>`;
}
/* 每日賽後更新隊史最長連勝／連敗 */
function updateStreakBest(){
  const cur=teamStreaks();
  CAREER.streakBest=CAREER.streakBest||{};
  for(const id in cur){
    const b=CAREER.streakBest[id]||(CAREER.streakBest[id]={w:0,l:0});
    if(cur[id].type==="W"&&cur[id].n>b.w)b.w=cur[id].n;
    if(cur[id].type==="L"&&cur[id].n>b.l)b.l=cur[id].n;
  }
  saveCareer();
}
/* ---------- 單場紀錄簿（本季＋生涯） ---------- */
function newRecBook(){
  return {bat:{h:null,hr:null,rbi:null,r:null,sb:null,bb:null,k:null},
          pit:{k:null,ip:null},
          team:{r:null,margin:null,innings:null,inn:null}};
}
function recUp(book,cat,key,val,name,team,when,extra){
  if(!book||!book[cat])return null;
  const cur=book[cat][key];
  if(!cur||val>cur.val){
    const old = cur ? cur.val : null;
    book[cat][key]={val:val,name:name,team:team,when:when,season:(extra&&extra.season)||0};
    return {old, val, isNew: !cur};
  }
  return null;
}
function recUpBoth(cat,key,val,name,team,when){
  if(S.season&&!S.season.recs)S.season.recs=newRecBook();
  const br1 = recUp(S.season.recs,cat,key,val,name,team,when);
  const c=CAREER.records||(CAREER.records={});
  if(!c.bat)c.bat={};if(!c.pit)c.pit={};if(!c.team)c.team={};
  const br2 = recUp(c,cat,key,val,name,team,when,{season:seasonNo()});
  const br = br1 || br2;
  if(br && S.season){
    const lbl = REC_LABELS[cat]&&REC_LABELS[cat][key]||key;
    const verb = br.isNew ? "締造" : "刷新";
    const diff = (br.old!=null && br.val!=br.old) ? `（原紀錄 ${br.old}）` : "";
    const teamName = team ? getTeam(team).name : "";
    const who = (teamName&&name===teamName) ? teamName : (teamName?teamName+" "+name:name);
    const txt = `★ 單場紀錄 ${verb}：${who}　${lbl} ${br.val}${diff}`;
    const se=S.season;
    se.news = se.news||[];
    se.news.push({day:se.day+1,text:txt,special:true,team:team||null});
    if(se.news.length>10)se.news.shift();
    if(!S.flash) S.flash = txt;
  }
}
function recName(pid){const p=playerById(pid);return p?p.name:pid;}
function recTeam(pid){return teamOfPlayer({id:pid});}
/* 玩家（或任何有完整逐人成績的）比賽掃描 */
function checkMatchRecords(m,when){
  if(!S.season.recs)S.season.recs=newRecBook();
  if(!S.season.recs.bat)S.season.recs=newRecBook();
  for(const pid in m.stats){const s=m.stats[pid];
    ["h","hr","rbi","r","sb","bb","k"].forEach(k=>recUpBoth("bat",k,s[k]||0,recName(pid),recTeam(pid),when));
  }
  for(const pid in m.pstats){const s=m.pstats[pid];
    recUpBoth("pit","k",s.k||0,recName(pid),recTeam(pid),when);
    recUpBoth("pit","ip",Math.round((s.outs||0)/3*10)/10,recName(pid),recTeam(pid),when);
  }
  const aName=getTeam(m.awayId).name,hName=getTeam(m.homeId).name;
  recUpBoth("team","r",m.score.away,aName,m.awayId,when);
  recUpBoth("team","r",m.score.home,hName,m.homeId,when);
  const wId=m.score.away>m.score.home?m.awayId:m.homeId;
  recUpBoth("team","margin",Math.abs(m.score.away-m.score.home),m.winner?getTeam(wId).name:"兩隊",m.winner?wId:"",when);
  recUpBoth("team","innings",m.inning,m.winner?getTeam(wId).name:getTeam(m.homeId).name,m.winner?wId:m.homeId,when);
}
/* 快速模擬比賽的逐人成績掃描（synthGameStats 回傳） */
function checkLineRecords(lines,teamId,when){
  (lines.bat||[]).forEach(s=>{["h","hr","rbi","r","sb","bb","k"].forEach(k=>recUpBoth("bat",k,s[k]||0,recName(s.pid),teamId,when));});
  (lines.pit||[]).forEach(s=>{
    recUpBoth("pit","k",s.k||0,recName(s.pid),teamId,when);
    recUpBoth("pit","ip",Math.round((s.outs||0)/3*10)/10,recName(s.pid),teamId,when);
  });
}
function checkSimTeamRecords(awayId,homeId,ra,rh,when){
  recUpBoth("team","r",ra,getTeam(awayId).name,awayId,when);
  recUpBoth("team","r",rh,getTeam(homeId).name,homeId,when);
  const wId=ra>rh?awayId:homeId;

}

function careLeaderTable(pool,title,valFn,fmt,min,isPit,desc){

function detectNoHitter(b){
  if(!b||b.a===b.h)return null;
  const winSide=b.a>b.h?"away":"home";
  const winTeam=winSide==="away"?b.aw:b.hm,loseTeam=winSide==="away"?b.hm:b.aw;
  const innings=Math.max(((b.line&&b.line.aw)||[]).length,((b.line&&b.line.hm)||[]).length);

  if(boxHitsTeam(b,loseTeam)!==0)return null;
  const errsWin=(b.e&&(winSide==="away"?b.e.away:b.e.home))||0;
  const kind=(boxWalksTeam(b,loseTeam)===0&&errsWin===0)?"perfect":"no";
  return {kind,team:winTeam,against:loseTeam,pitchers:boxPitcherNames(b,winTeam)};
}

/* 更有意義的門檻：避免太頻繁觸發，重大里程碑才通知 */
const MILESTONES=[
  {cat:"hr",steps:[25,50,100,200,300,400,500],label:"全壘打",pit:false},
  {cat:"h",steps:[100,200,500,1000,1500,2000,2500,3000],label:"安打",pit:false},

  {cat:"w",steps:[25,50,100,150,200,250,300],label:"勝投",pit:true},
  {cat:"k",steps:[100,250,500,1000,1500,2000,2500,3000],label:"三振",pit:true},

function milestoneText(mile,pid){
  if(mile.cat==="avg")return `${recName(pid)} 達成生涯打擊率 ${fmtAvg(mile.actual!=null?mile.actual:mile.val)}！（突破 ${fmtAvg(mile.val)} 門檻）`;
  return `${recName(pid)} 達成生涯第 ${mile.val} ${mile.label}！`;
}
/* 檢查跨季里程碑；記錄全聯盟，回傳「玩家球隊」當日的達成清單（供提示） */
function checkMilestones(){
  const se=S.season;if(!se)return[];
  const me=se.playerTeam,merged=careerMerged();
  CAREER.milestones=CAREER.milestones||{};
  // 自清：已記錄門檻高於目前累計總數 → 必為選秀回收舊 pid 的殘留（累計只會成長，不可能倒退），清除該項
  const mileTotal=(pool,pid,def)=>{
    const s=(pool[pid]||{});
    if(def.cat==="avg")return (s.ab||0)>0?s.h/s.ab:0;
    return s[def.cat]||0;
  };
  for(const pid in CAREER.milestones){
    const ms=CAREER.milestones[pid];
    for(const cat in ms){
      const def=MILESTONES.find(d=>d.cat===cat);
      if(!def){delete ms[cat];continue;}
      const pool=def.pit?merged.pit:merged.bat;
      if(def.cat==="avg"){
        // 打擊率是「率」會上下波動：已達成的門檻保留，只有打席崩盤（選秀回收舊 pid）才清除
        if(((pool[pid]||{}).ab||0)<(def.minAB||0))delete ms[cat];
      }else if(mileTotal(pool,pid,def)<ms[cat])delete ms[cat];
    }
    if(!Object.keys(ms).length)delete CAREER.milestones[pid];
  }
  const hit=[];
  const scan=(pool,isPit)=>{
    for(const pid in pool){
      const s=pool[pid]||{},ms=CAREER.milestones[pid]||(CAREER.milestones[pid]={});
      MILESTONES.forEach(def=>{
        if(def.pit!==isPit)return;
        if(def.cat==="avg"){
          const ab=s.ab||0;
          if(ab<(def.minAB||0))return;   // 打擊率需達規定打席
          const avg=s.h/ab;
          def.steps.forEach(step=>{
            if(avg>=step&&step>(ms.avg||0)){ms.avg=step;if(teamOfPlayer({id:pid})===me)hit.push({pid,cat:"avg",label:def.label,val:step,actual:Math.round(avg*1000)/1000});}
          });
          return;
        }
        const val=s[def.cat]||0;
        def.steps.forEach(step=>{
          const crossed=Math.floor(val/step)*step;
          if(crossed<=0)return;
          if(crossed>(ms[def.cat]||0)){ms[def.cat]=crossed;if(teamOfPlayer({id:pid})===me)hit.push({pid,cat:def.cat,label:def.label,val:crossed});}
        });
      });
    }
  };
  scan(merged.bat,false);scan(merged.pit,true);
  return hit;
}
function playerMilestones(pid){return milestonesFrom((CAREER.milestones||{})[pid]);}
/* 里程碑文字（可傳入快照，讓已引退球員重用同一套說明） */
function milestonesFrom(ms){
  ms=ms||{};
  const out=[];
  MILESTONES.forEach(def=>{
    if(ms[def.cat]>0)out.push(def.cat==="avg"?`生涯打擊率 ${fmtAvg(ms[def.cat])}（${HIST_MIN_AB} 打席以上）`:`生涯 ${ms[def.cat]} ${def.label}`);
  });
  return out;
}

function boxTeamSum(b,teamId,field,idx){

function gameHeadline(b,me){
  const awN=getTeam(b.aw).name,hmN=getTeam(b.hm).name;
  if(b.a===b.h)return {s:5,text:`${awN} ${b.a}:${b.h} ${hmN} 和局收場`};
  const awayWin=b.a>b.h;
  const wTeam=awayWin?b.aw:b.hm,lTeam=awayWin?b.hm:b.aw;
  const wN=awayWin?awN:hmN,lN=awayWin?hmN:awN;
  const ws=awayWin?b.a:b.h,ls=awayWin?b.h:b.a;
  const marg=ws-ls,tot=ws+ls;
  const line=b.line||{},la=line.aw||[],lh=line.hm||[];
  const n=Math.max(la.length,lh.length);
  let ca=0,ch=0,defAway=0,defHome=0;
  for(let i=0;i<n;i++){ca+=la[i]||0;ch+=lh[i]||0;defAway=Math.max(defAway,ch-ca);defHome=Math.max(defHome,ca-ch);}
  const deficit=awayWin?defAway:defHome;
  const lastInn=lh[lh.length-1]||0;
  const walkoff=!awayWin&&lastInn>0&&(b.h-lastInn)<=b.a;
  const shutout=ls===0;
  const c=[];
  if(walkoff)c.push({s:95,text:`再見！${wN} 在 ${lh[lh.length-1]||0} 局下逆轉／再見，${ws}:${ls} 擊退 ${lN}`});
  if(shutout)c.push({s:deficit>=3?85:70,text:`完封勝！${wN} 零封 ${lN}（${ws}:0）`});
  if(deficit>=3)c.push({s:80+deficit,text:`大逆轉！${wN} 克服 ${deficit} 分落後，終場 ${ws}:${ls} 逆轉 ${lN}`});
  if(marg>=9)c.push({s:55+marg,text:`一面倒！${wN} 以 ${ws}:${ls} 大勝 ${lN}`});
  if(marg>=5)c.push({s:48+marg,text:`壓倒性優勢！${wN} 以 ${marg} 分差擊敗 ${lN}`});
  if(tot>=16)c.push({s:60+tot,text:`打擊大戰！${awN} ${b.a}:${b.h} ${hmN}　雙方合計 ${tot} 分`});
  if(tot>=12)c.push({s:45+tot,text:`高比分對決！${awN} ${b.a}:${b.h} ${hmN}　合計 ${tot} 分`});
  const wk=boxTeamSum(b,wTeam,"pit",5),lhit=boxHitsTeam(b,lTeam);
  if(wk>=13&&lhit<=3)c.push({s:65+wk,text:`投手無敵！${wN} 三振 ${wk} 次，${lN} 僅 ${lhit} 安打`});
  if(wk>=10&&lhit<=5)c.push({s:55+wk,text:`壓制力十足！${wN} 奪 ${wk} 次三振，限制 ${lN} ${lhit} 安打`});
  if(!c.length)c.push({s:15,text:`${wN} ${ws}:${ls} 擊敗 ${lN}`});
  let best=c.sort((x,y)=>y.s-x.s)[0];
  if(me&&(b.aw===me||b.hm===me))best={s:best.s+18,text:best.text};
  return best;
}
